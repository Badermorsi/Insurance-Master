<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Insurance All List</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7f8;
    color:#17252b;
}

body{
    overflow:hidden;
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar{
    height:54px;
    background:#ffffff;
    border-bottom:1px solid #dfe7ea;
    display:flex;
    align-items:center;
    padding:0 18px;
    box-shadow:0 2px 10px rgba(20,50,60,.05);
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;
    font-size:18px;
    font-weight:800;
    color:#15343d;
    letter-spacing:-.3px;
}

.brand-logo{
    width:30px;
    height:30px;
    border-radius:8px;
    background:linear-gradient(145deg,#147b8c,#0e5969);
    position:relative;
    box-shadow:0 3px 8px rgba(15,100,120,.2);
}

.brand-logo:before,
.brand-logo:after{
    content:"";
    position:absolute;
    background:#fff;
    border-radius:2px;
}

.brand-logo:before{
    width:16px;
    height:4px;
    left:7px;
    top:13px;
}

.brand-logo:after{
    width:4px;
    height:16px;
    left:13px;
    top:7px;
}

/* =========================================================
   TABS
========================================================= */

.tabs-area{
    background:#ffffff;
    border-bottom:1px solid #dce5e8;
    padding:7px 10px 8px;
}

.tabs{
    display:grid;
    grid-template-columns:repeat(15,minmax(0,1fr));
    gap:5px;
    width:100%;
}

.tab{
    height:31px;
    border:1px solid #d7e2e5;
    background:#f7f9fa;
    color:#40545b;
    border-radius:7px;
    font-size:10.5px;
    font-weight:700;
    padding:0 5px;
    cursor:pointer;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    transition:.15s ease;
}

.tab:hover{
    background:#eef5f6;
    border-color:#b8d1d6;
}

.tab.active{
    background:#126f81;
    color:#fff;
    border-color:#126f81;
    box-shadow:0 3px 8px rgba(18,111,129,.2);
}

/* =========================================================
   TABLE HEADER BAR
========================================================= */

.table-toolbar{
    height:45px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 14px;
    background:#f8fafb;
    border-bottom:1px solid #dfe7ea;
}

.table-title{
    font-size:14px;
    font-weight:800;
    color:#17353e;
}

.table-info{
    display:flex;
    align-items:center;
    gap:9px;
}

.record-count{
    font-size:11px;
    color:#71838a;
}

.clear-btn{
    border:1px solid #cddcdf;
    background:#fff;
    color:#34515a;
    border-radius:6px;
    padding:5px 10px;
    font-size:10px;
    font-weight:700;
    cursor:pointer;
}

.clear-btn:hover{
    background:#eef5f6;
}

/* =========================================================
   TABLE AREA
========================================================= */

.table-wrap{
    position:relative;
    height:calc(100vh - 54px - 46px - 45px);
    overflow:auto;
    background:#fff;
}

.table{
    border-collapse:separate;
    border-spacing:0;
    table-layout:fixed;
    width:max-content;
    min-width:100%;
}

thead{
    position:sticky;
    top:0;
    z-index:30;
}

th{
    height:46px;
    background:#173d47;
    color:#fff;
    border-right:1px solid rgba(255,255,255,.12);
    border-bottom:1px solid #12343d;
    font-size:12px;
    font-weight:800;
    text-align:center;
    padding:7px 8px;
    white-space:normal;
    line-height:1.15;
    position:relative;
}

td{
    height:34px;
    padding:5px 8px;
    border-right:1px solid #e4ebed;
    border-bottom:1px solid #e8eef0;
    font-size:11px;
    color:#263a41;
    background:#fff;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    text-align:center;
}

tbody tr:nth-child(even) td{
    background:#f8fafb;
}

tbody tr:hover td{
    background:#edf6f8;
}

/* =========================================================
   FILTER BUTTON
========================================================= */

.filter-btn{
    position:absolute;
    right:4px;
    top:5px;
    width:22px;
    height:22px;
    border:0;
    border-radius:4px;
    background:rgba(255,255,255,.1);
    color:#fff;
    cursor:pointer;
    font-size:11px;
    padding:0;
}

.filter-btn:hover{
    background:rgba(255,255,255,.22);
}

.filter-btn.filtered{
    background:#55c3d4;
    color:#07353e;
}

/* =========================================================
   FILTER POPUP
========================================================= */

.filter-popup{
    position:fixed;
    width:300px;
    max-height:410px;
    background:#fff;
    border:1px solid #ccdadd;
    border-radius:9px;
    box-shadow:0 12px 35px rgba(20,45,55,.22);
    z-index:1000;
    display:none;
    overflow:hidden;
}

.filter-popup.show{
    display:block;
}

.filter-top{
    padding:9px;
    border-bottom:1px solid #e1e8ea;
}

.filter-search{
    width:100%;
    height:31px;
    border:1px solid #ccdadd;
    border-radius:6px;
    padding:0 9px;
    outline:none;
    font-size:11px;
}

.filter-search:focus{
    border-color:#14778a;
}

.filter-actions{
    display:flex;
    align-items:center;
    gap:5px;
    margin-top:7px;
}

.filter-actions button{
    border:1px solid #d0dfe2;
    background:#f8fafb;
    border-radius:5px;
    padding:4px 7px;
    font-size:10px;
    cursor:pointer;
}

.filter-actions button:hover{
    background:#edf5f6;
}

.filter-options{
    max-height:295px;
    overflow:auto;
    padding:5px 8px;
}

.filter-option{
    display:flex;
    align-items:center;
    gap:7px;
    min-height:27px;
    font-size:11px;
    cursor:pointer;
}

.filter-option input{
    width:14px;
    height:14px;
}

.filter-bottom{
    border-top:1px solid #e1e8ea;
    padding:8px;
    display:flex;
    justify-content:flex-end;
    gap:6px;
}

.filter-bottom button{
    border-radius:5px;
    padding:6px 12px;
    font-size:10px;
    font-weight:700;
    cursor:pointer;
}

.cancel-filter{
    background:#fff;
    border:1px solid #ccdadd;
}

.apply-filter{
    background:#14778a;
    border:1px solid #14778a;
    color:#fff;
}

/* =========================================================
   APG YES / NO
========================================================= */

.apg-yes{
    background:#dff3e4 !important;
    color:#176b31 !important;
    font-weight:800;
}

.apg-no{
    background:#fbe1e1 !important;
    color:#9a2929 !important;
    font-weight:800;
}

/* =========================================================
   LOADING
========================================================= */

.loading{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#60767d;
    font-size:13px;
}

.spinner{
    width:20px;
    height:20px;
    border:3px solid #d8e7ea;
    border-top-color:#14778a;
    border-radius:50%;
    animation:spin .7s linear infinite;
    margin-right:9px;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

/* =========================================================
   ELIGIBILITY PORTALS SPECIAL TABLE
========================================================= */

.eligibility-wrap{
    height:100%;
    overflow:auto;
    background:#fff;
    padding:18px;
}

.eligibility-table{
    border-collapse:collapse;
    table-layout:fixed;
    width:100%;
    min-width:900px;
}

.eligibility-table th,
.eligibility-table td{
    border:1px solid #cbd9dc;
}

.eligibility-table td{
    height:35px;
    font-size:12px;
    padding:6px 9px;
    text-align:center;
    vertical-align:middle;
    background:#fff;
    white-space:normal;
    overflow:visible;
    text-overflow:clip;
}

.eligibility-table .top-label{
    background:#eef5f6;
    font-weight:800;
    color:#29474f;
    font-size:12px;
}

.eligibility-table .al-ain{
    background:#dceff2;
    font-size:15px;
    font-weight:900;
    color:#174954;
}

.eligibility-table .branch{
    background:#f5f8f9;
    font-weight:800;
    font-size:12px;
}

.eligibility-table .main-header{
    height:52px;
    background:#173d47;
    color:#fff;
    font-size:14px;
    font-weight:900;
    line-height:1.15;
}

.eligibility-table .portal-name{
    font-weight:800;
    font-size:12px;
    color:#183d46;
}

.eligibility-table .link-cell a{
    color:#08728a;
    font-weight:700;
    text-decoration:none;
}

.eligibility-table .link-cell a:hover{
    text-decoration:underline;
}

.eligibility-table .license{
    font-weight:700;
    color:#405960;
}

.eligibility-table tr.data-row:hover td{
    background:#edf6f8;
}

.eligibility-table tr.data-row:hover td[rowspan]{
    background:#e4f2f4;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1500px){
    .tabs{
        grid-template-columns:repeat(12,minmax(0,1fr));
    }
}

@media(max-width:1200px){
    .tabs{
        grid-template-columns:repeat(10,minmax(0,1fr));
    }
}

@media(max-width:1000px){
    .tabs{
        grid-template-columns:repeat(8,minmax(0,1fr));
    }
}

@media(max-width:800px){
    .tabs{
        grid-template-columns:repeat(6,minmax(0,1fr));
    }
}

@media(max-width:600px){
    .tabs{
        grid-template-columns:repeat(3,minmax(0,1fr));
    }

    .tab{
        font-size:9px;
    }

    .eligibility-wrap{
        padding:8px;
    }
}
</style>
</head>

<body>

========================================================= -->

    </div>
</div>

<!-- =========================================================
     TABS
========================================================= -->

<div class="tabs-area">

</div>

     TOOLBAR
========================================================= -->

<div class="table-toolbar">
    <div id="tableTitle" class="table-title">Loading...</div>

    <div class="table-info">

<div id="mainArea" class="table-wrap">

</div>

<script>

/* =========================================================

    {

    },

    {

    },

    {

    },

    {

        name:"Proactive Instruction",
        files:["Proactive Instruction.json"]
    },

    {
        id:"refill",
        name:"Refill date",
        files:["Refill date.json"]
    },

    {
        id:"rx_validity",
        name:"Rx Validity",
        files:["Rx Validity.json"]
    },

    {
        id:"search",
        name:"Search 🔍",
        files:["Search 🔍.json"]
    },

    {
        id:"vitamins",
        name:"Vitamins",
        files:["Vitamins.json"]
    }
];


/* =========================================================
   STATE
========================================================= */

const cache = new Map();
const filterState = new Map();

let currentTab = null;

let activeFilterColumn = null;
let activeFilterTab = null;

let temporaryFilterValues = new Set();


/* =========================================================
   DOM
========================================================= */

const tabsEl = document.getElementById("tabs");
const mainArea = document.getElementById("mainArea");
const tableTitle = document.getElementById("tableTitle");
const recordCount = document.getElementById("recordCount");
const clearFilters = document.getElementById("clearFilters");

const filterPopup = document.getElementById("filterPopup");
const filterSearch = document.getElementById("filterSearch");
const filterOptions = document.getElementById("filterOptions");

const selectAll = document.getElementById("selectAll");
const unselectAll = document.getElementById("unselectAll");
const cancelFilter = document.getElementById("cancelFilter");
const applyFilter = document.getElementById("applyFilter");


/* =========================================================
   CREATE TABS
========================================================= */

function createTabs(){

    tabsEl.innerHTML = "";

    tabsConfig.forEach(tab => {

        const button = document.createElement("button");

        button.className = "tab";
        button.textContent = tab.name;
        button.dataset.id = tab.id;

        button.addEventListener("click", () => {
            openTab(tab.id);
        });

        tabsEl.appendChild(button);
    });
}


/* =========================================================
   LOAD JSON
========================================================= */

async function loadFile(file){

    const response = await fetch(
        "./" + encodeURIComponent(file),
        {
            cache:"force-cache"
        }
    );

    if(!response.ok){
        throw new Error(
            `Cannot load ${file} (${response.status})`
        );
    }

    const json = await response.json();

    if(Array.isArray(json)){
        return json;
    }

    if(Array.isArray(json.data)){
        return json.data;
    }

    if(Array.isArray(json.rows)){
        return json.rows;
    }

    if(Array.isArray(json.records)){
        return json.records;
    }

    if(Array.isArray(json.items)){
        return json.items;
    }

    return [];
}


/* =========================================================
   LOAD TAB
========================================================= */

async function loadTab(tab){

    if(cache.has(tab.id)){
        return cache.get(tab.id);
    }

    const parts = await Promise.all(
        tab.files.map(file => loadFile(file))
    );

    let rows = [];

    parts.forEach(part => {
        rows = rows.concat(part);
    });

    cache.set(tab.id, rows);

    return rows;
}


/* =========================================================
   GET COLUMNS
========================================================= */

function getColumns(tab, rows){

    const set = new Set();

    rows.forEach(row => {

        if(!row || typeof row !== "object"){
            return;
        }

        Object.keys(row).forEach(key => {
            set.add(key);
        });
    });

    let columns = Array.from(set);

    /* APG THIQA/BASIC MUST BE FAR RIGHT */

    if(tab.id === "apg"){

        const thiqa = columns.find(
            c => String(c).trim().toLowerCase() === "thiqa"
        );

        const basic = columns.find(
            c => String(c).trim().toLowerCase() === "basic"
        );

        columns = columns.filter(
            c => c !== thiqa && c !== basic
        );

        if(thiqa){
            columns.push(thiqa);
        }

        if(basic){
            columns.push(basic);
        }
    }

    return columns;
}


/* =========================================================
   FORMAT VALUE
========================================================= */

function formatValue(value){

    if(value === null || value === undefined){
        return "";
    }

    if(typeof value === "object"){
        try{
            return JSON.stringify(value);
        }catch{
            return String(value);
        }
    }

    return String(value);
}


/* =========================================================
   NORMALIZE
========================================================= */

function normalize(value){

    return String(value ?? "")
        .trim()
        .toLowerCase();
}


/* =========================================================
   YES / NO
========================================================= */

function yesNoClass(tab,column,value){

    if(tab.id !== "apg"){
        return "";
    }

    const name = normalize(column);
    const val = normalize(value);

    if(
        (name === "thiqa" || name === "basic") &&
        val === "yes"
    ){
        return "apg-yes";
    }

    if(
        (name === "thiqa" || name === "basic") &&
        val === "no"
    ){
        return "apg-no";
    }

    return "";
}


/* =========================================================
   FILTER MATCH
========================================================= */

function matchesFilters(tabId,row){

    const filters = filterState.get(tabId);

    if(!filters){
        return true;
    }

    for(const [column,selected] of filters){

        if(!selected || selected.size === 0){
            continue;
        }

        const value = formatValue(row[column]);

        if(!selected.has(value)){
            return false;
        }
    }

    return true;
}


/* =========================================================
   FILTER ROWS
========================================================= */

function filteredRows(tabId,rows){

    return rows.filter(
        row => matchesFilters(tabId,row)
    );
}


/* =========================================================
   CLEAR FILTERS
========================================================= */

clearFilters.addEventListener("click",()=>{

    if(!currentTab){
        return;
    }

    filterState.delete(currentTab.id);

    renderCurrentTab();
});


/* =========================================================
   OPEN TAB
========================================================= */

async function openTab(id){

    const tab = tabsConfig.find(
        t => t.id === id
    );

    if(!tab){
        return;
    }

    currentTab = tab;

    document
        .querySelectorAll(".tab")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.id === id
            );
        });

    tableTitle.textContent = tab.name;
    recordCount.textContent = "";

    closeFilterPopup();

    mainArea.innerHTML = `
        <div class="loading">
            <div class="spinner"></div>
            Loading...
        </div>
    `;

    try{

        const rows = await loadTab(tab);

        if(currentTab.id !== id){
            return;
        }

        renderCurrentTab(rows);

    }catch(error){

        console.error(error);

        mainArea.innerHTML = `
            <div class="loading">
                Failed to load data.
            </div>
        `;
    }
}


/* =========================================================
   RENDER CURRENT
========================================================= */

async function renderCurrentTab(rows){

    if(!currentTab){
        return;
    }

    if(!rows){
        rows = cache.get(currentTab.id) || [];
    }

    if(currentTab.special === "eligibility"){

        renderEligibility(rows);
        return;
    }

    renderNormalTable(currentTab,rows);
}


/* =========================================================
   NORMAL TABLE
========================================================= */

function renderNormalTable(tab,rows){

    const columns = getColumns(tab,rows);
    const visibleRows = filteredRows(tab.id,rows);

    recordCount.textContent =
        `${visibleRows.length.toLocaleString()} / ${rows.length.toLocaleString()} records`;

    mainArea.innerHTML = "";

    const table = document.createElement("table");
    table.className = "table";

    /* WIDTHS */

    const colgroup = document.createElement("colgroup");

    columns.forEach(column => {

        const col = document.createElement("col");

        let width = 110;

        if(
            tab.id === "apg" &&
            (
                normalize(column) === "thiqa" ||
                normalize(column) === "basic"
            )
        ){
            width = 82;
        }else{

            let maxLength =
                String(column).length;

            for(let i=0;i<Math.min(rows.length,180);i++){

                const value =
                    formatValue(rows[i]?.[column]);

                maxLength =
                    Math.max(
                        maxLength,
                        value.length
                    );
            }

            width =
                Math.max(
                    78,
                    Math.min(
                        190,
                        25 + maxLength * 6
                    )
                );

            if(maxLength <= 12){
                width = Math.min(width,105);
            }
        }

        col.style.width = width + "px";

        colgroup.appendChild(col);
    });

    table.appendChild(colgroup);

    /* HEADER */

    const thead = document.createElement("thead");
    const headerRow = document.createElement("tr");

    columns.forEach(column => {

        const th = document.createElement("th");

        th.textContent = column;

        const button =
            document.createElement("button");

        button.className = "filter-btn";
        button.innerHTML = "▼";
        button.title = "Filter";

        const existing =
            filterState.get(tab.id)?.get(column);

        if(existing){
            button.classList.add("filtered");
        }

        button.addEventListener("click",(event)=>{
            event.stopPropagation();

            openFilter(
                tab,
                rows,
                column,
                button
            );
        });

        th.appendChild(button);
        headerRow.appendChild(th);
    });

    thead.appendChild(headerRow);
    table.appendChild(thead);

    /* BODY */

    const tbody = document.createElement("tbody");

    visibleRows.forEach(row => {

        const tr = document.createElement("tr");

        columns.forEach(column => {

            const td = document.createElement("td");

            const value =
                formatValue(row[column]);

            td.textContent = value;
            td.title = value;

            const specialClass =
                yesNoClass(
                    tab,
                    column,
                    value
                );

            if(specialClass){
                td.classList.add(specialClass);
            }

            tr.appendChild(td);
        });

        tbody.appendChild(tr);
    });

    table.appendChild(tbody);

    mainArea.appendChild(table);
}


/* =========================================================

/* =========================================================
   ELIGIBILITY HELPERS
========================================================= */

function getEligibilityValue(item,keys){

    if(!item || typeof item !== "object"){
        return "";
    }

    for(const key of keys){

        if(
            Object.prototype.hasOwnProperty.call(
                item,
                key
            )
        ){

            return formatValue(item[key]);
        }
    }

    /* Case-insensitive fallback */

    const normalizedKeys =
        keys.map(k => normalize(k));

    for(const actualKey of Object.keys(item)){

        if(
            normalizedKeys.includes(
                normalize(actualKey)
            )
        ){

            return formatValue(
                item[actualKey]
            );
        }
    }

    return "";
}


/* =========================================================
   GET BRANCH VALUE
========================================================= */

function getBranchValue(item,branch){

    if(!item || typeof item !== "object"){
        return "";
    }

    const wanted =
        normalize(branch);

    for(const key of Object.keys(item)){

        if(
            normalize(key) === wanted
        ){
            return formatValue(item[key]);
        }
    }

    return "";
}


/* =========================================================
   SECOND ELIGIBILITY ROW
========================================================= */

function getEligibilitySecondRow(item){

    /*
       Supports JSON files where the second line of
       each portal is stored using alternate field names.
    */

    const values = [];

    values.push(
        getEligibilityValue(
            item,
            [
                "Link 2",
                "LINK 2",
                "URL 2",
                "Website 2"
            ]
        )
    );

    values.push(
        getEligibilityValue(
            item,
            [
                "H.A. License Code 2",
                "HA License Code 2",
                "License Code 2"
            ]
        )
    );

    values.push(
        getEligibilityValue(
            item,
            [
                "PF1681 2",
                "PF 1681 2"
            ]
        )
    );

    values.push(
        getEligibilityValue(
            item,
            [
                "PF 5068 2"
            ]
        )
    );

    values.push(
        getEligibilityValue(
            item,
            [
                "PF 5408 2"
            ]
        )
    );

    return values;
}


/* =========================================================
   URL CHECK
========================================================= */

function isURL(value){

    if(!value){
        return false;
    }

    try{

        const url =
            new URL(value);

        return (
            url.protocol === "http:" ||
            url.protocol === "https:"
        );

    }catch{

        return false;
    }
}


/* =========================================================
   FILTER
========================================================= */

function openFilter(tab,rows,column,button){

    activeFilterTab = tab;
    activeFilterColumn = column;

    const values =
        new Set();

    rows.forEach(row => {

        values.add(
            formatValue(row[column])
        );
    });

    const existing =
        filterState.get(tab.id)?.get(column);

    if(existing){
        temporaryFilterValues =
            new Set(existing);
    }else{
        temporaryFilterValues =
            new Set(values);
    }

    renderFilterOptions(
        Array.from(values).sort(
            (a,b) =>
                a.localeCompare(
                    b,
                    undefined,
                    {
                        numeric:true,
                        sensitivity:"base"
                    }
                )
        )
    );

    const rect =
        button.getBoundingClientRect();

    let left =
        rect.left;

    let top =
        rect.bottom + 5;

    if(left + 300 > window.innerWidth){
        left =
            window.innerWidth - 310;
    }

    if(top + 410 > window.innerHeight){
        top =
            rect.top - 415;
    }

    filterPopup.style.left =
        Math.max(5,left) + "px";

    filterPopup.style.top =
        Math.max(5,top) + "px";

    filterPopup.classList.add("show");

    filterSearch.value = "";

    setTimeout(
        () => filterSearch.focus(),
        0
    );
}


/* =========================================================
   RENDER FILTER OPTIONS
========================================================= */

function renderFilterOptions(values){

    filterOptions.innerHTML = "";

    values.forEach(value => {

        const label =
            document.createElement("label");

        label.className =
            "filter-option";

        const checkbox =
            document.createElement("input");

        checkbox.type =
            "checkbox";

        checkbox.value =
            value;

        checkbox.checked =
            temporaryFilterValues.has(value);

        checkbox.addEventListener(
            "change",
            ()=>{
                if(checkbox.checked){
                    temporaryFilterValues.add(value);
                }else{
                    temporaryFilterValues.delete(value);
                }
            }
        );

        const text =
            document.createElement("span");

        text.textContent =
            value === "" ? "(blank)" : value;

        label.appendChild(checkbox);
        label.appendChild(text);

        filterOptions.appendChild(label);
    });
}


/* =========================================================
   FILTER SEARCH
========================================================= */

filterSearch.addEventListener(
    "input",
    ()=>{
        const search =
            normalize(filterSearch.value);

        document
            .querySelectorAll(
                ".filter-option"
            )
            .forEach(option => {

                const text =
                    normalize(
                        option
                            .querySelector("span")
                            .textContent
                    );

                option.style.display =
                    text.includes(search)
                        ? "flex"
                        : "none";
            });
    }
);


/* =========================================================
   SELECT ALL
========================================================= */

selectAll.addEventListener(
    "click",
    ()=>{

        document
            .querySelectorAll(
                ".filter-option"
            )
            .forEach(option => {

                if(
                    option.style.display === "none"
                ){
                    return;
                }

                const checkbox =
                    option.querySelector(
                        "input"
                    );

                checkbox.checked = true;

                temporaryFilterValues.add(
                    checkbox.value
                );
            });
    }
);


/* =========================================================
   UNSELECT ALL
========================================================= */

unselectAll.addEventListener(
    "click",
    ()=>{

        document
            .querySelectorAll(
                ".filter-option"
            )
            .forEach(option => {

                if(
                    option.style.display === "none"
                ){
                    return;
                }

                const checkbox =
                    option.querySelector(
                        "input"
                    );

                checkbox.checked = false;

                temporaryFilterValues.delete(
                    checkbox.value
                );
            });
    }
);


/* =========================================================
   APPLY FILTER
========================================================= */

applyFilter.addEventListener(
    "click",
    ()=>{

        if(
            !activeFilterTab ||
            !activeFilterColumn
        ){
            return;
        }

        if(!filterState.has(
            activeFilterTab.id
        )){
            filterState.set(
                activeFilterTab.id,
                new Map()
            );
        }

        const filters =
            filterState.get(
                activeFilterTab.id
            );

        const allValues =
            new Set();

        const rows =
            cache.get(
                activeFilterTab.id
            ) || [];

        rows.forEach(row=>{
            allValues.add(
                formatValue(
                    row[activeFilterColumn]
                )
            );
        });

        /*
           If every value is selected,
           remove the filter completely.
        */

        if(
            temporaryFilterValues.size ===
            allValues.size
        ){

            filters.delete(
                activeFilterColumn
            );

        }else{

            filters.set(
                activeFilterColumn,
                new Set(
                    temporaryFilterValues
                )
            );
        }

        closeFilterPopup();

        renderCurrentTab();
    }
);


/* =========================================================
   CANCEL
========================================================= */

cancelFilter.addEventListener(
    "click",
    closeFilterPopup
);


/* =========================================================
   CLOSE FILTER
========================================================= */

function closeFilterPopup(){

    filterPopup.classList.remove("show");

    activeFilterTab = null;
    activeFilterColumn = null;
}


/* =========================================================
   CLICK OUTSIDE
========================================================= */

document.addEventListener(
    "click",
    event => {

        if(
            filterPopup.classList.contains("show") &&
            !filterPopup.contains(event.target) &&
            !event.target.classList.contains("filter-btn")
        ){
            closeFilterPopup();
        }
    }
);


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(event.key === "Escape"){
            closeFilterPopup();
        }
    }
);


/* =========================================================
   PRELOAD OTHER TABS
========================================================= */

function preloadOtherTabs(){

    const others =
        tabsConfig.filter(
            t => t.id !== currentTab?.id
        );

    let index = 0;

    function next(){

        if(index >= others.length){
            return;
        }

        const tab =
            others[index++];

        if(!cache.has(tab.id)){

            loadTab(tab)
                .catch(error=>{
                    console.warn(
                        "Preload failed:",
                        tab.name,
                        error
                    );
                });
        }

        setTimeout(next,35);
    }

    next();
}


/* =========================================================
   START
========================================================= */

createTabs();

openTab("apg");

if("requestIdleCallback" in window){

    requestIdleCallback(
        preloadOtherTabs,
        {
            timeout:1200
        }
    );

}else{

    setTimeout(
        preloadOtherTabs,
        1200
    );
}
