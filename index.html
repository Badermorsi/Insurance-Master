<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Insurance All List</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
}

body{
    font-family:
        Inter,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background:#f3f6f8;
    color:#17232d;

    overflow:hidden;
}

button,
input{
    font-family:inherit;
}


/* =========================================================
   APP
========================================================= */

.app{
    width:100%;
    height:100vh;

    display:flex;
    flex-direction:column;

    overflow:hidden;
}


/* =========================================================
   BRAND
========================================================= */

.brand-bar{
    flex:0 0 50px;

    display:flex;
    align-items:center;

    padding:0 18px;

    background:#ffffff;

    border-bottom:1px solid #e5eaee;
}

.logo{
    width:31px;
    height:31px;

    border-radius:8px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            145deg,
            #0f6878,
            #238da0
        );

    color:#ffffff;

    font-size:18px;
    font-weight:800;

    box-shadow:
        0 4px 10px rgba(15,104,120,.20);
}

.logo::before{
    content:"+";
}

.brand-name{
    margin-left:10px;

    font-size:16px;
    font-weight:750;

    color:#20313b;
}


/* =========================================================
   TABS
========================================================= */

.tabs-section{
    flex:0 0 auto;

    padding:8px 12px 9px;

    background:#f3f6f8;

    border-bottom:1px solid #dfe5e9;
}

.tabs-grid{
    width:100%;

    display:grid;

    grid-template-columns:
        repeat(15,minmax(0,1fr));

    gap:4px;
}

.tab{
    width:100%;
    min-width:0;

    height:30px;

    padding:0 6px;

    border:1px solid #d8e0e5;

    border-radius:6px;

    background:#ffffff;

    color:#53636e;

    font-size:10.5px;
    font-weight:650;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;

    cursor:pointer;

    transition:
        background .12s ease,
        color .12s ease,
        border-color .12s ease,
        box-shadow .12s ease;
}

.tab:hover{
    background:#edf7f9;
    border-color:#9fc3cb;
    color:#12697a;
}

.tab.active{
    background:
        linear-gradient(
            135deg,
            #125f70,
            #19869a
        );

    color:#ffffff;

    border-color:#125f70;

    box-shadow:
        0 3px 8px rgba(18,95,112,.22);
}


/* =========================================================
   TABLE BAR
========================================================= */

.table-bar{
    flex:0 0 43px;

    display:flex;
    align-items:center;

    padding:0 14px;

    background:#ffffff;

    border-bottom:1px solid #dfe5e9;
}

.list-name{
    display:flex;
    align-items:center;

    color:#263943;

    font-size:11.5px;
    font-weight:750;
}

.list-dot{
    width:6px;
    height:6px;

    margin-right:7px;

    border-radius:50%;

    background:#1b9a85;
}

.record-pill{
    margin-left:9px;

    padding:3px 9px;

    border-radius:20px;

    background:#eef5f6;

    color:#337483;

    font-size:9.5px;
    font-weight:700;
}

.bar-space{
    flex:1;
}

.clear-button{
    height:28px;

    padding:0 11px;

    border:1px solid #d8e0e4;

    border-radius:6px;

    background:#ffffff;

    color:#667680;

    font-size:9.5px;
    font-weight:700;

    cursor:pointer;
}

.clear-button:hover{
    background:#edf7f8;
    color:#12697a;
    border-color:#9fc3cb;
}


/* =========================================================
   TABLE VIEW
========================================================= */

.table-view{
    position:relative;

    flex:1 1 auto;

    min-height:0;

    overflow:auto;

    background:#ffffff;
}


/* =========================================================
   NORMAL TABLE
========================================================= */

.data-table{
    border-collapse:separate;
    border-spacing:0;

    width:max-content;
    min-width:100%;

    table-layout:fixed;

    font-size:11px;
}

.data-table thead{
    position:sticky;
    top:0;
    z-index:100;
}

.data-table th{
    height:46px;

    padding:0;

    background:#eaf1f3;

    color:#263a44;

    border-right:1px solid #d5dfe3;
    border-bottom:2px solid #c3d1d6;

    font-size:11.5px;
    font-weight:800;

    text-align:center;
    vertical-align:middle;
}

.data-table th:first-child{
    border-left:1px solid #d5dfe3;
}

.header-content{
    width:100%;
    height:46px;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:5px;

    padding:4px 5px;
}

.header-label{
    line-height:14px;
    text-align:center;

    overflow-wrap:anywhere;
}

.filter-button{
    flex:0 0 20px;

    width:20px;
    height:20px;

    padding:0;

    border:1px solid #c6d1d6;

    border-radius:4px;

    background:#ffffff;

    color:#65757e;

    font-size:8px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;
}

.filter-button:hover{
    background:#dff0f3;
    color:#12697a;
    border-color:#75aeb9;
}

.filter-button.active{
    background:#12697a;
    color:#ffffff;
    border-color:#12697a;
}


/* =========================================================
   NORMAL BODY
========================================================= */

.data-table td{
    height:34px;

    padding:5px 7px;

    background:#ffffff;

    color:#34434c;

    border-right:1px solid #e8edef;
    border-bottom:1px solid #e7ecef;

    text-align:center;
    vertical-align:middle;

    line-height:15px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.data-table tbody tr:nth-child(even) td{
    background:#fbfcfd;
}

.data-table tbody tr:hover td{
    background:#eef7f8;
}


/* =========================================================
   APG
========================================================= */

.apg-yes{
    background:#dff3e7 !important;
    color:#17683b !important;
    font-weight:750 !important;
}

.apg-no{
    background:#fde5e5 !important;
    color:#a43d3d !important;
    font-weight:750 !important;
}

.freeze-right-1{
    position:sticky !important;
    right:0;
    z-index:80;

    box-shadow:
        -4px 0 7px rgba(30,50,60,.07);
}

.freeze-right-2{
    position:sticky !important;
    right:82px;
    z-index:80;
}

thead .freeze-right-1,
thead .freeze-right-2{
    z-index:150;
}

.apg-frozen{
    font-weight:800 !important;
}


/* =========================================================
   ELIGIBILITY
========================================================= */

.eligibility-table{
    width:100% !important;
    min-width:850px;

    table-layout:fixed;

    border-collapse:separate;
    border-spacing:0;

    font-size:12px;
}

.eligibility-table col.col-a{
    width:230px;
}

.eligibility-table col.col-b{
    width:430px;
}

.eligibility-table col.col-c{
    width:160px;
}

.eligibility-table col.col-d,

}

.eligibility-table .top-header{
    height:38px;

    background:#f0f5f6;

    color:#243943;

    border-right:1px solid #d3dfe3;
    border-bottom:1px solid #cbd8dc;

    font-size:12px;
    font-weight:800;

    text-align:center;
    vertical-align:middle;
}

.eligibility-table .top-empty{
    background:#ffffff !important;

    border-bottom:1px solid #ffffff !important;
}

.eligibility-table .main-header{
    height:50px;

    background:#dcebed;

    color:#1f3741;

    border-right:1px solid #c3d4d9;
    border-bottom:2px solid #aebfc5;

    font-size:14px;
    font-weight:900;

    text-align:center;
    vertical-align:middle;

    line-height:17px;
}

.eligibility-table .main-header:first-child{
    border-left:1px solid #c3d4d9;
}

.eligibility-table tbody td{

    padding:7px 9px;

    background:#ffffff;

    color:#34434c;

    border-right:1px solid #e1e8eb;
    border-bottom:1px solid #e1e8eb;

    text-align:center;
    vertical-align:middle;

    font-size:12px;

    line-height:17px;
}

.eligibility-table tbody tr:nth-child(even) td{
    background:#fbfcfd;
}

.eligibility-portal{
    font-weight:900 !important;

    color:#1e3540 !important;

    font-size:13px !important;
}

.eligibility-link{
    color:#126f82 !important;

    text-decoration:none;

    font-weight:650;

    white-space:nowrap;

    overflow:hidden;
    text-overflow:ellipsis;

    display:block;
}

.eligibility-link:hover{
    text-decoration:underline;
}

.eligibility-type{
    font-weight:750 !important;

    color:#53656e !important;
}


/* =========================================================
   LOADING
========================================================= */

.loading{
    position:absolute;

    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#ffffff;
}

.loading-box{
    display:flex;

    flex-direction:column;

    align-items:center;

    gap:10px;
}

.spinner{
    width:26px;
    height:26px;

    border:2px solid #dce7ea;

    border-top-color:#14778a;

    border-radius:50%;

    animation:spin .6s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.loading-text{
    color:#7c8b94;

    font-size:10.5px;
    font-weight:650;
}

.empty{
    position:absolute;

    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#89969e;

    font-size:11px;
}

.error{
    margin:20px;

    padding:16px 18px;

    border-radius:8px;

    background:#fff7f7;

    border:1px solid #edd0d0;

    color:#a04444;

    font-size:11px;

    line-height:1.6;
}


/* =========================================================
   FILTER
========================================================= */

.filter-popup{
    display:none;

    position:fixed;

    z-index:9999;

    width:300px;

    background:#ffffff;

    border:1px solid #d5dfe3;

    border-radius:9px;

    overflow:hidden;

.filter-header{

.filter-title{

    font-size:11px;
    font-weight:800;
}

.filter-subtitle{

    color:#87949c;

    font-size:8.5px;
}

.filter-search-wrap{
    padding:8px 9px 4px;
}

.filter-search{
    width:100%;
    height:31px;

    padding:0 9px;

    border:1px solid #d6dfe3;

    border-radius:5px;

    outline:none;

    font-size:10px;

    color:#33434c;
}

.filter-search:focus{
    border-color:#78acb6;

    box-shadow:

}

.filter-actions{
    display:flex;

    gap:5px;

    padding:4px 9px 7px;
}

.filter-action{
    flex:1;

    height:27px;

    border:1px solid #dce2e5;

    border-radius:5px;

    background:#ffffff;

    color:#64747d;

    font-size:9px;
    font-weight:700;

    cursor:pointer;
}

.filter-action:hover{
    background:#f2f7f8;
}

.filter-values{
    max-height:245px;

    overflow-y:auto;

    border-top:1px solid #e4e9ec;
    border-bottom:1px solid #e4e9ec;
}

.filter-value{
    min-height:29px;

    display:flex;
    align-items:center;

    gap:7px;

    padding:4px 10px;

    color:#44525b;

    font-size:9.5px;

    cursor:pointer;
}

.filter-value:hover{
    background:#eef7f8;
}

.filter-value input{
    width:13px;
    height:13px;

    margin:0;

    accent-color:#14778a;
}

.filter-value-text{
    min-width:0;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}

.filter-footer{
    display:flex;

    gap:5px;

    padding:8px 9px;
}

.filter-footer button{
    flex:1;

    height:31px;

    border-radius:5px;

    font-size:9.5px;
    font-weight:750;

    cursor:pointer;
}

.cancel{
    background:#ffffff;

    border:1px solid #d8e0e4;

    color:#697780;
}

.apply{
    background:#14778a;

    border:1px solid #14778a;

    color:#ffffff;
}

.apply:hover{
    background:#0f6575;
}


/* =========================================================
   SCROLLBAR
========================================================= */

::-webkit-scrollbar{
    width:8px;
    height:8px;
}

::-webkit-scrollbar-track{
    background:#f1f4f5;
}

::-webkit-scrollbar-thumb{
    background:#c6d1d5;

    border-radius:20px;
}

::-webkit-scrollbar-thumb:hover{
    background:#aebdc2;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1500px){

    .tabs-grid{
        grid-template-columns:
            repeat(12,minmax(0,1fr));
    }

}

@media(max-width:1200px){

    .tabs-grid{
        grid-template-columns:
            repeat(10,minmax(0,1fr));
    }

}

@media(max-width:1000px){

    .tabs-grid{
        grid-template-columns:
            repeat(8,minmax(0,1fr));
    }

}

@media(max-width:800px){

    .tabs-grid{
        grid-template-columns:
            repeat(6,minmax(0,1fr));
    }

    .tab{
        font-size:9px;
    }

}

@media(max-width:600px){

    body{
        overflow:auto;
    }

    .app{
        height:auto;
        min-height:100vh;
    }

    .tabs-grid{
        grid-template-columns:
            repeat(3,minmax(0,1fr));
    }

    .table-view{
        height:calc(100vh - 250px);
        min-height:400px;
    }

}

</style>

</head>

/* =========================================================

let currentTab = null;

let renderVersion = 0;

let filterColumn = null;

let temporarySelection = new Set();

const dataCache = new Map();

/* =========================================================

/* =========================================================
   VALUE STRING
========================================================= */

function valueString(value){

    if(
        value === null ||
        value === undefined
    ){
        return "";
    }

    if(
        typeof value === "object"
    ){

        try{
            return JSON.stringify(value);
        }
        catch{
            return String(value);
        }

    }

    return String(value);
}


/* =========================================================
   JSON URL
========================================================= */

function jsonURL(file){

    return "./" +
        encodeURIComponent(file);

}


/* =========================================================
   FAST JSON LOAD
========================================================= */

async function loadFile(file){

    if(dataCache.has(file)){
        return dataCache.get(file);
    }

    if(loadingPromises.has(file)){
        return loadingPromises.get(file);
    }

    const promise =
        fetch(
            jsonURL(file),
            {
                cache:"default"
            }
        )
        .then(response => {

            if(!response.ok){

                throw new Error(
                    file +
                    " — HTTP " +
                    response.status
                );

            }

            return response.json();

        })
        .then(data => {

            let rows = data;

            if(!Array.isArray(rows)){

                if(Array.isArray(data.data)){
                    rows = data.data;
                }
                else if(Array.isArray(data.rows)){
                    rows = data.rows;
                }
                else if(Array.isArray(data.records)){
                    rows = data.records;
                }
                else if(Array.isArray(data.items)){
                    rows = data.items;
                }
                else{
                    rows = [data];
                }

            }

            dataCache.set(
                file,
                rows
            );

            loadingPromises.delete(file);

            return rows;

        })
        .catch(error => {

            loadingPromises.delete(file);

            throw error;

        });

    loadingPromises.set(
        file,
        promise
    );

    return promise;
}


/* =========================================================
   LOAD TAB
========================================================= */

async function loadTab(tab){

    const cacheKey =
        "__TAB__" + tab.id;

    if(dataCache.has(cacheKey)){
        return dataCache.get(cacheKey);
    }

    if(loadingPromises.has(cacheKey)){
        return loadingPromises.get(cacheKey);
    }

    const promise =
        Promise.all(
            tab.files.map(
                file => loadFile(file)
            )
        )
        .then(results => {

            const rows = [];

            for(const result of results){
                rows.push(...result);
            }

            dataCache.set(
                cacheKey,
                rows
            );

            loadingPromises.delete(cacheKey);

            return rows;

        })
        .catch(error => {

            loadingPromises.delete(cacheKey);

            throw error;

        });

    loadingPromises.set(
        cacheKey,
        promise
    );

    return promise;
}

/* =========================================================
   GET COLUMNS
========================================================= */

function getColumns(tab,rows){

    if(columnsCache.has(tab.id)){
        return columnsCache.get(tab.id);
    }

    const columns = [];
    const seen = new Set();

    for(const row of rows){

        if(
            !row ||
            typeof row !== "object"
        ){
            continue;
        }

        for(const key of Object.keys(row)){

            if(!seen.has(key)){

                seen.add(key);
                columns.push(key);

            }

        }

    }


    if(tab.id === "apg"){

        const thiqa =
            columns.find(
                c =>
                    c.trim().toLowerCase() === "thiqa"
            );

        const basic =
            columns.find(
                c =>
                    c.trim().toLowerCase() === "basic"
            );

        if(thiqa && basic){

            const normal =
                columns.filter(
                    c =>
                        c !== thiqa &&
                        c !== basic
                );

            columns.length = 0;

            columns.push(
                ...normal,
                thiqa,
                basic
            );

        }

    }

    columnsCache.set(
        tab.id,
        columns
    );

    return columns;
}


/* =========================================================
   FILTER MATCH
========================================================= */

function matchesFilters(row){

    const state =
        filters.get(
            currentTab.id
        );

    if(
        !state ||
        state.size === 0
    ){
        return true;
    }

    for(
        const [column,selected]
        of state
    ){

        const value =
            valueString(
                row[column]
            );

        if(!selected.has(value)){
            return false;
        }

    }

    return true;
}


/* =========================================================
   VISIBLE ROWS
========================================================= */

function getVisibleRows(rows){

    const state =
        filters.get(
            currentTab.id
        );

    if(
        !state ||
        state.size === 0
    ){
        return rows;
    }

    const result = [];

    for(const row of rows){

        if(matchesFilters(row)){
            result.push(row);
        }

    }

    return result;
}


/* =========================================================
   WIDTHS
========================================================= */

function calculateWidths(
    tab,
    rows,
    columns
){

    if(widthCache.has(tab.id)){
        return widthCache.get(tab.id);
    }

    const widths = [];

    const sample =
        rows.slice(
            0,
            Math.min(
                rows.length,
                150
            )
        );

    for(const column of columns){

        const lower =
            column.trim().toLowerCase();

        if(
            tab.id === "apg" &&
            (
                lower === "thiqa" ||
                lower === "basic"
            )
        ){

            widths.push(82);

            continue;
        }

        let longest =
            Math.min(
                column.length,
                22
            );

        for(const row of sample){

            const text =
                valueString(
                    row[column]
                ).replace(
                    /\s+/g,
                    " "
                );

            const len =
                Math.min(
                    text.length,
                    26
                );

            if(len > longest){
                longest = len;
            }

        }

        let width =
            42 + longest * 4.7;

        width =
            Math.max(
                width,
                78
            );

        width =
            Math.min(
                width,
                190
            );

        if(longest <= 6){

            width =
                Math.min(
                    width,
                    105
                );

        }

        widths.push(
            Math.round(width)
        );

    }

    widthCache.set(
        tab.id,
        widths
    );

    return widths;
}


/* =========================================================
   YES / NO
========================================================= */

function yesNoClass(
    tab,
    column,
    value
){

    if(tab.id !== "apg"){
        return "";
    }

    const lower =
        column.trim().toLowerCase();

    if(
        lower !== "thiqa" &&
        lower !== "basic"
    ){
        return "";
    }

    const normalized =
        value.trim().toLowerCase();

    if(normalized === "yes"){
        return "apg-yes";
    }

    if(normalized === "no"){
        return "apg-no";
    }

    return "apg-frozen";
}

/* =========================================================
   VIRTUAL TABLE
========================================================= */

function renderVirtualTable(
    tab,
    rows,
    columns,
    widths,
    version
){

    tableArea.innerHTML = "";

    if(
        tableArea._virtualScrollHandler
    ){

        tableArea.removeEventListener(
            "scroll",
            tableArea._virtualScrollHandler
        );

        tableArea._virtualScrollHandler =
            null;

    }


    const table =
        document.createElement("table");

    table.className =
        "data-table";


    const colgroup =
        document.createElement("colgroup");


    for(const width of widths){

        const col =
            document.createElement("col");

        col.style.width =
            width + "px";

        col.style.minWidth =
            width + "px";

        colgroup.appendChild(col);

    }


    table.appendChild(colgroup);


    createHeader(
        table,
        tab,
        columns,
        widths
    );


    const tbody =
        document.createElement("tbody");

    table.appendChild(tbody);

    tableArea.appendChild(table);


    const ROW_HEIGHT = 34;
    const HEADER_HEIGHT = 46;
    const BUFFER = 15;

    let raf = 0;


    function draw(){

        raf = 0;

        if(
            version !== renderVersion
        ){
            return;
        }


        const scrollTop =
            tableArea.scrollTop;

        const viewportHeight =
            tableArea.clientHeight;


        let start =
            Math.floor(
                Math.max(
                    0,
                    scrollTop - HEADER_HEIGHT
                ) / ROW_HEIGHT
            );


        start =
            Math.max(
                0,
                start - BUFFER
            );


        let end =
            Math.ceil(
                (
                    scrollTop +
                    viewportHeight
                ) / ROW_HEIGHT
            );


        end =
            Math.min(
                rows.length,
                end + BUFFER
            );


        const fragment =
            document.createDocumentFragment();


        if(start > 0){

            const spacer =
                document.createElement("tr");

            spacer.className =
                "virtual-spacer";


            const cell =
                document.createElement("td");

            cell.colSpan =
                columns.length;

            cell.style.height =
                (
                    start *
                    ROW_HEIGHT
                ) + "px";


            spacer.appendChild(cell);
            fragment.appendChild(spacer);

        }


        for(
            let i=start;
            i<end;
            i++
        ){

            const row =
                rows[i];

            const tr =
                document.createElement("tr");


            for(
                let c=0;
                c<columns.length;
                c++
            ){

                const column =
                    columns[c];

                const td =
                    document.createElement("td");


                const value =
                    valueString(
                        row[column]
                    );


                td.textContent =
                    value;


                if(value.length > 35){
                    td.title = value;
                }


                if(
                    tab.id === "apg" &&
                    c === columns.length-2
                ){

                    td.classList.add(
                        "freeze-right-2"
                    );

                }


                if(
                    tab.id === "apg" &&
                    c === columns.length-1
                ){

                    td.classList.add(
                        "freeze-right-1"
                    );

                }


                const colorClass =
                    yesNoClass(
                        tab,
                        column,
                        value
                    );


                if(colorClass){

                    td.classList.add(
                        colorClass
                    );

                }


                tr.appendChild(td);

            }


            fragment.appendChild(tr);

        }


        if(end < rows.length){

            const spacer =
                document.createElement("tr");

            spacer.className =
                "virtual-spacer";


            const cell =
                document.createElement("td");

            cell.colSpan =
                columns.length;


            cell.style.height =
                (
                    (
                        rows.length -
                        end
                    ) *
                    ROW_HEIGHT
                ) + "px";


            spacer.appendChild(cell);

            fragment.appendChild(spacer);

        }


        tbody.replaceChildren(
            fragment
        );

    }


    function scheduleDraw(){

        if(!raf){

            raf =
                requestAnimationFrame(
                    draw
                );

        }

    }


    tableArea._virtualScrollHandler =
        scheduleDraw;


    tableArea.addEventListener(
        "scroll",
        scheduleDraw,
        {
            passive:true
        }
    );


    draw();
}

/* =========================================================
   ELIGIBILITY DATA NORMALIZER
========================================================= */

function getEligibilityGroups(rows){

    /*
       JSON:

       index 0 = Area / Branch information
       index 1 = actual column headings
       index 2+ = portal/password pairs
    */


    if(
        !Array.isArray(rows) ||
        rows.length < 3
    ){
        return [];
    }


    const groups = [];


    for(
        let i=2;
        i<rows.length;
        i+=2
    ){

        const portalRow =
            rows[i] || {};

        const passwordRow =
            rows[i+1] || {};


        const portal =
            valueString(
                portalRow["Unnamed: 0"]
            ).trim();


        /*
           Ignore completely empty rows.
        */

        if(!portal){
            continue;
        }


        groups.push({

            portal,

            link:
                valueString(
                    portalRow["Unnamed: 1"]
                ).trim(),

            username:
                valueString(
                    portalRow["Al Ain"]
                ),

            usernameNoud:
                valueString(
                    portalRow["Al Ain.1"]
                ),

            usernameFalaj:
                valueString(
                    portalRow["Al Ain.2"]
                ),

            password:
                valueString(
                    passwordRow["Al Ain"]
                ),

            passwordNoud:
                valueString(
                    passwordRow["Al Ain.1"]
                ),

            passwordFalaj:
                valueString(
                    passwordRow["Al Ain.2"]
                )

        });

    }


    return groups;
}

/* =========================================================
   RENDER TABLE
========================================================= */

function renderTable(
    tab,
    version
){

    if(
        version !== renderVersion
    ){
        return;
    }


    const rows =
        tab.rows || [];


    if(tab.id === "eligibility"){

        renderEligibilityTable(
            tab,
            rows,
            version
        );

        return;
    }


    if(rows.length === 0){

        tableArea.innerHTML = `

            <div class="empty">
                No data found.
            </div>

        `;

        recordNumber.textContent =
            "0";

        return;
    }


    const columns =
        getColumns(
            tab,
            rows
        );


    const visible =
        getVisibleRows(
            rows
        );


    recordNumber.textContent =
        visible.length.toLocaleString();


    const widths =
        calculateWidths(
            tab,
            rows,
            columns
        );


    renderVirtualTable(
        tab,
        visible,
        columns,
        widths,
        version
    );
}


/* =========================================================
   OPEN TAB
========================================================= */

async function openTab(id){

    const tab =
        tabsConfig.find(
            item =>
                item.id === id
        );


    if(!tab){
        return;
    }


    currentTab =
        tab;


    setActiveTab(id);


    currentList.textContent =
        tab.name;


    if(!filters.has(id)){

        filters.set(
            id,
            new Map()
        );

    }


    const version =
        ++renderVersion;


    /*
       CLOSE FILTER
    */

    closeFilter();


    /*
       CACHE = INSTANT
    */

    const cacheKey =
        "__TAB__" + id;


    if(dataCache.has(cacheKey)){

        tab.rows =
            dataCache.get(cacheKey);

        renderTable(
            tab,
            version
        );

        return;
    }


    showLoading(
        tab.name
    );


    recordNumber.textContent =
        "Loading";


    try{

        const rows =
            await loadTab(
                tab
            );


        if(
            version !== renderVersion
        ){
            return;
        }


        tab.rows =
            rows;


        renderTable(
            tab,
            version
        );

    }
    catch(error){

        if(
            version !== renderVersion
        ){
            return;
        }


        console.error(error);


        tableArea.innerHTML = `

            <div class="error">

                <strong>
                    Could not load ${tab.name}
                </strong>

                <br><br>

                ${error.message}

                <br><br>

                Check the JSON filename in GitHub.

            </div>

        `;


        recordNumber.textContent =
            "Error";

    }

}


/* =========================================================
   OPEN FILTER
========================================================= */

function openFilter(
    column,
    button
){

    if(!currentTab){
        return;
    }


    filterColumn =
        column;


    const values =
        new Set();


    /*
       SPECIAL ELIGIBILITY
    */

    if(
        currentTab.id === "eligibility" &&
        column === "Eligibility Portal"
    ){

        const groups =
            getEligibilityGroups(
                currentTab.rows || []
            );


        for(const group of groups){

            if(group.portal){

                values.add(
                    group.portal
                );

            }

        }

    }
    else{

        const rows =
            currentTab.rows || [];


        for(const row of rows){

            values.add(
                valueString(
                    row[column]
                )
            );

        }

    }


    filterAllValues =
        Array.from(values);


    filterAllValues.sort(
        (a,b) =>
            a.localeCompare(
                b,
                undefined,
                {
                    numeric:true,
                    sensitivity:"base"
                }
            )
    );


    const state =
        filters.get(
            currentTab.id
        );


    const existing =
        state &&
        state.get(column);


    if(existing){

        temporarySelection =
            new Set(
                existing
            );

    }
    else{

        temporarySelection =
            new Set(
                filterAllValues
            );

    }


    filterTitle.textContent =
        "Filter: " + column;


    filterSearch.value =
        "";


    renderFilterValues();


    filterPopup.style.display =
        "block";


    const rect =
        button.getBoundingClientRect();


    const width =
        filterPopup.offsetWidth;

    const height =
        filterPopup.offsetHeight;


    let left =
        rect.left;

    let top =
        rect.bottom + 5;


    if(
        left + width >
        window.innerWidth - 10
    ){

        left =
            window.innerWidth -
            width -
            10;

    }


    if(
        top + height >
        window.innerHeight - 10
    ){

        top =
            rect.top -
            height -
            5;

    }


    left =
        Math.max(
            10,
            left
        );

    top =
        Math.max(
            10,
            top
        );


    filterPopup.style.left =
        left + "px";

    filterPopup.style.top =
        top + "px";


    filterSearch.focus();
}


/* =========================================================
   FILTER VALUES
========================================================= */

function renderFilterValues(){

    const search =
        filterSearch.value
            .trim()
            .toLowerCase();


    const fragment =
        document.createDocumentFragment();


    for(const value of filterAllValues){

        const display =
            value === ""
                ? "(Blank)"
                : value;


        if(
            search &&
            !display
                .toLowerCase()
                .includes(search)
        ){
            continue;
        }


        const label =
            document.createElement("label");

        label.className =
            "filter-value";


        const checkbox =
            document.createElement("input");

        checkbox.type =
            "checkbox";

        checkbox.checked =
            temporarySelection.has(
                value
            );


        checkbox.addEventListener(
            "change",
            () => {

                if(checkbox.checked){

                    temporarySelection.add(
                        value
                    );

                }
                else{

                    temporarySelection.delete(
                        value
                    );

                }

            }
        );


        const text =
            document.createElement("span");

        text.className =
            "filter-value-text";

        text.textContent =
            display;

        text.title =
            display;


        label.appendChild(
            checkbox
        );

        label.appendChild(
            text
        );


        fragment.appendChild(
            label
        );

    }


    filterValues.replaceChildren(
        fragment
    );
}


/* =========================================================
   FILTER SEARCH
========================================================= */

filterSearch.addEventListener(
    "input",
    renderFilterValues
);


/* =========================================================
   SELECT ALL
========================================================= */

document
    .getElementById("selectAll")
    .addEventListener(
        "click",
        () => {

            temporarySelection =
                new Set(
                    filterAllValues
                );

            renderFilterValues();

        }
    );


/* =========================================================
   UNCHECK ALL
========================================================= */

document
    .getElementById("uncheckAll")
    .addEventListener(
        "click",
        () => {

            temporarySelection =
                new Set();

            renderFilterValues();

        }
    );


/* =========================================================
   APPLY FILTER
========================================================= */

document
    .getElementById("applyFilter")
    .addEventListener(
        "click",
        () => {

            if(
                !currentTab ||
                filterColumn === null
            ){
                return;
            }


            const state =
                filters.get(
                    currentTab.id
                );


            if(
                temporarySelection.size ===
                filterAllValues.length
            ){

                state.delete(
                    filterColumn
                );

            }
            else{

                state.set(
                    filterColumn,
                    new Set(
                        temporarySelection
                    )
                );

            }


            closeFilter();


            renderTable(
                currentTab,
                ++renderVersion
            );

        }
    );


/* =========================================================
   CANCEL
========================================================= */

document
    .getElementById("cancelFilter")
    .addEventListener(
        "click",
        closeFilter
    );


/* =========================================================
   CLOSE FILTER
========================================================= */

function closeFilter(){

    filterPopup.style.display =
        "none";

    filterColumn =
        null;
}


/* =========================================================
   CLEAR FILTERS
========================================================= */

document
    .getElementById("clearButton")
    .addEventListener(
        "click",
        () => {

            if(!currentTab){
                return;
            }


            filters.set(
                currentTab.id,
                new Map()
            );


            closeFilter();


            renderTable(
                currentTab,
                ++renderVersion
            );

        }
    );


/* =========================================================
   OUTSIDE CLICK
========================================================= */

document.addEventListener(
    "mousedown",
    event => {

        if(
            filterPopup.style.display === "block" &&

            !filterPopup.contains(
                event.target
            ) &&

            !event.target.closest(
                ".filter-button"
            )
        ){

            closeFilter();

        }

    }
);


/* =========================================================
   ESCAPE
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(event.key === "Escape"){

            closeFilter();

        }

    }
);


/* =========================================================
   START
========================================================= */

createTabs();

/*
   IMPORTANT:
   Only APG is loaded on first visit.
   No background loading of the other 29 tabs.
*/

openTab("apg");

</script>
