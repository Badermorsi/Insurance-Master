/* =========================================================
   RANDOMIZE REMAINING TABS
========================================================= */

function shuffle(array){

    const copy = [...array];

    for(
        let i = copy.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            copy[i],
            copy[j]
        ] = [
            copy[j],
            copy[i]
        ];

    }

    return copy;

}

/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   VALUE TO STRING
========================================================= */

function valueToString(value){

    if(
        value === null ||
        value === undefined
    ){
        return "";
    }

    if(typeof value === "object"){

        try{
            return JSON.stringify(value);
        }
        catch{
            return String(value);
        }

    }

    return String(value);

}


/* =========================================================
   JSON URL
========================================================= */

function getJSONURL(file){

    return "./" +
        encodeURIComponent(file)
        .replace(/%2F/g,"/");

}


/* =========================================================

========================================================= */

async function loadFile(file){

    /*
       CACHE CHECK
    */

    if(dataCache.has(file)){

        return dataCache.get(file);

    }


    const response =
        await fetch(
            getJSONURL(file),
            {
                cache:"force-cache"
            }
        );


    if(!response.ok){

        throw new Error(
            `Could not load "${file}" — HTTP ${response.status}`
        );

    }


    const data =
        await response.json();


    let rows = data;


    /*
       Support several JSON structures.
    */

    if(!Array.isArray(rows)){

        if(Array.isArray(data.data)){

            rows = data.data;

        }
        else if(Array.isArray(data.rows)){

            rows = data.rows;

        }
        else if(Array.isArray(data.records)){

            rows = data.records;

        }
        else if(Array.isArray(data.items)){

            rows = data.items;

        }
        else{

            rows = [data];

        }

    }


    dataCache.set(file,rows);

    return rows;

}


/* =========================================================
   LOAD TAB
========================================================= */

async function loadTab(tab){

    /*
       Entire tab cached.
    */

    if(dataCache.has(
        "__TAB__" + tab.id
    )){

        return dataCache.get(
            "__TAB__" + tab.id
        );

    }


    /*
       IMPORTANT:

       Promise.all loads HAAD 1,2,3
       simultaneously instead of one after another.
    */

    const fileResults =
        await Promise.all(
            tab.files.map(
                file => loadFile(file)
            )
        );


    let rows = [];

    for(const result of fileResults){

        rows.push(...result);

    }


    dataCache.set(
        "__TAB__" + tab.id,
        rows
    );


    return rows;

}


/* =========================================================
   GET COLUMNS
========================================================= */

function getColumns(rows){

    const columns = [];

    const seen = new Set();

    /*
       Only inspect objects until all columns
       have been discovered.

       Usually this is very quick.
    */

    for(const row of rows){

        if(
            !row ||
            typeof row !== "object"
        ){
            continue;
        }


        for(const key of Object.keys(row)){

            if(!seen.has(key)){

                seen.add(key);

                columns.push(key);

            }

        }

    }

    return columns;

}


/* =========================================================
   CREATE TABS
========================================================= */

function createTabs(){

    tabsElement.innerHTML = "";

    tabsConfig.forEach(
        (tab,index)=>{

            const button =
                document.createElement("button");

            button.className = "tab";

            button.dataset.id = tab.id;

            button.innerHTML = `
                <span class="tab-number">
                    ${String(index + 1).padStart(2,"0")}
                </span>
                ${escapeHTML(tab.name)}
            `;

            button.addEventListener(
                "click",
                ()=>openTab(tab.id)
            );

            tabsElement.appendChild(button);

        }
    );

}


/* =========================================================
   SET ACTIVE TAB
========================================================= */

function setActiveTab(id){

    document
        .querySelectorAll(".tab")
        .forEach(button=>{

            button.classList.toggle(
                "active",
                button.dataset.id === id
            );

        });

}


/* =========================================================
   LOADING UI
========================================================= */

function showLoading(name){

    tableWrapper.innerHTML = `

        <div class="loading-container">

            <div class="loading-box">

                <div class="spinner"></div>

                <span>
                    Loading ${escapeHTML(name)}...
                </span>

            </div>

        </div>

    `;

}


/* =========================================================
   OPEN TAB
========================================================= */

async function openTab(id){

    const tab =
        tabsConfig.find(
            item => item.id === id
        );


    if(!tab)
        return;


    /*
       Change current tab immediately.
    */

    currentTab = tab;

    setActiveTab(id);

    /*
       Reset search only when changing tabs.
    */

    globalSearch.value = "";

    /*
       Create filter state if necessary.
    */

    if(!filterState.has(id)){

        filterState.set(
            id,
            new Map()
        );

    }


    const thisRender =
        ++renderToken;


    /*
       If already cached, render immediately.
    */

    if(dataCache.has(
        "__TAB__" + tab.id
    )){

        const rows =
            dataCache.get(
                "__TAB__" + tab.id
            );

        tab.rows = rows;

        renderTable(tab,thisRender);

        return;

    }


    showLoading(tab.name);

    recordNumber.textContent = "Loading";


    try{

        const rows =
            await loadTab(tab);


        /*
           User may have clicked another tab
           while this one was loading.
        */

        if(thisRender !== renderToken)
            return;


        tab.rows = rows;

        renderTable(tab,thisRender);

    }
    catch(error){

        if(thisRender !== renderToken)
            return;


        console.error(error);


        tableWrapper.innerHTML = `

            <div class="error-state">

                <strong>
                    Unable to load ${escapeHTML(tab.name)}
                </strong>

                <br><br>

                ${escapeHTML(error.message)}

                <br><br>

                Check that the JSON filename in GitHub
                exactly matches the filename in this HTML.

            </div>

        `;


        recordNumber.textContent = "Error";

    }

}


/* =========================================================
   SEARCH
========================================================= */

function rowMatchesSearch(row){

    const search =
        globalSearch.value
            .trim()
            .toLowerCase();


    if(!search)
        return true;


    /*
       % = AND

       Example:

       500%10%4.2

       means all 3 terms must exist.
    */

    const terms =
        search
            .split("%")
            .map(term=>term.trim())
            .filter(Boolean);


    /*
       Search across all columns.
    */

    const text =
        Object.values(row)
            .map(valueToString)
            .join(" ")
            .toLowerCase();


    return terms.every(
        term => text.includes(term)
    );

}


/* =========================================================
   FILTER MATCH
========================================================= */

function rowMatchesFilters(row){

    const state =
        filterState.get(
            currentTab.id
        );


    if(!state || state.size === 0)
        return true;


    for(
        const [column,selected]
        of state
    ){

        if(
            !selected ||
            selected.size === 0
        ){
            continue;
        }


        const value =
            valueToString(
                row[column]
            );


        if(!selected.has(value))
            return false;

    }


    return true;

}


/* =========================================================
   FILTER + SEARCH DATA
========================================================= */

function getVisibleRows(rows){

    const result = [];

    for(const row of rows){

        if(!rowMatchesFilters(row))
            continue;

        if(!rowMatchesSearch(row))
            continue;

        result.push(row);

    }

    return result;

}


/* =========================================================
   RENDER TABLE
========================================================= */

function renderTable(tab,token){

    if(token !== renderToken)
        return;


    const rows =
        tab.rows || [];


    if(rows.length === 0){

        tableWrapper.innerHTML =
            `<div class="empty-state">
                No data found.
            </div>`;

        recordNumber.textContent = "0";

        return;

    }


    const columns =
        getColumns(rows);


    const visibleRows =
        getVisibleRows(rows);


    recordNumber.textContent =
        visibleRows.length.toLocaleString();


    /*
       Build table shell immediately.

       This makes the interface feel much faster.
    */

    tableWrapper.innerHTML = "";


    const table =
        document.createElement("table");


    const thead =
        document.createElement("thead");


    const headerRow =
        document.createElement("tr");


    const state =
        filterState.get(tab.id);


    columns.forEach(
        (column,index)=>{

            const th =
                document.createElement("th");


            const inner =
                document.createElement("div");

            inner.className =
                "th-inner";


            const name =
                document.createElement("span");

            name.className =
                "th-name";

            name.textContent =
                column;

            name.title =
                column;


            const button =
                document.createElement("button");

            button.className =
                "filter-button";


            if(
                state &&
                state.has(column)
            ){

                button.classList.add("active");

            }


            button.innerHTML = "▼";

            button.title =
                "Filter " + column;


            button.addEventListener(
                "click",
                event=>{

                    event.stopPropagation();

                    openFilter(
                        column,
                        button
                    );

                }
            );


            inner.appendChild(name);

            inner.appendChild(button);

            th.appendChild(inner);

            headerRow.appendChild(th);

        }
    );


    thead.appendChild(headerRow);


    const tbody =
        document.createElement("tbody");


    table.appendChild(thead);

    table.appendChild(tbody);

    tableWrapper.appendChild(table);


    /*
       Chunked rendering.

       Instead of creating thousands of DOM rows
       in one operation, create them in batches.
    */

    const CHUNK_SIZE = 250;

    let position = 0;


    function renderChunk(){

        if(token !== renderToken)
            return;


        const fragment =
            document.createDocumentFragment();


        const end =
            Math.min(
                position + CHUNK_SIZE,
                visibleRows.length
            );


        for(
            let i = position;
            i < end;
            i++
        ){

            const row =
                visibleRows[i];


            const tr =
                document.createElement("tr");


            for(const column of columns){

                const td =
                    document.createElement("td");


                td.textContent =
                    valueToString(
                        row[column]
                    );


                tr.appendChild(td);

            }


            fragment.appendChild(tr);

        }


        tbody.appendChild(fragment);


        position = end;


        if(position < visibleRows.length){

            requestAnimationFrame(
                renderChunk
            );

        }

    }


    requestAnimationFrame(
        renderChunk
    );

}


/* =========================================================
   OPEN FILTER
========================================================= */

function openFilter(column,button){

    if(!currentTab)
        return;


    currentFilterColumn =
        column;


    /*
       Get all values from current dataset.

       Use Set to eliminate duplicates.
    */

    const values =
        new Set();


    for(
        const row of currentTab.rows
    ){

        values.add(
            valueToString(
                row[column]
            )
        );

    }


    let allValues =
        Array.from(values);


    allValues.sort(
        (a,b)=>
            a.localeCompare(
                b,
                undefined,
                {
                    numeric:true,
                    sensitivity:"base"
                }
            )
    );


    currentFilterAllValues =
        allValues;


    /*
       Existing selected values.
    */

    const state =
        filterState.get(
            currentTab.id
        );


    const existing =
        state &&
        state.get(column);


    /*
       Clone selection.

       Important so Cancel does not alter
       the real filter.
    */

    if(existing){

        currentFilterValues =
            new Set(existing);

    }
    else{

        /*
           No active filter =
           everything selected.
        */

        currentFilterValues =
            new Set(allValues);

    }


    filterTitle.textContent =
        "Filter: " + column;


    filterSearch.value = "";


    renderFilterValues();


    /*
       Position popup.
    */

    const rect =
        button.getBoundingClientRect();


    filterPopup.style.display =
        "block";


    /*
       Temporarily make visible so dimensions
       are available.
    */

    const popupWidth =
        filterPopup.offsetWidth;

    const popupHeight =
        filterPopup.offsetHeight;


    let left =
        rect.left;


    let top =
        rect.bottom + 6;


    if(
        left + popupWidth >
        window.innerWidth - 10
    ){

        left =
            window.innerWidth -
            popupWidth -
            10;

    }


    if(
        top + popupHeight >
        window.innerHeight - 10
    ){

        top =
            rect.top -
            popupHeight -
            6;

    }


    if(top < 10)
        top = 10;


    if(left < 10)
        left = 10;


    filterPopup.style.left =
        left + "px";


    filterPopup.style.top =
        top + "px";


    filterSearch.focus();

}


/* =========================================================
   RENDER FILTER VALUES
========================================================= */

function renderFilterValues(){

    const search =
        filterSearch.value
            .trim()
            .toLowerCase();


    filterValues.innerHTML = "";


    const fragment =
        document.createDocumentFragment();


    for(const value of currentFilterAllValues){

        const displayValue =
            value === ""
                ? "(Blank)"
                : value;


        if(
            search &&
            !displayValue
                .toLowerCase()
                .includes(search)
        ){

            continue;

        }


        const label =
            document.createElement("label");


        label.className =
            "filter-value";


        const checkbox =
            document.createElement("input");


        checkbox.type =
            "checkbox";


        checkbox.checked =
            currentFilterValues.has(value);


        checkbox.dataset.value =
            value;


        checkbox.addEventListener(
            "change",
            ()=>{

                if(checkbox.checked){

                    currentFilterValues.add(
                        value
                    );

                }
                else{

                    currentFilterValues.delete(
                        value
                    );

                }

            }
        );


        const text =
            document.createElement("span");


        text.className =
            "filter-value-text";


        text.textContent =
            displayValue;


        text.title =
            displayValue;


        label.appendChild(
            checkbox
        );


        label.appendChild(
            text
        );


        fragment.appendChild(
            label
        );

    }


    filterValues.appendChild(
        fragment
    );

}


/* =========================================================
   FILTER SEARCH
========================================================= */

filterSearch.addEventListener(
    "input",
    renderFilterValues
);


/* =========================================================
   SELECT ALL
========================================================= */

document
    .getElementById("selectAllButton")
    .addEventListener(
        "click",
        ()=>{

            currentFilterValues =
                new Set(
                    currentFilterAllValues
                );


            renderFilterValues();

        }
    );


/* =========================================================
   UNCHECK ALL
========================================================= */

document
    .getElementById("uncheckAllButton")
    .addEventListener(
        "click",
        ()=>{

            currentFilterValues =
                new Set();


            renderFilterValues();

        }
    );


/* =========================================================
   APPLY FILTER
========================================================= */

document
    .getElementById("applyFilterButton")
    .addEventListener(
        "click",
        ()=>{

            if(
                !currentTab ||
                currentFilterColumn === null
            ){
                return;
            }


            const state =
                filterState.get(
                    currentTab.id
                );


            /*
               All selected =
               no filter required.
            */

            if(
                currentFilterValues.size ===
                currentFilterAllValues.length
            ){

                state.delete(
                    currentFilterColumn
                );

            }
            else{

                /*
                   Store exact selected values.

                   This is important:

                   If user selects "Combination",
                   only "Combination" is shown.

                   Other values containing
                   "Combination" are NOT automatically shown.
                */

                state.set(
                    currentFilterColumn,
                    new Set(
                        currentFilterValues
                    )
                );

            }


            closeFilter();


            renderTable(
                currentTab,
                ++renderToken
            );

        }
    );


/* =========================================================
   CANCEL FILTER
========================================================= */

document
    .getElementById("cancelFilterButton")
    .addEventListener(
        "click",
        closeFilter
    );


/* =========================================================
   CLOSE FILTER
========================================================= */

function closeFilter(){

    filterPopup.style.display =
        "none";

    currentFilterColumn =
        null;

    currentFilterValues =
        null;

    currentFilterAllValues =
        null;

}


/* =========================================================
   CLEAR ALL
========================================================= */

document
    .getElementById("clearButton")
    .addEventListener(
        "click",
        ()=>{

            if(!currentTab)
                return;


            globalSearch.value = "";


            filterState.set(
                currentTab.id,
                new Map()
            );


            renderTable(
                currentTab,
                ++renderToken
            );

        }
    );


/* =========================================================
   GLOBAL SEARCH
========================================================= */

let searchTimer = null;


globalSearch.addEventListener(
    "input",
    ()=>{

        /*
           Small debounce prevents rendering
           on every single keystroke.
        */

        clearTimeout(searchTimer);


        searchTimer =
            setTimeout(
                ()=>{

                    if(!currentTab)
                        return;


                    renderTable(
                        currentTab,
                        ++renderToken
                    );

                },
                80
            );

    }
);


/* =========================================================
   CLICK OUTSIDE FILTER
========================================================= */

document.addEventListener(
    "mousedown",
    event=>{

        if(
            filterPopup.style.display === "block" &&
            !filterPopup.contains(event.target) &&
            !event.target.closest(".filter-button")
        ){

            closeFilter();

        }

    }
);


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
    "keydown",
    event=>{

        if(event.key === "Escape"){

            closeFilter();

        }

    }
);


/* =========================================================
   INITIALIZE
========================================================= */

createTabs();


/*
   APG is ALWAYS first and loads first.
*/

openTab("apg");


</script>
