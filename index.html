      <!DOCTYPE html>
      <html lang="en">
      <head>

      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <title>Insurance All List</title>

      <style>

      *{
          box-sizing:border-box;
      }

      html,
      body{
          width:100%;
          height:100%;
          margin:0;
          padding:0;
      }

      body{
          font-family:
              Inter,
              "Segoe UI",
              Roboto,
              Arial,
              sans-serif;

          background:#f3f6f8;
          color:#17232d;

          overflow:hidden;
      }

      button,
      input{
          font-family:inherit;
      }


      /* =========================================================
         APP
      ========================================================= */

      .app{
          width:100%;
          height:100vh;

          display:flex;
          flex-direction:column;

          overflow:hidden;
      }


      /* =========================================================
         TOP BRAND
      ========================================================= */

      .brand-bar{
          flex:0 0 50px;

          display:flex;
          align-items:center;

          padding:0 18px;

          background:#ffffff;

          border-bottom:1px solid #e5eaee;
      }

      .logo{
          width:31px;
          height:31px;

          border-radius:8px;

          display:flex;
          align-items:center;
          justify-content:center;

          background:
              linear-gradient(
                  145deg,
                  #0f6878,
                  #238da0
              );

          color:#ffffff;

          font-size:18px;
          font-weight:800;

          box-shadow:
              0 4px 10px rgba(15,104,120,.20);
      }

      .logo::before{
          content:"+";
          line-height:1;
      }

      .brand-name{
          font-size:16px;
          font-weight:750;

          letter-spacing:-.3px;

          color:#20313b;
      }


      /* =========================================================
         TABS
      ========================================================= */

      .tabs-section{
          flex:0 0 auto;

          padding:8px 12px 9px;

          background:#f3f6f8;

          border-bottom:1px solid #dfe5e9;
      }

      .tab-search{
          height:34px;
          width:36px;
          flex:0 0 auto;
          margin-right:11px;

          display:flex;
          align-items:center;

          position:relative;
          z-index:220;

          border:1px solid #d8e0e5;
          border-radius:9px;

          background:#ffffff;

          box-shadow:0 2px 5px rgba(28,57,67,.06);

          transition:
              width .2s ease,
              background .2s ease,
              border-color .2s ease,
              box-shadow .2s ease;
      }

      .tab-search.open{
          width:min(300px,calc(100vw - 220px));

          border-color:#d5e1e5;

          background:#ffffff;

          box-shadow:0 5px 16px rgba(28,57,67,.10);
      }

      .tab-search-toggle{
          flex:0 0 32px;

          width:32px;
          height:30px;

          display:grid;
          place-items:center;

          padding:0;

          border:0;
          border-radius:8px;

          background:transparent;
          color:#4c6671;

          cursor:pointer;

          transition:
              background .15s ease,
              color .15s ease;
      }

      .tab-search-toggle:hover,
      .tab-search.open .tab-search-toggle{
          background:#eaf5f6;
          color:#12697a;
      }

      .tab-search-toggle svg{
          width:17px;
          height:17px;
          stroke:currentColor;
      }

      .tab-search-input{
          flex:1;
          min-width:0;
          width:0;
          height:28px;

          padding:0;

          border:0;
          outline:0;

          background:transparent;
          color:#263943;

          font-size:12px;

          opacity:0;
          transition:
              opacity .14s ease,
              padding .2s ease;
      }

      .tab-search.open .tab-search-input{
          padding:0 10px 0 2px;
          opacity:1;
      }

      .tab-search-input::placeholder{
          color:#93a1a8;
      }

      .tab-search-results{
          position:absolute;
          top:calc(100% + 6px);
          left:0;

          width:100%;
          max-height:280px;
          overflow:auto;

          padding:5px;

          border:1px solid #dbe4e8;
          border-radius:10px;

          background:#ffffff;
          box-shadow:0 12px 28px rgba(25,48,58,.16);
      }

      .tab-search-result{
          width:100%;

          display:block;

          padding:9px 10px;

          border:0;
          border-radius:7px;

          background:transparent;
          color:#344b55;

          font-family:inherit;
          font-size:12px;
          font-weight:600;
          line-height:1.3;
          text-align:left;

          cursor:pointer;
      }

      .tab-search-result:hover,
      .tab-search-result:focus-visible{
          outline:0;
          background:#edf7f8;
          color:#12697a;
      }

      .tab-search-empty{
          padding:10px;
          color:#7b8990;
          font-size:11px;
      }

      .search-tab-stack{
          display:flex;
          flex-direction:column;
          gap:18px;
          min-width:0;
          padding:18px;
      }

      .search-table-wrap{
          width:100%;
          overflow:auto;
          border:1px solid #d7e1e5;
          border-radius:10px;
          background:#ffffff;
          box-shadow:0 3px 12px rgba(32,58,68,.06);
      }

      .search-entry-table{
          width:100%;
          min-width:1200px;
          table-layout:fixed;
          border-collapse:separate;
          border-spacing:0;
          font-size:12px;
      }

      .search-entry-table th,
      .search-entry-table td{
          padding:10px 9px;
          border-right:1px solid #e1e8eb;
          border-bottom:1px solid #e1e8eb;
          text-align:center;
          vertical-align:middle;
          overflow-wrap:anywhere;
      }

      .search-entry-table th:last-child,
      .search-entry-table td:last-child{
          border-right:0;
      }

      .search-entry-table tbody tr:last-child td{
          border-bottom:0;
      }

      .search-entry-title{
          height:42px;
          background:#12697a;
          color:#ffffff;
          font-size:14px;
          font-weight:750;
          letter-spacing:.1px;
      }

      .search-entry-headings th{
          height:74px;
          background:#eaf1f3;
          color:#263a44;
          font-weight:750;
      }

      .search-entry-guidance{
          display:block;
          margin-top:7px;
          color:#687982;
          font-size:9.5px;
          font-weight:500;
          line-height:1.35;
      }

      .search-entry-row td{
          height:46px;
          background:#ffffff;
          color:#34434c;
      }

      .search-item-id-input{
          width:100%;
          min-width:0;
          height:32px;
          padding:0 9px;
          border:1px solid #c8d6db;
          border-radius:6px;
          outline:none;
          background:#ffffff;
          color:#20313b;
          font-family:inherit;
          font-size:12px;
          font-weight:600;
          line-height:1.2;
          text-align:center;
      }

      .search-item-id-input:focus{
          border-color:#168195;
          box-shadow:0 0 0 3px rgba(22,129,149,.13);
      }

      .search-entry-value{
          display:block;
          min-height:18px;
          overflow-wrap:anywhere;
      }

      .hcpcs-cap-layout{
          display:grid;
          grid-template-columns:minmax(450px,.85fr) minmax(500px,1.35fr);
          gap:14px;
          min-width:1000px;
          padding:16px;
          align-items:start;
      }

      .hcpcs-cap-pane{
          min-width:0;
          overflow:auto;
          border:1px solid #d7e1e5;
          border-radius:10px;
          background:#ffffff;
          box-shadow:0 3px 12px rgba(32,58,68,.06);
      }

      .hcpcs-cap-table{
          width:100%;
          table-layout:fixed;
          border-collapse:separate;
          border-spacing:0;
          font-size:11px;
      }

      .hcpcs-cap-table th,
      .hcpcs-cap-table td{
          padding:7px 6px;
          border-right:1px solid #e1e8eb;
          border-bottom:1px solid #e1e8eb;
          text-align:center;
          vertical-align:middle;
          line-height:15px;
          overflow-wrap:anywhere;
          word-break:break-word;
      }

      .hcpcs-cap-table th:last-child,
      .hcpcs-cap-table td:last-child{
          border-right:0;
      }

      .hcpcs-cap-table tbody tr:last-child td{
          border-bottom:0;
      }

      .hcpcs-cap-title{
          height:40px;
          padding:8px !important;
          background:#12697a;
          color:#ffffff;
          font-size:13px;
          font-weight:750;
      }

      .hcpcs-cap-heading{
          height:42px;
          background:#eaf1f3;
          color:#263a44;
          font-weight:750;
      }

      .hcpcs-cap-heading-content{
          display:flex;
          align-items:center;
          justify-content:center;
          gap:5px;
      }

      .hcpcs-cap-filter{
          flex:0 0 19px;
          width:19px;
          height:19px;
          padding:0;
          border:1px solid #c6d1d6;
          border-radius:4px;
          background:#ffffff;
          color:#65757e;
          font-size:8px;
          cursor:pointer;
      }

      .hcpcs-cap-filter:hover,
      .hcpcs-cap-filter.active{
          background:#12697a;
          color:#ffffff;
          border-color:#12697a;
      }

      .hcpcs-cap-table th.hcpcs-cap-no-wrap .hcpcs-cap-heading-content,
      .hcpcs-cap-table th.hcpcs-cap-no-wrap .hcpcs-cap-heading-content span,
      .hcpcs-cap-table td.hcpcs-cap-no-wrap{
          white-space:nowrap;
          overflow-wrap:normal;
          word-break:normal;
      }

      .hcpcs-cap-table tbody tr:nth-child(even) td{
          background:#fbfcfd;
      }

    .hcpcs-cap-table tbody tr:hover td{
        background:#eef7f8;
    }

    .rx-validity-card{
        width:min(760px,calc(100% - 36px));
        margin:28px auto;
        padding:22px;
        border:1px solid #d7e1e5;
        border-radius:12px;
        background:#ffffff;
        box-shadow:0 5px 18px rgba(32,58,68,.08);
    }

    .rx-validity-instructions{
        margin:0 0 18px;
        color:#334952;
        font-size:13px;
        font-weight:750;
        line-height:1.8;
        letter-spacing:.15px;
    }

    .rx-instruction-green{
        color:#247342;
    }

    .rx-instruction-purple{
        color:#684a9a;
    }

    .rx-validity-table{
        width:100%;
        table-layout:fixed;
        border-collapse:separate;
        border-spacing:0;
        border:1px solid #d7e1e5;
        border-radius:9px;
        overflow:hidden;
    }

    .rx-validity-table th,
    .rx-validity-table td{
        width:50%;
        padding:14px;
        border-right:1px solid #dfe7ea;
        border-bottom:1px solid #dfe7ea;
        text-align:center;
        vertical-align:middle;
    }

    .rx-validity-table tr:last-child th,
    .rx-validity-table tr:last-child td{
        border-bottom:0;
    }

    .rx-validity-table th:last-child,
    .rx-validity-table td:last-child{
        border-right:0;
    }

    .rx-validity-table th{
        background:#f1f5f6;
        color:#31434c;
        font-size:12px;
        font-weight:750;
    }

    .rx-date-input{
        width:min(100%,280px);
        height:42px;
        padding:0 12px;
        border:1px solid #8fc6a2;
        border-radius:8px;
        outline:none;
        background:#e2f4e8;
        color:#245a37;
        font-family:inherit;
        font-size:15px;
        font-weight:750;
        text-align:center;
    }

    .rx-date-input:focus{
        border-color:#439b61;
        box-shadow:0 0 0 3px rgba(67,155,97,.15);
    }

    .rx-date-input::placeholder{
        color:#6d9a7a;
        font-weight:600;
    }

    .rx-date-output{
        width:min(100%,280px);
        min-height:42px;
        display:inline-flex;
        align-items:center;
        justify-content:center;
        padding:0 12px;
        border:1px solid #bea9e2;
        border-radius:8px;
        background:#eee6fb;
        color:#563d84;
        font-size:15px;
        font-weight:800;
    }

    .rx-date-error{
        margin-top:7px;
        color:#a43d3d;
        font-size:10px;
        font-weight:650;
    }

      .tabs-grid{
          width:100%;

          display:grid;

          grid-template-columns:
              repeat(15,minmax(0,1fr));

          gap:4px;
      }

      .tab{
          width:100%;
          min-width:0;

          height:30px;

          padding:0 6px;

          border:1px solid #d8e0e5;

          border-radius:6px;

          background:#ffffff;

          color:#53636e;

          font-size:10.5px;
          font-weight:650;

          letter-spacing:-.05px;

          white-space:nowrap;
          overflow:hidden;
          text-overflow:ellipsis;

          cursor:pointer;

          transition:
              background .12s ease,
              color .12s ease,
              border-color .12s ease,
              box-shadow .12s ease,
              transform .08s ease;
      }

      .tab:hover{
          background:#edf7f9;
          border-color:#9fc3cb;
          color:#12697a;
      }

      .tab:active{
          transform:scale(.985);
      }

      .tab.active{
          background:
              linear-gradient(
                  135deg,
                  #125f70,
                  #19869a
              );

          color:#ffffff;

          border-color:#125f70;

          box-shadow:
              0 3px 8px rgba(18,95,112,.22);
      }


      /* =========================================================
         TABLE BAR
      ========================================================= */

      .table-bar{
          flex:0 0 43px;

          display:flex;
          align-items:center;

          padding:0 14px;

          background:#ffffff;

          border-bottom:1px solid #dfe5e9;
      }

      .list-name{
          display:flex;
          align-items:center;

          color:#263943;

          font-size:11.5px;
          font-weight:750;
      }

      .list-dot{
          width:6px;
          height:6px;

          margin-right:7px;

          border-radius:50%;

          background:#1b9a85;
      }

      .record-pill{
          margin-left:9px;

          padding:3px 9px;

          border-radius:20px;

          background:#eef5f6;

          color:#337483;

          font-size:9.5px;
          font-weight:700;
      }

      .bar-space{
          flex:1;
      }

      .clear-button{
          height:28px;

          padding:0 11px;

          border:1px solid #d8e0e4;

          border-radius:6px;

          background:#ffffff;

          color:#667680;

          font-size:9.5px;
          font-weight:700;

          cursor:pointer;
      }

      .clear-button:hover{
          background:#edf7f8;
          color:#12697a;
          border-color:#9fc3cb;
      }


      /* =========================================================
         TABLE VIEW
      ========================================================= */

      .table-view{
          position:relative;

          flex:1 1 auto;

          min-height:0;

          overflow:auto;

          background:#ffffff;
      }


      /* =========================================================
         NORMAL TABLE
      ========================================================= */

      .data-table{
          border-collapse:separate;
          border-spacing:0;

          width:max-content;
          min-width:100%;

          table-layout:fixed;

          font-size:11px;
      }

      .data-table thead{
          position:sticky;
          top:0;
          z-index:100;
      }

      .data-table th{
          height:46px;

          padding:0;

          background:#eaf1f3;

          color:#263a44;

          border-right:1px solid #d5dfe3;
          border-bottom:2px solid #c3d1d6;

          font-size:11.5px;
          font-weight:800;

          text-align:center;
          vertical-align:middle;
      }

      .data-table th:first-child{
          border-left:1px solid #d5dfe3;
      }

      .header-content{
          width:100%;
          min-height:46px;

          display:flex;

          align-items:center;
          justify-content:center;

          gap:4px;

          padding:4px 4px;
      }

      .header-label{
          min-width:0;

          line-height:14px;

          text-align:center;

          overflow-wrap:anywhere;
          word-break:break-word;

          white-space:normal;
      }

      .filter-button{
          flex:0 0 19px;

          width:19px;
          height:19px;

          padding:0;

          border:1px solid #c6d1d6;

          border-radius:4px;

          background:#ffffff;

          color:#65757e;

          font-size:8px;

          display:flex;
          align-items:center;
          justify-content:center;

          cursor:pointer;
      }

      .filter-button:hover{
          background:#dff0f3;
          color:#12697a;
          border-color:#75aeb9;
      }

      .filter-button.active{
          background:#12697a;
          color:#ffffff;
          border-color:#12697a;
      }


      /* =========================================================
         BODY CELLS
      ========================================================= */

      .data-table td{

          height:auto;

          min-height:34px;

          padding:6px 6px;

          background:#ffffff;

          color:#34434c;

          border-right:1px solid #e8edef;
          border-bottom:1px solid #e7ecef;

          text-align:center;
          vertical-align:middle;

          line-height:15px;

          white-space:normal;

          overflow:visible;

          overflow-wrap:anywhere;

          word-break:break-word;

          hyphens:auto;
      }

      .data-table td.nowrap-code-column{
          white-space:nowrap;
          overflow-wrap:normal;
          word-break:normal;
          hyphens:none;
      }

      .data-table th.nowrap-code-column .header-label{
          white-space:nowrap;
      }

      .data-table tbody tr:nth-child(even) td{
          background:#fbfcfd;
      }

      .data-table tbody tr:hover td{
          background:#eef7f8;
      }


      /* =========================================================
         NORMAL TABLE COLUMNS
      ========================================================= */

      .data-table col{
          width:150px;
          min-width:150px;
          max-width:150px;
      }


      /* =========================================================
         HAAD
      ========================================================= */

      .data-table.haad-table td,
      .data-table.haad-table th{
          font-size:11px;
      }

      .data-table.haad-table col.generic-name-column{
          width:330px !important;
          min-width:330px !important;
          max-width:330px !important;
      }


      /* =========================================================
         ADNIC
      ========================================================= */

      .data-table.adnic-table td,
      .data-table.adnic-table th{
          font-size:11px;
      }

      .data-table.adnic-table col.generic-name-column{
          width:320px !important;
          min-width:320px !important;
          max-width:320px !important;
      }


      /* =========================================================
         DENIAL CODE
      ========================================================= */

      .data-table.denial-table td,
      .data-table.denial-table th{
          font-size:11px;
      }

      .data-table.denial-table col.denial-description-column{
          width:480px !important;
          min-width:480px !important;
          max-width:480px !important;
      }


      /* =========================================================
         APG YES / NO
      ========================================================= */

      .apg-yes{
          background:#dff3e7 !important;
          color:#17683b !important;
          font-weight:750 !important;
      }

      .apg-no{
          background:#fde5e5 !important;
          color:#a43d3d !important;
          font-weight:750 !important;
      }


      /* =========================================================
         APG FROZEN
      ========================================================= */

      .freeze-right-1{
          position:sticky !important;

          right:0;

          z-index:80;

          box-shadow:
              -4px 0 7px rgba(30,50,60,.07);
      }

      .freeze-right-2{
          position:sticky !important;

          right:82px;

          z-index:80;
      }

      thead .freeze-right-1,
      thead .freeze-right-2{
          z-index:150;
      }

      .apg-frozen{
          font-weight:800 !important;
      }


      /* =========================================================
         PPI SPECIAL LAYOUT
      ========================================================= */

      .ppi-layout{

          width:100%;
          min-width:0;

          height:100%;

          display:grid;

          grid-template-columns:
              minmax(0,1fr)
              8px
              270px;

          align-items:stretch;

          column-gap:0;

          padding:0;

          background:#ffffff;

          overflow:hidden;
      }

      .ppi-main-area{

          min-width:0;

          width:100%;

          height:100%;

          overflow:hidden;

          background:#ffffff;

          border-right:0;
      }

      .ppi-main-area .data-table{

          width:100%;

          min-width:0;

          max-width:100%;

          table-layout:fixed;
      }

      .ppi-gap{

          width:8px;

          min-width:8px;

          height:100%;

          background:#ffffff;
      }

      .ppi-specialty-area{

          width:270px;

          min-width:270px;

          max-width:270px;

          height:100%;

          overflow:auto;

          background:#ffffff;

          border-left:0;
      }

      .ppi-specialty-table{

          width:100%;

          min-width:270px;

          table-layout:fixed;

          border-collapse:separate;

          border-spacing:0;

          font-size:11px;
      }

      .ppi-specialty-table thead{

          position:sticky;

          top:0;

          z-index:120;
      }

      .ppi-specialty-table th{

          height:46px;

          padding:0;

          background:#eaf1f3;

          color:#263a44;

          border-left:1px solid #d5dfe3;

          border-right:1px solid #d5dfe3;

          border-bottom:2px solid #c3d1d6;

          font-size:11.5px;

          font-weight:800;

          text-align:center;

          vertical-align:middle;
      }

      .ppi-specialty-header{

          width:100%;

          min-height:46px;

          display:flex;

          flex-direction:column;

          align-items:center;

          justify-content:center;

          padding:3px 5px;
      }

      .ppi-specialist-title{

          color:#9a5b16;

          font-size:11px;

          font-weight:900;

          line-height:14px;

          text-align:center;

          white-space:nowrap;
      }

      .ppi-specialty-title-row{

          width:100%;

          display:flex;

          align-items:center;

          justify-content:center;

          gap:5px;

          margin-top:1px;
      }

      .ppi-specialty-header-label{

          min-width:0;

          line-height:13px;

          text-align:center;

          overflow-wrap:anywhere;

          word-break:break-word;
      }

      .ppi-specialty-table td{

          min-height:34px;

          height:auto;

          padding:6px 8px;

          background:#ffffff;

          color:#34434c;

          border-left:1px solid #e8edef;

          border-right:1px solid #e8edef;

      /* =========================================================
         VALUE STRING
      ========================================================= */

      function valueString(value){

          if(
              value === null ||
              value === undefined
          ){
              return "";
          }

          if(
              typeof value === "object"
          ){

              try{
                  return JSON.stringify(value);
              }
              catch{
                  return String(value);
              }

          }

          return String(value);

      }


      /* =========================================================
         ROBUST HEADER NORMALIZATION
      ========================================================= */

      function normalizeColumnName(column){

          return String(column ?? "")
              .replace(/\uFEFF/g,"")
              .replace(/\u200B/g,"")
              .trim()
              .toLowerCase()
              .replace(/[^a-z0-9]+/g,"");

      }


      /* =========================================================
         GENERIC NAME
      ========================================================= */

      function isGenericNameColumn(column){

          return normalizeColumnName(column) ===
              "genericname";

      }

      function isDenialDescriptionColumn(column){

          const name =
              normalizeColumnName(column);

          return (
              name === "examplesdescription" ||
              name === "exampledescription" ||
              (
                  name.includes("example") &&
                  name.includes("description")
              )
          );

      }


      /* =========================================================
         FIND PPI SPECIALTY COLUMN
      ========================================================= */

      function findPpiSpecialtyColumn(rows){

          if(
              !rows ||
              !rows.length
          ){
              return null;
          }


          const columns = [];

          const seen = new Set();


          for(const row of rows){

              if(
                  !row ||
                  typeof row !== "object" ||
                  Array.isArray(row)
              ){
                  continue;
              }


              for(const key of Object.keys(row)){

                  if(
                      !seen.has(key)
                  ){

                      seen.add(key);

                      columns.push(key);

                  }

              }

          }


          const headerColumn =
              columns.find(
                  column =>
                      rows.some(
                          row =>
                              valueString(
                                  row[column]
                              ).trim() ===
                              "Eligible Clinician Specialty"
                      )
              );


          if(headerColumn){

              return headerColumn;

          }


          const exactNames = [

              "eligibleclinicianspecialty",

              "eligibleclinicianspecialties",

              "eligibleclinicalspecialty",

              "eligibleclinicianspeciality",

              "eligibleclinicianspecialities",

              "eligibleclinicalspeciality",

              "eligibleclinicalspecialist",

              "eligibleclinicalspecialists",

              "clinicianspecialty",

              "clinicalspecialty",

              "specialty"

          ];


          for(
              const wanted of exactNames
          ){

              const found =
                  columns.find(
                      column =>
                          normalizeColumnName(column) ===
                          wanted
                  );


              if(found){

                  return found;

              }

          }


          const broad =
              columns.find(
                  column => {

                      const name =
                          normalizeColumnName(column);

                      return (
                          name.includes("eligible") &&
                          name.includes("special") &&
                          (
                              name.includes("clinician") ||
                              name.includes("clinical")
                          )
                      );

                  }
              );


          if(broad){

              return broad;

          }


          if(columns.length >= 8){

              return columns[7];

          }


          return null;

      }

      /* =========================================================
         FILE URL
      ========================================================= */

      function jsonURL(file){

          return "./" +
              encodeURIComponent(file);

      }


      /* =========================================================
         LOAD JSON
      ========================================================= */

      async function loadFile(file){

          if(
              dataCache.has(file)
          ){
              return dataCache.get(file);
          }

          const response =
              await fetch(
                  jsonURL(file),
                  {
                      cache:"force-cache"
                  }
              );

          if(!response.ok){

              throw new Error(
                  file +
                  " — HTTP " +
                  response.status
              );

          }

          const data =
              await response.json();

          let rows = data;

          if(!Array.isArray(rows)){

              if(Array.isArray(data.data)){
                  rows = data.data;
              }
              else if(Array.isArray(data.rows)){
                  rows = data.rows;
              }
              else if(Array.isArray(data.records)){
                  rows = data.records;
              }
              else if(Array.isArray(data.items)){
                  rows = data.items;
              }
              else{
                  rows = [data];
              }

          }

          dataCache.set(file,rows);

          return rows;
      }


      /* =========================================================
         LOAD TAB
      ========================================================= */

      async function loadTab(tab){

          const cacheKey =
              "__TAB__" + tab.id;

          if(
              dataCache.has(cacheKey)
          ){
              return dataCache.get(cacheKey);
          }

          const results =
              await Promise.all(
                  tab.files.map(
                      file => loadFile(file)
                  )
              );

          const rows = [];

          for(const result of results){
              rows.push(...result);
          }

          dataCache.set(cacheKey,rows);

          return rows;
      }


      /* =========================================================
         GET COLUMNS
      ========================================================= */

      function getDisplayRows(tab,rows = tab.rows || []){
          if(tab.id !== "ddf" || rows.length === 0){
              return rows;
          }

          const firstRow = rows[0];

          if(
              !firstRow ||
              typeof firstRow !== "object" ||
              Array.isArray(firstRow)
          ){
              return rows.slice(1);
          }

          const sourceColumns = Object.keys(firstRow);
          const displayColumns = sourceColumns.map(sourceColumn => {
              const heading = valueString(firstRow[sourceColumn]).trim();
              return heading || sourceColumn;
          });

          return rows.slice(1).map(row => {
              const displayRow = {};

              sourceColumns.forEach((sourceColumn,index) => {
                  displayRow[displayColumns[index]] = row?.[sourceColumn];
              });

              return displayRow;
          });
      }

      function getColumns(tab,rows){

          if(
              columnsCache.has(tab.id)
          ){
              return columnsCache.get(tab.id);
          }

          const columns = [];
          const seen = new Set();

          for(const row of rows){

              if(
                  !row ||
                  typeof row !== "object"
              ){
                  continue;
              }

              if(Array.isArray(row)){
                  continue;
              }

              for(const key of Object.keys(row)){

                  if(!seen.has(key)){

                      seen.add(key);
                      columns.push(key);

                  }

              }

          }


          if(tab.id === "apg"){

              const thiqa =
                  columns.find(
                      c =>
                          normalizeColumnName(c) ===
                          "thiqa"
                  );

              const basic =
                  columns.find(
                      c =>
                          normalizeColumnName(c) ===
                          "basic"
                  );

              if(thiqa && basic){

                  const normal =
                      columns.filter(
                          c =>
                              c !== thiqa &&
                              c !== basic
                      );

                  columns.length = 0;

                  columns.push(
                      ...normal,
                      thiqa,
                      basic
                  );

              }

          }


          columnsCache.set(
              tab.id,
              columns
          );

          return columns;
      }

      /* =========================================================
         FILTER MATCH
      ========================================================= */

      function matchesFilters(row){

          const state =
              filters.get(currentTab.id);

          if(
              !state ||
              state.size === 0
          ){
              return true;
          }

          for(
              const [column,selected]
              of state
          ){

              let value = "";

              if(Array.isArray(row)){

                  const columns =
                      getColumns(
                          currentTab,
                          currentTab.rows || []
                      );

                  const index =
                      columns.indexOf(column);

                  value =
                      valueString(
                          index >= 0
                              ? row[index]
                              : ""
                      );

              }
              else{

                  value =
                      valueString(
                          row[column]
                      );

              }


              if(!selected.has(value)){
                  return false;
              }

          }

          return true;
      }


      /* =========================================================
         GET VISIBLE ROWS
      ========================================================= */

      function getVisibleRows(rows){

          const state =
              filters.get(currentTab.id);

          if(
              !state ||
              state.size === 0
          ){
              return rows;
          }

          const result = [];

          if(currentTab.id === "contacts"){
              const columns = getColumns(currentTab,rows);
              const bColumn = columns[1];
              const selectedB = state.get(bColumn);

              if(selectedB){
                  const included = new Set();

                  for(let i=0;i<rows.length;i++){
                      if(!matchesFilters(rows[i])){
                          continue;
                      }

                      included.add(i);

                      const mergeGroup = contactsColumnBMerges.find(group =>
                          i >= group.start && i < group.end
                      );

                      if(mergeGroup){
                          for(
                              let member=mergeGroup.start;
                              member<Math.min(mergeGroup.end,rows.length);
                              member++
                          ){
                              included.add(member);
                          }
                      }
                  }

                  for(let i=0;i<rows.length;i++){
                      if(included.has(i)){
                          const row = rows[i];
                          result.push(row);

                          if(row && typeof row === "object"){
                              contactsOriginalRowIndexes.set(row,i);
                          }
                      }
                  }

                  return result;
              }
          }

          for(
              let i=0;
              i<rows.length;
              i++
          ){

              if(matchesFilters(rows[i])){
                  result.push(rows[i]);
              }

          }

          return result;
      }


      /* =========================================================
         PPI SPECIALTY FILTER VALUES
      ========================================================= */

      function getPpiSpecialtyValues(rows){

          const column =
              findPpiSpecialtyColumn(rows);

          if(column === null){
              return [];
          }


          const values =
              new Set();


          for(let i=1; i<rows.length; i++){

              const row =
                  rows[i];

              const value =
                  getPpiSpecialtyValue(
                      row,
                      column
                  );


              if(
                  !value ||
                  value === "Eligible Clinician Specialty" ||
                  value === "Specialist"
              ){
                  continue;
              }


              values.add(value);

          }


          return Array.from(values).sort(
              (a,b) =>
                  a.localeCompare(
                      b,
                      undefined,
                      {
                          numeric:true,
                          sensitivity:"base"
                      }
                  )
          );

      }

          return ppiSpecialtyFilters.has(value);

      function isNoWrapCodeColumn(tab,column){

          const lower =
              normalizeColumnName(column);

          return (
              tab.id === "apg" &&
              lower.includes("haad") &&
              lower.includes("code")
          ) || (
              tab.id === "haad" &&
              lower.includes("drug") &&
              lower.includes("code")
          ) || (
              tab.id === "fmc" &&
              lower.includes("drug") &&
              lower.includes("code")
          ) || (
              tab.id === "vitamins" &&
              (
                  lower.includes("proactive") &&
                  lower.includes("id") ||
                  lower.includes("haad") &&
                  lower.includes("code")
              )
          ) || (
              tab.id === "adnic" &&
              (
                  lower.includes("drug") &&
                  lower.includes("code") ||
                  lower.includes("ddc")
              )
        ) || (
            tab.id === "aafiya" &&
            lower.includes("doh") &&
            lower.includes("code")
        ) || (
            tab.id === "cdc" &&
            (
                lower.includes("item") &&
                lower.includes("code") ||
                lower === "retail" ||
                lower.includes("maximum") &&
                lower.includes("daily") &&
                lower.includes("dose")
            )
        ) || (
            tab.id === "ddf" &&
            lower.includes("drug") &&
            lower.includes("code")
        ) || (
            tab.id === "denial" &&
            lower !== "description" &&
            !isDenialDescriptionColumn(column)
        );

      }


      function calculateNoWrapColumnWidth(
          column,
          rows,
          columnIndex,
          displayLabel = String(column),
          minimumWidth = 110,
          contentPadding = 18
      ){

          const canvas =
              document.createElement("canvas");

          const context =
              canvas.getContext("2d");

          if(context){
              context.font =
                  '11px Inter, "Segoe UI", Roboto, Arial, sans-serif';
          }

          let maxContentWidth = 0;

          for(const row of rows){

              const value =
                  valueString(
                      Array.isArray(row)
                          ? row[columnIndex]
                          : row[column]
                  ).replace(/\s+/g," ").trim();

              const measuredWidth =
                  context
                      ? context.measureText(value).width
                      : value.length * 7;

              maxContentWidth =
                  Math.max(
                      maxContentWidth,
                      measuredWidth
                  );

          }

          const headerWidth =
              context
                  ? context.measureText(displayLabel).width + 36
                  : displayLabel.length * 7 + 36;

          return Math.ceil(
                  Math.max(
                  minimumWidth,
                  maxContentWidth + contentPadding,
                  headerWidth
              )
          );

      }

      function calculateWidths(
          tab,
          rows,
          columns
      ){

          if(
              widthCache.has(tab.id)
          ){
              return widthCache.get(tab.id);
          }

          const widths = [];


          for(const column of columns){

              const lower =
                  normalizeColumnName(column);

              if(tab.id === "contacts"){
                  const contactColumnIndex = columns.indexOf(column);

                  if(contactColumnIndex === 0){
                      widths.push(90);
                      continue;
                  }

                  if(contactColumnIndex === 1){
                      widths.push(260);
                      continue;
                  }
              }


              if(
                  isNoWrapCodeColumn(tab,column)
              ){

                  const columnIndex = columns.indexOf(column);
                  widths.push(
                      calculateNoWrapColumnWidth(
                          column,
                          rows,
                          columnIndex,
                          String(column),
                        tab.id === "denial"
                            ? 60
                            : tab.id === "ddf"
                                ? 60
                            : tab.id === "cdc" && lower === "retail"
                                ? 80
                                : 110,
                          18
                      )
                  );

                  continue;

              }


              if(
                  tab.id === "apg" &&
                  isGenericNameColumn(column)
              ){

                  widths.push(230);

                  continue;

              }


              if(
                  tab.id === "vitamins" &&
                  (
                      lower.includes("item") &&
                      lower.includes("name") ||
                      lower.includes("active") &&
                      lower.includes("ingredient")
                  )
              ){

                  widths.push(230);

                  continue;

              }


              if(
                  tab.id === "apg" &&
                  lower.includes("proactive") &&
                  lower.includes("name")
              ){

                  widths.push(230);

                  continue;

              }


              if(
                  tab.id === "apg" &&
                  (
                      lower === "thiqa" ||
                      lower === "basic"
                  )
              ){

                  widths.push(82);

                  continue;
              }


              if(
                  tab.id === "haad" &&
                  isGenericNameColumn(column)
              ){

                  widths.push(330);

                  continue;

              }


              if(
                  tab.id === "haad" &&
                  lower.includes("package") &&
                  lower.includes("name")
              ){

                  widths.push(230);

                  continue;
              }


              if(
                  tab.id === "adnic" &&
                  isGenericNameColumn(column)
              ){

                  widths.push(320);

                  continue;
              }


            if(
                tab.id === "aafiya" &&
                  (
                      lower === "ihavesource" ||
                      lower === "source1" ||
                      lower === "source" ||
                      lower === "gtccode"
                  )
              ){

                  widths.push(100);

                continue;

            }


            if(
                tab.id === "cdc" &&
                lower.includes("remarks")
            ){

                widths.push(240);

                continue;

            }


              if(
                  tab.id === "adnic" &&
                  lower.includes("package") &&
                  lower.includes("name")
              ){

                  widths.push(270);

                  continue;
              }


              if(
                  tab.id === "denial" &&
                  lower === "description"
              ){

                  widths.push(280);

                  continue;

              }


              if(
                  tab.id === "denial" &&
                  isDenialDescriptionColumn(column)
              ){

                  widths.push(480);

                  continue;
              }


              const isCode =
                  lower.includes("code") ||
                  lower.includes("status") ||
                  lower === "id" ||
                  lower.endsWith("id");


              const isDate =
                  lower.includes("date");


              const isNumeric =
                  lower.includes("price") ||
                  lower.includes("amount") ||
                  lower.includes("copay") ||
                  lower.includes("quantity") ||
                  lower.includes("qty");


              const isText =
                  lower.includes("name") ||
                  lower.includes("description") ||
                  lower.includes("remarks") ||
                  lower.includes("notes") ||
                  lower.includes("comment") ||
                  lower.includes("instruction") ||
                  lower.includes("detail") ||
                  lower.includes("reason") ||
                  lower.includes("specialty") ||
                  lower.includes("indication");


              let width = 140;


              if(isCode){
                  width = 105;
              }
              else if(isDate){
                  width = 110;
              }
              else if(isNumeric){
                  width = 105;
              }
              else if(isText){
                  width = 145;
              }


              width =
                  Math.max(
                      90,
                      Math.min(
                          width,
                          150
                      )
                  );


              widths.push(width);

          }


          widthCache.set(
              tab.id,
              widths
          );

          return widths;
      }


      /* =========================================================
         YES / NO
      ========================================================= */

      function yesNoClass(
          tab,
          column,
          value
      ){

          const lower =
              normalizeColumnName(column);

          if(
              tab.id === "vitamins" &&
              (
                  lower.includes("enhanced") ||
                  lower.includes("thiqa")
              )
          ){

              const normalizedValue =
                  value.trim().toLowerCase();

              if(!normalizedValue){
                  return "";
              }

              if(
                  normalizedValue.includes("nci") ||
                  normalizedValue.includes("not covered")
              ){
                  return "apg-no";
              }

              return "apg-yes";

          }

          if(tab.id !== "apg"){
              return "";
          }

          if(
              lower !== "thiqa" &&
              lower !== "basic"
          ){
              return "";
          }

          const normalized =
              value.trim().toLowerCase();

          if(normalized === "yes"){
              return "apg-yes";
          }

          if(normalized === "no"){
              return "apg-no";
          }

          return "apg-frozen";
      }

      /* =========================================================

      function createHeader(
          table,

          columns,

      ){

          const thead =
              document.createElement("thead");

          const tr =
              document.createElement("tr");

          const total =
              columns.length;


          columns.forEach(
              (column,index) => {

              const th =
                  document.createElement("th");

              if(isNoWrapCodeColumn(tab,column)){
                  th.classList.add("nowrap-code-column");
              }


                  th.style.width =
                      widths[index] + "px";

                  th.style.minWidth =
                      widths[index] + "px";

                  th.style.maxWidth =
                      widths[index] + "px";


                  if(
                      tab.id === "apg" &&
                      total >= 2 &&
                      index === total-2
                  ){
                      th.classList.add(
                          "freeze-right-2"
                      );
                  }


                  if(
                      tab.id === "apg" &&
                      total >= 1 &&
                      index === total-1
                  ){
                      th.classList.add(
                          "freeze-right-1"
                      );
                  }


                  const content =
                      document.createElement("div");

                  content.className =
                      "header-content";


                  const label =
                      document.createElement("span");

                  label.className =
                      "header-label";

              const normalizedColumn =
                  normalizeColumnName(column);

              let displayColumn = column;

              if(
                  tab.id === "vitamins" &&
                  normalizedColumn === "itemname"
              ){
                  displayColumn = "Item Name";
              }

              if(
                  tab.id === "aafiya" &&
                  normalizedColumn === "source1"
              ){
                  displayColumn = "Source";
              }

              if(
                  tab.id === "aafiya" &&
                  normalizedColumn === "packagetype1"
              ){
                  displayColumn = "PACKAGE TYPE";
              }

                  label.textContent =
                      displayColumn;

                  label.title =
                      displayColumn;


                  const filter =
                      document.createElement("button");

                  filter.className =
                      "filter-button";

                  filter.type =
                      "button";

                  filter.textContent =
                      "▼";

                  filter.title =
                      "Filter " + column;


                  const state =
                      filters.get(tab.id);

                  if(
                      state &&
                      state.has(column)
                  ){
                      filter.classList.add(
                          "active"
                      );
                  }


                  filter.addEventListener(
                      "click",
                      event => {

                          event.stopPropagation();

                          openFilter(
                              column,
                              filter
                          );

                      }
                  );


                  content.appendChild(label);
                  if(tab.id !== "contacts" || index === 1){
                      content.appendChild(filter);
                  }

                  th.appendChild(content);
                  tr.appendChild(th);

              }
          );


          thead.appendChild(tr);

          table.appendChild(thead);
      }

      function renderVirtualTable(

          container.innerHTML = "";


          if(container._virtualScrollHandler){

              );

          const table =

          ] : [];

          const heights =
              new Array(rows.length)
                  .fill(DEFAULT_HEIGHT);

          function estimateHeight(row){

              let maxLines = 1;


              for(
                  let c=0;
                  c<columns.length;
                  c++
              ){

                  const value =
                      valueString(
                          Array.isArray(row)
                              ? row[c]
                              : row[columns[c]]
                      );


                  if(!value){
                      continue;
                  }


                  const availableWidth =
                      Math.max(
                          25,
                          widths[c] - 12
                      );


                  const charsPerLine =
                      Math.max(
                          6,
                          Math.floor(
                              availableWidth / 6
                          )
                      );


                  const lines =
                      value
                          .split(/\r?\n/)
                          .reduce(
                              (
                                  total,
                                  part
                              ) =>
                                  total +
                                  Math.max(
                                      1,
                                      Math.ceil(
                                          part.length /
                                          charsPerLine
                                      )
                                  ),
                              0
                          );


                  maxLines =
                      Math.max(
                          maxLines,
                          lines
                      );

              return Math.max(
                  DEFAULT_HEIGHT,
                  10 + maxLines * 15

              prefix[0] = 0;

              for(
                  let i=0;
                  i<rows.length;
                  i++
              ){

                  prefix[i+1] =
                      prefix[i] +
                      heights[i];

              }

          }


          rebuildPrefix();


          function findIndex(position){

              let low = 0;

              let high = rows.length;


              while(low < high){

                  const mid =
                      (low + high) >> 1;


                  if(
                      prefix[mid] <
                      position
                  ){

                      low =
                          mid + 1;

                  }
                  else{

                      high =
                          mid;

                  }

              }


              return Math.max(
                  0,
                  Math.min(
                      rows.length,
                      low

              );

                      index < 0 ||
                      index >= rows.length
                  ){
                      return;
                  }


                  const actual =
                      Math.ceil(
                          tr.getBoundingClientRect()
                              .height
                      );


                  if(
                      actual >= DEFAULT_HEIGHT &&
                      Math.abs(
                          actual - heights[index]
                      ) > 1
                  ){

                      heights[index] =
                          actual;

                      changed = true;

                  }

              });


              if(changed){

                  rebuildPrefix();

                  scheduleDraw();

                      scrollTop +
                      viewportHeight -
                      46
                  );


              let start =
                  findIndex(bodyTop);


              let end =
                  findIndex(bodyBottom) + 1;


              start =
                  Math.max(
                      0,
                      start - BUFFER
                  );


              end =
                  Math.min(
                      rows.length,
                      end + BUFFER
                  );

              if(contactMerges.length){

                      let visibleMergeEnd = -1;

                              originalIndex < merge.end

                              if(visibleMergeStart < 0){
                                  visibleMergeStart = index;
                              }

                              visibleMergeEnd = index + 1;
                          }
                      }

                      if(
                          visibleMergeStart >= 0 &&
                          start < visibleMergeEnd &&
                          end > visibleMergeStart
                      ){
                          start = Math.min(start,visibleMergeStart);
                          end = Math.max(end,visibleMergeEnd);
                      }

                      if(
                          tab.id === "apg" &&
                          c === columns.length-2
                      ){

                          td.classList.add(
                              "freeze-right-2"
                          );

                      }


                      if(
                          tab.id === "apg" &&
                          c === columns.length-1
                      ){

                          td.classList.add(
                              "freeze-right-1"
                          );

                      }


                      const colorClass =
                          yesNoClass(
                              tab,
                              column,
                              value
                          );


                      if(colorClass){

                          td.classList.add(
                              colorClass
                          );

                      }


                      tr.appendChild(td);

                  }


                  tbody.appendChild(tr);

              }


              if(end < rows.length){

                  const spacer =
                      document.createElement("tr");

                  spacer.className =
                      "virtual-spacer";


                  const cell =
                      document.createElement("td");

                  cell.colSpan =
                      columns.length;


                  cell.style.height =
                      (
                          prefix[rows.length] -
                          prefix[end]
                      ) + "px";


                  spacer.appendChild(cell);

                  tbody.appendChild(spacer);

              }


              requestAnimationFrame(
                  measureRows
              );

          }


          function scheduleDraw(){

              if(raf){
                  return;
              }

              raf =
                  requestAnimationFrame(
                      draw
                  );

          }


          container._virtualScrollHandler =
              scheduleDraw;


          container.addEventListener(
              "scroll",
              scheduleDraw,
              {
                  passive:true
              }
          );


          draw();

      }


      /* =========================================================
         PPI WIDTHS
      ========================================================= */

      function calculatePpiWidths(columns){

          return columns.map(
              column => {

                  if(
                      isPpiDiagnosisColumn(column)
                  ){

                      return 250;

                  }


                  if(
                      isPpiIcd10Column(column)
                  ){

                      return 75;

                  }


                  if(
                      isPpiDoseColumn(column)
                  ){

                      return 120;

                  }


                  if(
                      isPpiDurationColumn(column)
                  ){

                      return 65;

                  }


                  if(
                      isPpiClinicianEligibilityColumn(column)
                  ){

                      return 90;

                  }


                  if(
                      isPpiNotesColumn(column)
                  ){

                      return 160;

                  }


                  const lower =
                      normalizeColumnName(column);


                  const isCode =
                      lower.includes("code") ||
                      lower === "id" ||
                      lower.endsWith("id");


                  const isDate =
                      lower.includes("date");


                  const isNumeric =
                      lower.includes("price") ||
                      lower.includes("amount") ||
                      lower.includes("copay") ||
                      lower.includes("quantity") ||
                      lower.includes("qty");


                  const isText =
                      lower.includes("name") ||
                      lower.includes("description") ||
                      lower.includes("remarks") ||
                      lower.includes("notes") ||
                      lower.includes("comment") ||
                      lower.includes("instruction") ||
                      lower.includes("detail") ||
                      lower.includes("reason") ||
                      lower.includes("specialty") ||
                      lower.includes("indication");


                  let width = 140;


                  if(isCode){
                      width = 105;
                  }
                  else if(isDate){
                      width = 110;
                  }
                  else if(isNumeric){
                      width = 105;
                  }
                  else if(isText){
                      width = 145;
                  }


                  return Math.max(
                      90,
                      Math.min(
                          width,
                          150
                      )
                  );

              }
          );

      }

      /* =========================================================
         REFILL DATE PARSING
      ========================================================= */

      /*
         Accepts:
         dd/mm/yyyy
         d/m/yyyy
         d-m-yyyy
         d/m/yy
         d-m-yy
         and similar manual formats.

         The displayed result is always:
         dd/mm/yyyy
      */

      function parseManualDate(value){

          if(
              value === null ||
              value === undefined
          ){
              return null;
          }


          const text =
              String(value)
                  .trim();


          if(!text){
              return null;
          }


          const match =
              text.match(
                  /^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2}|\d{4})$/
              );


          if(!match){
              return null;
          }


          let day =
              Number(match[1]);

          let month =
              Number(match[2]);

          let year =
              Number(match[3]);


          if(year < 100){

              year +=
                  year >= 50
                      ? 1900
                      : 2000;

          }


          const date =
              new Date(
                  year,
                  month - 1,
                  day
              );


          if(
              date.getFullYear() !== year ||
              date.getMonth() !== month - 1 ||
              date.getDate() !== day
          ){

              return null;

          }


          return date;

      }


      /*
         Format a Date object as dd/mm/yyyy.
      */

      function formatDateDDMMYYYY(date){

          if(
              !(date instanceof Date) ||
              Number.isNaN(
                  date.getTime()
              )
          ){
              return "";
          }


          const day =
              String(
                  date.getDate()
              ).padStart(2,"0");


          const month =
              String(
                  date.getMonth() + 1
              ).padStart(2,"0");


          const year =
              String(
                  date.getFullYear()
              );


          return (
              day +
              "/" +
              month +
              "/" +
              year
          );

      }


      /*
         Convert manual date into the equivalent
         spreadsheet-style date calculation.
      */

      function calculateRefillFromDate(
          dispenseDate,
          duration
      ){

          const result =
              new Date(
                  dispenseDate.getFullYear(),
                  dispenseDate.getMonth(),
                  dispenseDate.getDate() +
                  duration -
                  11
              );


          return result;

      }


      /*
         E9:
         =DATE(YEAR(D9),MONTH(D9),DAY(D9)+40)
      */

      function calculateRefillToDate(
          fromDate
      ){

          const result =
              new Date(
                  fromDate.getFullYear(),
                  fromDate.getMonth(),
                  fromDate.getDate() + 40
              );


          return result;

      }

                  if(parsed){

             E9:
             =DATE(YEAR(D9),MONTH(D9),DAY(D9)+40)
          */

          function calculateRefill(){

              const dispenseDate =
                  parseManualDate(
                      dateInput.value
                  );


              const durationText =
                  durationInput.value.trim();


              fromResult.textContent =
                  "";

              toResult.textContent =
                  "";


              if(
                  !dispenseDate ||
                  durationText === ""
              ){

                  return;

              }


              const duration =
                  Number(
                      durationText
                  );


              if(
                  !Number.isFinite(duration)
              ){

                  return;

              }


              /*
                 DATE(YEAR(B9),MONTH(B9),DAY(B9)+C9)-11
              */

              const fromDate =
                  calculateRefillFromDate(
                      dispenseDate,
                      duration
                  );


              /*
                 DATE(YEAR(D9),MONTH(D9),DAY(D9)+40)
              */

              const toDate =
                  calculateRefillToDate(
                      fromDate
                  );


              fromResult.textContent =
                  formatDateDDMMYYYY(
                      fromDate
                  );


              toResult.textContent =
                  formatDateDDMMYYYY(
                      toDate
                  );

          }


          /*
             Expose the calculator references only on
             this rendered instance.
          */

          container._refillDateInput =
              dateInput;

          container._refillDurationInput =
              durationInput;

          container._refillFromResult =
              fromResult;

          container._refillToResult =
              toResult;

          container.appendChild(wrap);

          tableArea.appendChild(container);

             so the record pill is replaced with a simple
             calculator indicator.
          */

          recordNumber.textContent =
              "Calculator";


          /*
             Put cursor in the dispense date field.
          */

          setTimeout(
              () => {
                  dateInput.focus();
              },
              50
          );

      }

      function getSearchSourceValue(
          row,
          columns,
          candidates
      ){

          let sourceColumn = null;

          for(const candidate of candidates){
              sourceColumn = columns.find(column =>
                  normalizeColumnName(column) === candidate
              );

              if(
                  !sourceColumn &&
                  row &&
                  typeof row === "object" &&
                  !Array.isArray(row)
              ){
                  sourceColumn = Object.keys(row).find(key =>
                      normalizeColumnName(key) === candidate
                  );
              }

              if(sourceColumn){
                  break;
              }
          }

          if(!sourceColumn){
              return "";
          }

          const value =
              Array.isArray(row)
                  ? row[columns.indexOf(sourceColumn)]
                  : row[sourceColumn];

          return valueString(value);

      }

    function renderRxValidity(){

        tableArea.style.overflow = "auto";
        tableArea.innerHTML = "";

        const card =
            document.createElement("section");

        card.className = "rx-validity-card";

        const instructions =
            document.createElement("p");

        instructions.className = "rx-validity-instructions";
        instructions.innerHTML =
            '<span class="rx-instruction-green">ENTER THE PRESCRIPTION DATE IN THE GREEN FIELD</span><br>' +
            '<span class="rx-instruction-purple">THE PURPLE FIELD WILL SHOW THE LAST DATE TO FILL THE PRESCRIPTION</span>';

        const table =
            document.createElement("table");

        table.className = "rx-validity-table";

        const thead =
            document.createElement("thead");

        const headingRow =
            document.createElement("tr");

        const prescriptionHeading =
            document.createElement("th");

        prescriptionHeading.scope = "col";
        prescriptionHeading.textContent = "Prescription date";

        const lastDateHeading =
            document.createElement("th");

        lastDateHeading.scope = "col";
        lastDateHeading.textContent = "Last date to fill Rx";

        headingRow.appendChild(prescriptionHeading);
        headingRow.appendChild(lastDateHeading);
        thead.appendChild(headingRow);
        table.appendChild(thead);

        const tbody =
            document.createElement("tbody");

        const valuesRow =
            document.createElement("tr");

        const prescriptionCell =
            document.createElement("td");

        const dateInput =
            document.createElement("input");

        dateInput.className = "rx-date-input";
        dateInput.type = "text";
        dateInput.inputMode = "numeric";
        dateInput.autocomplete = "off";
        dateInput.placeholder = "DD/MM/YYYY";
        dateInput.setAttribute("aria-label","Prescription Date, DD/MM/YYYY");

        const dateError =
            document.createElement("div");

        dateError.className = "rx-date-error";
        dateError.setAttribute("aria-live","polite");

        prescriptionCell.appendChild(dateInput);
        prescriptionCell.appendChild(dateError);
        valuesRow.appendChild(prescriptionCell);

        const lastDateCell =
            document.createElement("td");

        const lastDateOutput =
            document.createElement("output");

        lastDateOutput.className = "rx-date-output";
        lastDateOutput.setAttribute("aria-label","Last date to fill prescription");
        lastDateCell.appendChild(lastDateOutput);
        valuesRow.appendChild(lastDateCell);
        tbody.appendChild(valuesRow);

        table.appendChild(tbody);
        card.appendChild(instructions);
        card.appendChild(table);
        tableArea.appendChild(card);

        recordNumber.textContent = "Calculator";

        dateInput.addEventListener("input",() => {

            const rawDate = dateInput.value.trim();

            if(!rawDate){
                lastDateOutput.textContent = "";
                dateError.textContent = "";
                return;
            }

            const match = rawDate.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2}|\d{4})$/);

            if(!match){
                lastDateOutput.textContent = "";
                dateError.textContent = "Enter a valid date as D/M/YY or DD/MM/YYYY.";
                return;
            }

            const day = Number(match[1]);
            const month = Number(match[2]);
            let year = Number(match[3]);

            if(year < 100){
                year += year < 50 ? 2000 : 1900;
            }

            const date = new Date(Date.UTC(year,month - 1,day));

            if(
                date.getUTCFullYear() !== year ||
                date.getUTCMonth() !== month - 1 ||
                date.getUTCDate() !== day
            ){
                lastDateOutput.textContent = "";
                dateError.textContent = "Enter a valid date as D/M/YY or DD/MM/YYYY.";
                return;
            }

            const normalizedPrescriptionDate = [
                String(day).padStart(2,"0"),
                String(month).padStart(2,"0"),
                String(year).padStart(4,"0")
            ].join("/");

            dateInput.value = normalizedPrescriptionDate;

            date.setUTCDate(date.getUTCDate() + 59);

            const formatted = [
                String(date.getUTCDate()).padStart(2,"0"),
                String(date.getUTCMonth() + 1).padStart(2,"0"),
                String(date.getUTCFullYear()).padStart(4,"0")
            ].join("/");

            lastDateOutput.textContent = formatted;
            dateError.textContent = "";

        });

    }

      function getApgCapCellValue(row,column,columns){

          if(!column){
              return "";
          }

          if(Array.isArray(row)){
              return valueString(
                  row[columns.indexOf(column)]
              );
          }

          return valueString(row && row[column]);

      }


      function getApgCapVisibleRows(rows,columns,filterKey){

          const state =
              customTableFilters.get(filterKey);

          if(!state || state.size === 0){
              return rows;
          }

          return rows.filter(row => {
              for(const [column,selected] of state){
                  const value =
                      getApgCapCellValue(row,column,columns);

                  if(!selected.has(value)){
                      return false;
                  }
              }

              return true;
          });

      }
