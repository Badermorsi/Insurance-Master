/* =========================================================

========================================================= */

function shuffle(array){

    const copy = [...array];

    for(
        let i = copy.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            copy[i],
            copy[j]
        ] =
        [
            copy[j],
            copy[i]
        ];

    }

    return copy;

}

/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   VALUE
========================================================= */

function valueString(value){

    if(
        value === null ||
        value === undefined
    ){
        return "";
    }

    if(typeof value === "object"){

        try{
            return JSON.stringify(value);
        }
        catch{
            return String(value);
        }

    }

    return String(value);

}


/* =========================================================
   JSON URL
========================================================= */

function jsonURL(file){

    return "./" +
        encodeURIComponent(file)
        .replace(/%2F/g,"/");

}


/* =========================================================
   LOAD ONE JSON
========================================================= */

async function loadFile(file){

    if(dataCache.has(file)){

        return dataCache.get(file);

    }


    const response =
        await fetch(
            jsonURL(file),
            {
                cache:"force-cache"
            }
        );


    if(!response.ok){

        throw new Error(
            file +
            " — HTTP " +
            response.status
        );

    }


    const data =
        await response.json();


    let rows = data;


    if(!Array.isArray(rows)){

        if(Array.isArray(data.data))
            rows = data.data;

        else if(Array.isArray(data.rows))
            rows = data.rows;

        else if(Array.isArray(data.records))
            rows = data.records;

        else if(Array.isArray(data.items))
            rows = data.items;

        else
            rows = [data];

    }


    dataCache.set(file,rows);

    return rows;

}


/* =========================================================
   LOAD TAB
========================================================= */

async function loadTab(tab){

    const cacheKey =
        "__TAB__" + tab.id;


    if(dataCache.has(cacheKey)){

        return dataCache.get(cacheKey);

    }


    /*
       All files in a tab load simultaneously.
       HAAD therefore loads 1,2,3 in parallel.
    */

    const results =
        await Promise.all(
            tab.files.map(
                file => loadFile(file)
            )
        );


    const rows = [];

    for(const result of results){

        rows.push(...result);

    }


    dataCache.set(
        cacheKey,
        rows
    );


    return rows;

}


/* =========================================================
   COLUMNS
========================================================= */

function getColumns(rows){

    const columns = [];

    const seen = new Set();


    /*
       Most JSON files have the same columns on every row.
       Stop once all columns are found.
    */

    for(
        let i = 0;
        i < rows.length;
        i++
    ){

        const row = rows[i];

        if(
            !row ||
            typeof row !== "object"
        ){
            continue;
        }


        for(
            const key of Object.keys(row)
        ){

            if(!seen.has(key)){

                seen.add(key);

                columns.push(key);

            }

        }

    }


    return columns;

}


/* =========================================================
   CREATE TABS
========================================================= */

function createTabs(){

    tabsElement.innerHTML = "";


    tabsConfig.forEach(
        (tab,index)=>{

            const button =
                document.createElement("button");


            button.className =
                "tab";


            button.dataset.id =
                tab.id;


            button.title =
                tab.name;


            button.textContent =
                tab.name;


            button.addEventListener(
                "click",
                ()=>openTab(tab.id)
            );


            tabsElement.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   ACTIVE TAB
========================================================= */

function setActiveTab(id){

    document
        .querySelectorAll(".tab")
        .forEach(button=>{

            button.classList.toggle(
                "active",
                button.dataset.id === id
            );

        });

}


/* =========================================================
   LOADING
========================================================= */

function showLoading(name){

    tableArea.innerHTML = `

        <div class="loading">

            <div class="loading-card">

                <div class="spinner"></div>

                <span>
                    Loading ${escapeHTML(name)}...
                </span>

            </div>

        </div>

    `;

}


/* =========================================================
   OPEN TAB
========================================================= */

async function openTab(id){

    const tab =
        tabsConfig.find(
            item => item.id === id
        );


    if(!tab)
        return;


    currentTab = tab;

    setActiveTab(id);


    /*
       Search starts fresh on each tab.
    */

    globalSearch.value = "";


    if(!filters.has(id)){

        filters.set(
            id,
            new Map()
        );

    }


    const version =
        ++renderVersion;


    /*
       Already loaded?
       Render immediately.
    */

    if(
        dataCache.has(
            "__TAB__" + tab.id
        )
    ){

        tab.rows =
            dataCache.get(
                "__TAB__" + tab.id
            );


        renderTable(
            tab,
            version
        );


        return;

    }


    showLoading(tab.name);


    recordNumber.textContent =
        "Loading";


    try{

        const rows =
            await loadTab(tab);


        if(version !== renderVersion)
            return;


        tab.rows = rows;


        renderTable(
            tab,
            version
        );

    }
    catch(error){

        if(version !== renderVersion)
            return;


        console.error(error);


        tableArea.innerHTML = `

            <div class="error">

                <strong>
                    Could not load ${escapeHTML(tab.name)}
                </strong>

                <br><br>

                ${escapeHTML(error.message)}

                <br><br>

                Check that the JSON filename in GitHub
                exactly matches the filename configured
                in this HTML file.

            </div>

        `;


        recordNumber.textContent =
            "Error";

    }

}


/* =========================================================
   SEARCH
========================================================= */

function matchesSearch(row){

    const search =
        globalSearch.value
            .trim()
            .toLowerCase();


    if(!search)
        return true;


    /*
       % = AND
    */

    const terms =
        search
            .split("%")
            .map(x=>x.trim())
            .filter(Boolean);


    const rowText =
        Object.values(row)
            .map(valueString)
            .join(" ")
            .toLowerCase();


    return terms.every(
        term =>
            rowText.includes(term)
    );

}


/* =========================================================
   FILTER
========================================================= */

function matchesFilters(row){

    const state =
        filters.get(
            currentTab.id
        );


    if(!state || state.size === 0)
        return true;


    for(
        const [column,selected]
        of state
    ){

        if(!selected)
            continue;


        const value =
            valueString(
                row[column]
            );


        if(!selected.has(value))
            return false;

    }


    return true;

}


/* =========================================================
   GET VISIBLE ROWS
========================================================= */

function getVisibleRows(rows){

    const result = [];


    for(const row of rows){

        if(!matchesFilters(row))
            continue;


        if(!matchesSearch(row))
            continue;


        result.push(row);

    }


    return result;

}


/* =========================================================
   RENDER TABLE
========================================================= */

function renderTable(tab,version){

    if(version !== renderVersion)
        return;


    const rows =
        tab.rows || [];


    if(rows.length === 0){

        tableArea.innerHTML =
            `<div class="empty">
                No data found.
             </div>`;

        recordNumber.textContent =
            "0";

        return;

    }


    const columns =
        getColumns(rows);


    const visible =
        getVisibleRows(rows);


    recordNumber.textContent =
        visible.length.toLocaleString();


    /*
       Build table.
    */

    tableArea.innerHTML = "";


    const table =
        document.createElement("table");


    const thead =
        document.createElement("thead");


    const headerRow =
        document.createElement("tr");


    const state =
        filters.get(tab.id);


    columns.forEach(
        column=>{

            const th =
                document.createElement("th");


            const inner =
                document.createElement("div");


            inner.className =
                "th-inner";


            const name =
                document.createElement("span");


            name.className =
                "th-name";


            name.textContent =
                column;


            name.title =
                column;


            const button =
                document.createElement("button");


            button.className =
                "filter-button";


            if(
                state &&
                state.has(column)
            ){

                button.classList.add(
                    "active"
                );

            }


            button.textContent =
                "▼";


            button.title =
                "Filter " + column;


            button.addEventListener(
                "click",
                event=>{

                    event.stopPropagation();


                    openFilter(
                        column,
                        button
                    );

                }
            );


            inner.appendChild(name);

            inner.appendChild(button);

            th.appendChild(inner);

            headerRow.appendChild(th);

        }
    );


    thead.appendChild(headerRow);


    const tbody =
        document.createElement("tbody");


    table.appendChild(thead);

    table.appendChild(tbody);

    tableArea.appendChild(table);


    /*
       Render in chunks.
    */

    const CHUNK =
        300;


    let position = 0;


    function renderChunk(){

        if(version !== renderVersion)
            return;


        const fragment =
            document.createDocumentFragment();


        const end =
            Math.min(
                position + CHUNK,
                visible.length
            );


        for(
            let i = position;
            i < end;
            i++
        ){

            const row =
                visible[i];


            const tr =
                document.createElement("tr");


            for(const column of columns){

                const td =
                    document.createElement("td");


                td.textContent =
                    valueString(
                        row[column]
                    );


                tr.appendChild(td);

            }


            fragment.appendChild(tr);

        }


        tbody.appendChild(fragment);


        position = end;


        if(position < visible.length){

            requestAnimationFrame(
                renderChunk
            );

        }

    }


    requestAnimationFrame(
        renderChunk
    );

}


/* =========================================================
   OPEN FILTER
========================================================= */

function openFilter(column,button){

    if(!currentTab)
        return;


    filterColumn =
        column;


    const values =
        new Set();


    for(
        const row of currentTab.rows
    ){

        values.add(
            valueString(
                row[column]
            )
        );

    }


    filterAllValues =
        Array.from(values);


    filterAllValues.sort(
        (a,b)=>
            a.localeCompare(
                b,
                undefined,
                {
                    numeric:true,
                    sensitivity:"base"
                }
            )
    );


    const state =
        filters.get(
            currentTab.id
        );


    const existing =
        state &&
        state.get(column);


    if(existing){

        temporarySelection =
            new Set(existing);

    }
    else{

        temporarySelection =
            new Set(
                filterAllValues
            );

    }


    filterTitle.textContent =
        "Filter: " + column;


    filterSearch.value = "";


    renderFilterValues();


    filterPopup.style.display =
        "block";


    /*
       Position popup.
    */

    const rect =
        button.getBoundingClientRect();


    const width =
        filterPopup.offsetWidth;


    const height =
        filterPopup.offsetHeight;


    let left =
        rect.left;


    let top =
        rect.bottom + 5;


    if(
        left + width >
        window.innerWidth - 10
    ){

        left =
            window.innerWidth -
            width -
            10;

    }


    if(
        top + height >
        window.innerHeight - 10
    ){

        top =
            rect.top -
            height -
            5;

    }


    if(left < 10)
        left = 10;


    if(top < 10)
        top = 10;


    filterPopup.style.left =
        left + "px";


    filterPopup.style.top =
        top + "px";


    filterSearch.focus();

}


/* =========================================================
   FILTER VALUES
========================================================= */

function renderFilterValues(){

    const search =
        filterSearch.value
            .trim()
            .toLowerCase();


    filterValues.innerHTML = "";


    const fragment =
        document.createDocumentFragment();


    for(
        const value of filterAllValues
    ){

        const display =
            value === ""
                ? "(Blank)"
                : value;


        if(
            search &&
            !display
                .toLowerCase()
                .includes(search)
        ){

            continue;

        }


        const label =
            document.createElement("label");


        label.className =
            "filter-value";


        const checkbox =
            document.createElement("input");


        checkbox.type =
            "checkbox";


        checkbox.checked =
            temporarySelection.has(
                value
            );


        checkbox.addEventListener(
            "change",
            ()=>{

                if(checkbox.checked){

                    temporarySelection.add(
                        value
                    );

                }
                else{

                    temporarySelection.delete(
                        value
                    );

                }

            }
        );


        const text =
            document.createElement("span");


        text.className =
            "filter-value-text";


        text.textContent =
            display;


        text.title =
            display;


        label.appendChild(
            checkbox
        );


        label.appendChild(
            text
        );


        fragment.appendChild(
            label
        );

    }


    filterValues.appendChild(
        fragment
    );

}


/* =========================================================
   FILTER SEARCH
========================================================= */

filterSearch.addEventListener(
    "input",
    renderFilterValues
);


/* =========================================================
   SELECT ALL
========================================================= */

document
    .getElementById("selectAll")
    .addEventListener(
        "click",
        ()=>{

            temporarySelection =
                new Set(
                    filterAllValues
                );


            renderFilterValues();

        }
    );


/* =========================================================
   UNCHECK ALL
========================================================= */

document
    .getElementById("uncheckAll")
    .addEventListener(
        "click",
        ()=>{

            temporarySelection =
                new Set();


            renderFilterValues();

        }
    );


/* =========================================================
   APPLY
========================================================= */

document
    .getElementById("applyFilter")
    .addEventListener(
        "click",
        ()=>{

            if(
                !currentTab ||
                filterColumn === null
            ){

                return;

            }


            const state =
                filters.get(
                    currentTab.id
                );


            /*
               All values selected =
               no active filter.
            */

            if(
                temporarySelection.size ===
                filterAllValues.length
            ){

                state.delete(
                    filterColumn
                );

            }
            else{

                state.set(
                    filterColumn,
                    new Set(
                        temporarySelection
                    )
                );

            }


            closeFilter();


            renderTable(
                currentTab,
                ++renderVersion
            );

        }
    );


/* =========================================================
   CANCEL
========================================================= */

document
    .getElementById("cancelFilter")
    .addEventListener(
        "click",
        closeFilter
    );


/* =========================================================
   CLOSE FILTER
========================================================= */

function closeFilter(){

    filterPopup.style.display =
        "none";

    filterColumn =
        null;

}


/* =========================================================
   CLEAR SEARCH + FILTERS
========================================================= */

document
    .getElementById("clearButton")
    .addEventListener(
        "click",
        ()=>{

            if(!currentTab)
                return;


            globalSearch.value = "";


            filters.set(
                currentTab.id,
                new Map()
            );


            closeFilter();


            renderTable(
                currentTab,
                ++renderVersion
            );

        }
    );


/* =========================================================
   SEARCH DEBOUNCE
========================================================= */

let searchTimer = null;


globalSearch.addEventListener(
    "input",
    ()=>{

        clearTimeout(searchTimer);


        searchTimer =
            setTimeout(
                ()=>{

                    if(!currentTab)
                        return;


                    renderTable(
                        currentTab,
                        ++renderVersion
                    );

                },
                80
            );

    }
);


/* =========================================================
   CLICK OUTSIDE FILTER
========================================================= */

document.addEventListener(
    "mousedown",
    event=>{

        if(
            filterPopup.style.display === "block" &&
            !filterPopup.contains(event.target) &&
            !event.target.closest(".filter-button")
        ){

            closeFilter();

        }

    }
);


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
    "keydown",
    event=>{

        if(event.key === "Escape"){

            closeFilter();

        }

    }
);


/* =========================================================
   INITIALIZE
========================================================= */

createTabs();


/*
   APG is always first.
*/

openTab("apg");

</script>

</body>
</html>
