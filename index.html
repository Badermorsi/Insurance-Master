/* =========================================================
   RANDOMIZE REMAINING
========================================================= */

function shuffle(array){

    const result = [...array];

    for(
        let i = result.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            result[i],
            result[j]
        ] =
        [
            result[j],
            result[i]
        ];

    }

    return result;

}

/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   VALUE TO STRING
========================================================= */

function valueString(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    if(typeof value === "object"){

        try{

            return JSON.stringify(value);

        }
        catch{

            return String(value);

        }

    }


    return String(value);

}


/* =========================================================
   FILE URL
========================================================= */

function jsonURL(file){

    return "./" +
        encodeURIComponent(file);

}


/* =========================================================
   LOAD FILE
========================================================= */

async function loadFile(file){

    if(dataCache.has(file)){

        return dataCache.get(file);

    }


    const response =
        await fetch(
            jsonURL(file),
            {
                cache:"force-cache"
            }
        );


    if(!response.ok){

        throw new Error(
            file +
            " — HTTP " +
            response.status
        );

    }


    const data =
        await response.json();


    let rows = data;


    if(!Array.isArray(rows)){

        if(Array.isArray(data.data)){

            rows = data.data;

        }
        else if(Array.isArray(data.rows)){

            rows = data.rows;

        }
        else if(Array.isArray(data.records)){

            rows = data.records;

        }
        else if(Array.isArray(data.items)){

            rows = data.items;

        }
        else{

            rows = [data];

        }

    }


    dataCache.set(
        file,
        rows
    );


    return rows;

}


/* =========================================================
   LOAD TAB
========================================================= */

async function loadTab(tab){

    const cacheKey =
        "__TAB__" + tab.id;


    if(dataCache.has(cacheKey)){

        return dataCache.get(cacheKey);

    }


    const results =
        await Promise.all(
            tab.files.map(
                file =>
                    loadFile(file)
            )
        );


    const rows = [];


    for(const result of results){

        rows.push(...result);

    }


    dataCache.set(
        cacheKey,
        rows
    );


    return rows;

}


/* =========================================================
   COLUMNS
========================================================= */

function getColumns(rows){

    const columns = [];

    const seen =
        new Set();


    for(
        const row of rows
    ){

        if(
            !row ||
            typeof row !== "object"
        ){

            continue;

        }


        for(
            const key of Object.keys(row)
        ){

            if(!seen.has(key)){

                seen.add(key);

                columns.push(key);

            }

        }

    }


    return columns;

}


/* =========================================================
   CREATE TABS
========================================================= */

function createTabs(){

    tabsElement.innerHTML = "";


    tabsConfig.forEach(
        tab=>{

            const button =
                document.createElement("button");


            button.className =
                "tab";


            button.dataset.id =
                tab.id;


            button.textContent =
                tab.name;


            button.title =
                tab.name;


            button.addEventListener(
                "click",
                ()=>{
                    openTab(tab.id);
                }
            );


            tabsElement.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   ACTIVE TAB
========================================================= */

function setActiveTab(id){

    document
        .querySelectorAll(".tab")
        .forEach(
            button=>{

                button.classList.toggle(
                    "active",
                    button.dataset.id === id
                );

            }
        );

}


/* =========================================================
   LOADING
========================================================= */

function showLoading(name){

    tableArea.innerHTML = `

        <div class="loading">

            <div class="loading-box">

                <div class="spinner"></div>

                <div class="loading-text">
                    Loading ${escapeHTML(name)}...
                </div>

            </div>

        </div>

    `;

}


/* =========================================================
   OPEN TAB
========================================================= */

async function openTab(id){

    const tab =
        tabsConfig.find(
            item =>
                item.id === id
        );


    if(!tab)
        return;


    currentTab = tab;


    setActiveTab(id);


    currentList.textContent =
        tab.name;


    const version =
        ++renderVersion;


    if(!filters.has(id)){

        filters.set(
            id,
            new Map()
        );

    }


    if(
        dataCache.has(
            "__TAB__" + tab.id
        )
    ){

        tab.rows =
            dataCache.get(
                "__TAB__" + tab.id
            );


        renderTable(
            tab,
            version
        );


        return;

    }


    showLoading(
        tab.name
    );


    recordNumber.textContent =
        "Loading";


    try{

        const rows =
            await loadTab(tab);


        if(
            version !==
            renderVersion
        ){

            return;

        }


        tab.rows =
            rows;


        renderTable(
            tab,
            version
        );

    }
    catch(error){

        if(
            version !==
            renderVersion
        ){

            return;

        }


        console.error(error);


        tableArea.innerHTML = `

            <div class="error">

                <strong>
                    Could not load ${escapeHTML(tab.name)}
                </strong>

                <br><br>

                ${escapeHTML(error.message)}

                <br><br>

                Check that the JSON filename in GitHub
                exactly matches the filename configured
                in this HTML file.

            </div>

        `;


        recordNumber.textContent =
            "Error";

    }

}


/* =========================================================
   FILTER MATCH
========================================================= */

function matchesFilters(row){

    const state =
        filters.get(
            currentTab.id
        );


    if(
        !state ||
        state.size === 0
    ){

        return true;

    }


    for(
        const [
            column,
            selected
        ]
        of state
    ){

        const value =
            valueString(
                row[column]
            );


        if(
            !selected.has(value)
        ){

            return false;

        }

    }


    return true;

}


/* =========================================================
   VISIBLE ROWS
========================================================= */

function getVisibleRows(rows){

    const result = [];


    for(
        const row of rows
    ){

        if(
            matchesFilters(row)
        ){

            result.push(row);

        }

    }


    return result;

}


/* =========================================================
   COLUMN WIDTH
========================================================= */

function calculateWidths(
    rows,
    columns
){

    /*
       Estimate width from header and
       a sample of the actual data.

       This prevents:
       - tiny headers
       - enormous columns
       - every column having the same width
    */

    const sample =
        rows.slice(
            0,
            Math.min(
                rows.length,
                250
            )
        );


    return columns.map(
        column=>{

            let maxLength =
                column.length;


            for(
                const row of sample
            ){

                const text =
                    valueString(
                        row[column]
                    )
                    .replace(
                        /\s+/g,
                        " "
                    );


                /*
                   Don't allow one massive
                   description to determine
                   the whole column width.
                */

                const length =
                    Math.min(
                        text.length,
                        42
                    );


                if(
                    length >
                    maxLength
                ){

                    maxLength =
                        length;

                }

            }


            let width =
                54 +
                maxLength * 5.5;


            /*
               Useful minimum.
            */

            width =
                Math.max(
                    width,
                    85
                );


            /*
               Useful maximum.
            */

            width =
                Math.min(
                    width,
                    280
                );


            /*
               Numeric / short columns.
            */

            if(
                maxLength <= 8
            ){

                width =
                    Math.min(
                        Math.max(
                            width,
                            85
                        ),
                        125
                    );

            }


            return Math.round(width);

        }
    );

}


/* =========================================================
   RENDER TABLE
========================================================= */

function renderTable(
    tab,
    version
){

    if(
        version !==
        renderVersion
    ){

        return;

    }


    const rows =
        tab.rows || [];


    if(
        rows.length === 0
    ){

        tableArea.innerHTML = `

            <div class="empty">
                No data found.
            </div>

        `;


        recordNumber.textContent =
            "0";


        return;

    }


    const columns =
        getColumns(rows);


    const visible =
        getVisibleRows(rows);


    recordNumber.textContent =
        visible.length.toLocaleString();


    tableArea.innerHTML = "";


    const table =
        document.createElement("table");


    /*
       Dynamic column widths.
    */

    const widths =
        calculateWidths(
            rows,
            columns
        );


    const colgroup =
        document.createElement(
            "colgroup"
        );


    widths.forEach(
        width=>{

            const col =
                document.createElement("col");


            col.style.width =
                width + "px";


            colgroup.appendChild(
                col
            );

        }
    );


    table.appendChild(
        colgroup
    );


    /* =====================================================
       HEADER
    ===================================================== */

    const thead =
        document.createElement(
            "thead"
        );


    const headerRow =
        document.createElement(
            "tr"
        );


    const state =
        filters.get(tab.id);


    columns.forEach(
        column=>{

            const th =
                document.createElement(
                    "th"
                );


            const content =
                document.createElement(
                    "div"
                );


            content.className =
                "th-content";


            const label =
                document.createElement(
                    "span"
                );


            label.className =
                "th-label";


            label.textContent =
                column;


            label.title =
                column;


            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "filter-button";


            button.type =
                "button";


            button.textContent =
                "▼";


            button.title =
                "Filter " + column;


            if(
                state &&
                state.has(column)
            ){

                button.classList.add(
                    "active"
                );

            }


            button.addEventListener(
                "click",
                event=>{

                    event.stopPropagation();


                    openFilter(
                        column,
                        button
                    );

                }
            );


            content.appendChild(
                label
            );


            content.appendChild(
                button
            );


            th.appendChild(
                content
            );


            headerRow.appendChild(
                th
            );

        }
    );


    thead.appendChild(
        headerRow
    );


    table.appendChild(
        thead
    );


    /* =====================================================
       BODY
    ===================================================== */

    const tbody =
        document.createElement(
            "tbody"
        );


    table.appendChild(
        tbody
    );


    tableArea.appendChild(
        table
    );


    /*
       Render in chunks so huge HAAD data
       doesn't freeze the browser.
    */

    const CHUNK =
        300;


    let position =
        0;


    function renderChunk(){

        if(
            version !==
            renderVersion
        ){

            return;

        }


        const fragment =
            document.createDocumentFragment();


        const end =
            Math.min(
                position + CHUNK,
                visible.length
            );


        for(
            let i = position;
            i < end;
            i++
        ){

            const row =
                visible[i];


            const tr =
                document.createElement(
                    "tr"
                );


            for(
                const column of columns
            ){

                const td =
                    document.createElement(
                        "td"
                    );


                const value =
                    valueString(
                        row[column]
                    );


                td.textContent =
                    value;


                /*
                   Full value appears on hover.
                */

                if(value.length > 40){

                    td.title =
                        value;

                }


                tr.appendChild(
                    td
                );

            }


            fragment.appendChild(
                tr
            );

        }


        tbody.appendChild(
            fragment
        );


        position =
            end;


        if(
            position <
            visible.length
        ){

            requestAnimationFrame(
                renderChunk
            );

        }

    }


    requestAnimationFrame(
        renderChunk
    );

}


/* =========================================================
   OPEN FILTER
========================================================= */

function openFilter(
    column,
    button
){

    if(!currentTab)
        return;


    filterColumn =
        column;


    const values =
        new Set();


    for(
        const row of currentTab.rows
    ){

        values.add(
            valueString(
                row[column]
            )
        );

    }


    filterAllValues =
        Array.from(values);


    filterAllValues.sort(
        (a,b)=>
            a.localeCompare(
                b,
                undefined,
                {
                    numeric:true,
                    sensitivity:"base"
                }
            )
    );


    const state =
        filters.get(
            currentTab.id
        );


    const existing =
        state &&
        state.get(column);


    if(existing){

        temporarySelection =
            new Set(existing);

    }
    else{

        temporarySelection =
            new Set(
                filterAllValues
            );

    }


    filterTitle.textContent =
        "Filter: " + column;


    filterSearch.value =
        "";


    renderFilterValues();


    filterPopup.style.display =
        "block";


    const rect =
        button.getBoundingClientRect();


    const popupWidth =
        filterPopup.offsetWidth;


    const popupHeight =
        filterPopup.offsetHeight;


    let left =
        rect.left;


    let top =
        rect.bottom + 5;


    if(
        left + popupWidth >
        window.innerWidth - 10
    ){

        left =
            window.innerWidth -
            popupWidth -
            10;

    }


    if(
        top + popupHeight >
        window.innerHeight - 10
    ){

        top =
            rect.top -
            popupHeight -
            5;

    }


    if(left < 10)
        left = 10;


    if(top < 10)
        top = 10;


    filterPopup.style.left =
        left + "px";


    filterPopup.style.top =
        top + "px";


    filterSearch.focus();

}


/* =========================================================
   FILTER VALUES
========================================================= */

function renderFilterValues(){

    const search =
        filterSearch.value
            .trim()
            .toLowerCase();


    filterValues.innerHTML =
        "";


    const fragment =
        document.createDocumentFragment();


    for(
        const value of filterAllValues
    ){

        const display =
            value === ""
                ? "(Blank)"
                : value;


        if(
            search &&
            !display
                .toLowerCase()
                .includes(search)
        ){

            continue;

        }


        const label =
            document.createElement(
                "label"
            );


        label.className =
            "filter-value";


        const checkbox =
            document.createElement(
                "input"
            );


        checkbox.type =
            "checkbox";


        checkbox.checked =
            temporarySelection.has(
                value
            );


        checkbox.addEventListener(
            "change",
            ()=>{

                if(
                    checkbox.checked
                ){

                    temporarySelection.add(
                        value
                    );

                }
                else{

                    temporarySelection.delete(
                        value
                    );

                }

            }
        );


        const text =
            document.createElement(
                "span"
            );


        text.className =
            "filter-value-text";


        text.textContent =
            display;


        text.title =
            display;


        label.appendChild(
            checkbox
        );


        label.appendChild(
            text
        );


        fragment.appendChild(
            label
        );

    }


    filterValues.appendChild(
        fragment
    );

}


/* =========================================================
   FILTER SEARCH
========================================================= */

filterSearch.addEventListener(
    "input",
    renderFilterValues
);


/* =========================================================
   SELECT ALL
========================================================= */

document
    .getElementById("selectAll")
    .addEventListener(
        "click",
        ()=>{

            temporarySelection =
                new Set(
                    filterAllValues
                );


            renderFilterValues();

        }
    );


/* =========================================================
   UNCHECK ALL
========================================================= */

document
    .getElementById("uncheckAll")
    .addEventListener(
        "click",
        ()=>{

            temporarySelection =
                new Set();


            renderFilterValues();

        }
    );


/* =========================================================
   APPLY FILTER
========================================================= */

document
    .getElementById("applyFilter")
    .addEventListener(
        "click",
        ()=>{

            if(
                !currentTab ||
                filterColumn === null
            ){

                return;

            }


            const state =
                filters.get(
                    currentTab.id
                );


            /*
               Selecting everything means
               no filter.
            */

            if(
                temporarySelection.size ===
                filterAllValues.length
            ){

                state.delete(
                    filterColumn
                );

            }
            else{

                state.set(
                    filterColumn,
                    new Set(
                        temporarySelection
                    )
                );

            }


            closeFilter();


            renderTable(
                currentTab,
                ++renderVersion
            );

        }
    );


/* =========================================================
   CANCEL
========================================================= */

document
    .getElementById("cancelFilter")
    .addEventListener(
        "click",
        closeFilter
    );


/* =========================================================
   CLOSE FILTER
========================================================= */

function closeFilter(){

    filterPopup.style.display =
        "none";

    filterColumn =
        null;

}


/* =========================================================
   CLEAR FILTERS
========================================================= */

document
    .getElementById("clearButton")
    .addEventListener(
        "click",
        ()=>{

            if(!currentTab)
                return;


            filters.set(
                currentTab.id,
                new Map()
            );


            closeFilter();


            renderTable(
                currentTab,
                ++renderVersion
            );

        }
    );


/* =========================================================
   OUTSIDE CLICK
========================================================= */

document.addEventListener(
    "mousedown",
    event=>{

        if(
            filterPopup.style.display ===
            "block" &&
            !filterPopup.contains(
                event.target
            ) &&
            !event.target.closest(
                ".filter-button"
            )
        ){

            closeFilter();

        }

    }
);


/* =========================================================
   ESCAPE
========================================================= */

document.addEventListener(
    "keydown",
    event=>{

        if(
            event.key === "Escape"
        ){

            closeFilter();

        }

    }
);


/* =========================================================
   START
========================================================= */

createTabs();

openTab("apg");

</script>
