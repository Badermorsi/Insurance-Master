<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Insurance All List</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
}

body{
    font-family:
        Inter,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background:#f3f6f8;
    color:#17232d;

    overflow:hidden;
}

button,
input{
    font-family:inherit;
}


/* =========================================================
   APP
========================================================= */

.app{
    width:100%;
    height:100vh;

    display:flex;
    flex-direction:column;

    overflow:hidden;
}


/* =========================================================
   TOP BRAND
========================================================= */

.brand-bar{
    flex:0 0 50px;

    display:flex;
    align-items:center;

    padding:0 18px;

    background:#ffffff;

    border-bottom:1px solid #e5eaee;
}

.logo{
    width:31px;
    height:31px;

    border-radius:8px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            145deg,
            #0f6878,
            #238da0
        );

    color:#ffffff;

    font-size:18px;
    font-weight:800;

    box-shadow:
        0 4px 10px rgba(15,104,120,.20);
}

.logo::before{
    content:"+";
    line-height:1;
}

.brand-name{
    font-size:16px;
    font-weight:750;

    letter-spacing:-.3px;

    color:#20313b;
}


/* =========================================================
   TABS
========================================================= */

.tabs-section{
    flex:0 0 auto;

    padding:8px 12px 9px;

    background:#f3f6f8;

    border-bottom:1px solid #dfe5e9;
}

.tab-search{
    height:34px;
    width:36px;
    flex:0 0 auto;
    margin-right:11px;

    display:flex;
    align-items:center;

    position:relative;
    z-index:220;

    border:1px solid #d8e0e5;
    border-radius:9px;

    background:#ffffff;

    box-shadow:0 2px 5px rgba(28,57,67,.06);

    transition:
        width .2s ease,
        background .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;
}

.tab-search.open{
    width:min(300px,calc(100vw - 220px));

    border-color:#d5e1e5;

    background:#ffffff;

    box-shadow:0 5px 16px rgba(28,57,67,.10);
}

.tab-search-toggle{
    flex:0 0 32px;

    width:32px;
    height:30px;

    display:grid;
    place-items:center;

    padding:0;

    border:0;
    border-radius:8px;

    background:transparent;
    color:#4c6671;

    cursor:pointer;

    transition:
        background .15s ease,
        color .15s ease;
}

.tab-search-toggle:hover,
.tab-search.open .tab-search-toggle{
    background:#eaf5f6;
    color:#12697a;
}

.tab-search-toggle svg{
    width:17px;
    height:17px;
    stroke:currentColor;
}

.tab-search-input{
    flex:1;
    min-width:0;
    width:0;
    height:28px;

    padding:0;

    border:0;
    outline:0;

    background:transparent;
    color:#263943;

    font-size:12px;

    opacity:0;
    transition:
        opacity .14s ease,
        padding .2s ease;
}

.tab-search.open .tab-search-input{
    padding:0 10px 0 2px;
    opacity:1;
}

.tab-search-input::placeholder{
    color:#93a1a8;
}

.tab-search-results{
    position:absolute;
    top:calc(100% + 6px);
    left:0;

    width:100%;
    max-height:280px;
    overflow:auto;

    padding:5px;

    border:1px solid #dbe4e8;
    border-radius:10px;

    background:#ffffff;
    box-shadow:0 12px 28px rgba(25,48,58,.16);
}

.tab-search-result{
    width:100%;

    display:block;

    padding:9px 10px;

    border:0;
    border-radius:7px;

    background:transparent;
    color:#344b55;

    font-family:inherit;
    font-size:12px;
    font-weight:600;
    line-height:1.3;
    text-align:left;

    cursor:pointer;
}

.tab-search-result:hover,
.tab-search-result:focus-visible{
    outline:0;
    background:#edf7f8;
    color:#12697a;
}

.tab-search-empty{
    padding:10px;
    color:#7b8990;
    font-size:11px;
}

.search-tab-stack{
    display:flex;
    flex-direction:column;
    gap:18px;
    min-width:0;
    padding:18px;
}

.search-table-wrap{
    width:100%;
    overflow:auto;
    border:1px solid #d7e1e5;
    border-radius:10px;
    background:#ffffff;
    box-shadow:0 3px 12px rgba(32,58,68,.06);
}

.search-entry-table{
    width:100%;
    min-width:1200px;
    table-layout:fixed;
    border-collapse:separate;
    border-spacing:0;
    font-size:12px;
}

.search-entry-table th,
.search-entry-table td{
    padding:10px 9px;
    border-right:1px solid #e1e8eb;
    border-bottom:1px solid #e1e8eb;
    text-align:center;
    vertical-align:middle;
    overflow-wrap:anywhere;
}

.search-entry-table th:last-child,
.search-entry-table td:last-child{
    border-right:0;
}

.search-entry-table tbody tr:last-child td{
    border-bottom:0;
}

.search-entry-title{
    height:42px;
    background:#12697a;
    color:#ffffff;
    font-size:14px;
    font-weight:750;
    letter-spacing:.1px;
}

.search-entry-headings th{
    height:74px;
    background:#eaf1f3;
    color:#263a44;
    font-weight:750;
}

.search-entry-guidance{
    display:block;
    margin-top:7px;
    color:#687982;
    font-size:9.5px;
    font-weight:500;
    line-height:1.35;
}

.search-entry-row td{
    height:46px;
    background:#ffffff;
    color:#34434c;
}

.search-item-id-input{
    width:100%;
    min-width:0;
    height:32px;
    padding:0 9px;
    border:1px solid #c8d6db;
    border-radius:6px;
    outline:none;
    background:#ffffff;
    color:#20313b;
    font-family:inherit;
    font-size:12px;
    font-weight:600;
    line-height:1.2;
    text-align:center;
}

.search-item-id-input:focus{
    border-color:#168195;
    box-shadow:0 0 0 3px rgba(22,129,149,.13);
}

.search-entry-value{
    display:block;
    min-height:18px;
    overflow-wrap:anywhere;
}

.tabs-grid{
    width:100%;

    display:grid;

    grid-template-columns:
        repeat(15,minmax(0,1fr));

    gap:4px;
}

.tab{
    width:100%;
    min-width:0;

    height:30px;

    padding:0 6px;

    border:1px solid #d8e0e5;

    border-radius:6px;

    background:#ffffff;

    color:#53636e;

    font-size:10.5px;
    font-weight:650;

    letter-spacing:-.05px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;

    cursor:pointer;

    transition:
        background .12s ease,
        color .12s ease,
        border-color .12s ease,
        box-shadow .12s ease,
        transform .08s ease;
}

.tab:hover{
    background:#edf7f9;
    border-color:#9fc3cb;
    color:#12697a;
}

.tab:active{
    transform:scale(.985);
}

.tab.active{
    background:
        linear-gradient(
            135deg,
            #125f70,
            #19869a
        );

    color:#ffffff;

    border-color:#125f70;

    box-shadow:
        0 3px 8px rgba(18,95,112,.22);
}


/* =========================================================
   TABLE BAR
========================================================= */

.table-bar{
    flex:0 0 43px;

    display:flex;
    align-items:center;

    padding:0 14px;

    background:#ffffff;

    border-bottom:1px solid #dfe5e9;
}

.list-name{
    display:flex;
    align-items:center;

    color:#263943;

    font-size:11.5px;
    font-weight:750;
}

.list-dot{
    width:6px;
    height:6px;

    margin-right:7px;

    border-radius:50%;

    background:#1b9a85;
}

.record-pill{
    margin-left:9px;

    padding:3px 9px;

    border-radius:20px;

    background:#eef5f6;

    color:#337483;

    font-size:9.5px;
    font-weight:700;
}

.bar-space{
    flex:1;
}

.clear-button{
    height:28px;

    padding:0 11px;

    border:1px solid #d8e0e4;

    border-radius:6px;

    background:#ffffff;

    color:#667680;

    font-size:9.5px;
    font-weight:700;

    cursor:pointer;
}

.clear-button:hover{
    background:#edf7f8;
    color:#12697a;
    border-color:#9fc3cb;
}


/* =========================================================
   TABLE VIEW
========================================================= */

.table-view{
    position:relative;

    flex:1 1 auto;

    min-height:0;

    overflow:auto;

    background:#ffffff;
}


/* =========================================================
   NORMAL TABLE
========================================================= */

.data-table{
    border-collapse:separate;
    border-spacing:0;

    width:max-content;
    min-width:100%;

    table-layout:fixed;

    font-size:11px;
}

.data-table thead{
    position:sticky;
    top:0;
    z-index:100;
}

.data-table th{
    height:46px;

    padding:0;

    background:#eaf1f3;

    color:#263a44;

    border-right:1px solid #d5dfe3;
    border-bottom:2px solid #c3d1d6;

    font-size:11.5px;
    font-weight:800;

    text-align:center;
    vertical-align:middle;
}

.data-table th:first-child{
    border-left:1px solid #d5dfe3;
}

.header-content{
    width:100%;
    min-height:46px;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:4px;

    padding:4px 4px;
}

.header-label{
    min-width:0;

    line-height:14px;

    text-align:center;

    overflow-wrap:anywhere;
    word-break:break-word;

    white-space:normal;
}

.filter-button{
    flex:0 0 19px;

    width:19px;
    height:19px;

    padding:0;

    border:1px solid #c6d1d6;

    border-radius:4px;

    background:#ffffff;

    color:#65757e;

    font-size:8px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;
}

.filter-button:hover{
    background:#dff0f3;
    color:#12697a;
    border-color:#75aeb9;
}

.filter-button.active{
    background:#12697a;
    color:#ffffff;
    border-color:#12697a;
}


/* =========================================================
   BODY CELLS
========================================================= */

.data-table td{

    height:auto;

    min-height:34px;

    padding:6px 6px;

    background:#ffffff;

    color:#34434c;

    border-right:1px solid #e8edef;
    border-bottom:1px solid #e7ecef;

    text-align:center;
    vertical-align:middle;

    line-height:15px;

    white-space:normal;

    overflow:visible;

    overflow-wrap:anywhere;

    word-break:break-word;

    hyphens:auto;
}

.data-table td.nowrap-code-column{
    white-space:nowrap;
    overflow-wrap:normal;
    word-break:normal;
    hyphens:none;
}

.data-table th.nowrap-code-column .header-label{
    white-space:nowrap;
}

.data-table tbody tr:nth-child(even) td{
    background:#fbfcfd;
}

.data-table tbody tr:hover td{
    background:#eef7f8;
}


/* =========================================================
   NORMAL TABLE COLUMNS
========================================================= */

.data-table col{
    width:150px;
    min-width:150px;
    max-width:150px;
}


/* =========================================================
   HAAD
========================================================= */

.data-table.haad-table td,
.data-table.haad-table th{
    font-size:11px;
}

.data-table.haad-table col.generic-name-column{
    width:230px !important;
    min-width:230px !important;
    max-width:230px !important;
}


/* =========================================================
   ADNIC
========================================================= */

.data-table.adnic-table td,
.data-table.adnic-table th{
    font-size:11px;
}

.data-table.adnic-table col.generic-name-column{
    width:125px !important;
    min-width:125px !important;
    max-width:125px !important;
}


/* =========================================================
   DENIAL CODE
========================================================= */

.data-table.denial-table td,
.data-table.denial-table th{
    font-size:11px;
}

.data-table.denial-table col.denial-description-column{
    width:165px !important;
    min-width:165px !important;
    max-width:165px !important;
}


/* =========================================================
   APG YES / NO
========================================================= */

.apg-yes{
    background:#dff3e7 !important;
    color:#17683b !important;
    font-weight:750 !important;
}

.apg-no{
    background:#fde5e5 !important;
    color:#a43d3d !important;
    font-weight:750 !important;
}


/* =========================================================
   APG FROZEN
========================================================= */

.freeze-right-1{
    position:sticky !important;

    right:0;

    z-index:80;

    box-shadow:
        -4px 0 7px rgba(30,50,60,.07);
}

.freeze-right-2{
    position:sticky !important;

    right:82px;

    z-index:80;
}

thead .freeze-right-1,
thead .freeze-right-2{
    z-index:150;
}

.apg-frozen{
    font-weight:800 !important;
}


/* =========================================================
   PPI SPECIAL LAYOUT
========================================================= */

.ppi-layout{

    width:100%;
    min-width:0;

    height:100%;

    display:grid;

    grid-template-columns:
        minmax(0,1fr)
        8px
        270px;

    align-items:stretch;

    column-gap:0;

    padding:0;

    background:#ffffff;

    overflow:hidden;
}

.ppi-main-area{

    min-width:0;

    width:100%;

    height:100%;

    overflow:hidden;

    background:#ffffff;

    border-right:0;
}

.ppi-main-area .data-table{

    width:100%;

    min-width:0;

    max-width:100%;

    table-layout:fixed;
}

.ppi-gap{

    width:8px;

    min-width:8px;

    height:100%;

    background:#ffffff;
}

.ppi-specialty-area{

    width:270px;

    min-width:270px;

    max-width:270px;

    height:100%;

    overflow:auto;

    background:#ffffff;

    border-left:0;
}

.ppi-specialty-table{

    width:100%;

    min-width:270px;

    table-layout:fixed;

    border-collapse:separate;

    border-spacing:0;

    font-size:11px;
}

.ppi-specialty-table thead{

    position:sticky;

    top:0;

    z-index:120;
}

.ppi-specialty-table th{

    height:46px;

    padding:0;

    background:#eaf1f3;

    color:#263a44;

    border-left:1px solid #d5dfe3;

    border-right:1px solid #d5dfe3;

    border-bottom:2px solid #c3d1d6;

    font-size:11.5px;

    font-weight:800;

    text-align:center;

    vertical-align:middle;
}

.ppi-specialty-header{

    width:100%;

    min-height:46px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    padding:3px 5px;
}

.ppi-specialist-title{

    color:#9a5b16;

    font-size:11px;

    font-weight:900;

    line-height:14px;

    text-align:center;

    white-space:nowrap;
}

.ppi-specialty-title-row{

    width:100%;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:5px;

    margin-top:1px;
}

.ppi-specialty-header-label{

    min-width:0;

    line-height:13px;

    text-align:center;

    overflow-wrap:anywhere;

    word-break:break-word;
}

.ppi-specialty-table td{

    min-height:34px;

    height:auto;

    padding:6px 8px;

    background:#ffffff;

    color:#34434c;

    border-left:1px solid #e8edef;

    border-right:1px solid #e8edef;

    border-bottom:1px solid #e7ecef;

    text-align:center;

    vertical-align:middle;

    line-height:15px;

    white-space:normal;

    overflow-wrap:anywhere;

    word-break:break-word;
}

.ppi-specialty-table tbody tr:nth-child(even) td{
    background:#fbfcfd;
}

.ppi-specialty-table tbody tr:hover td{
    background:#eef7f8;
}

.ppi-specialty-filter{

    flex:0 0 19px;

    width:19px;

    height:19px;

    padding:0;

    border:1px solid #c6d1d6;

    border-radius:4px;

    background:#ffffff;

    color:#65757e;

    font-size:8px;

    display:flex;

    align-items:center;

    justify-content:center;

    cursor:pointer;
}

.ppi-specialty-filter:hover{

    background:#dff0f3;

    color:#12697a;

    border-color:#75aeb9;
}

.ppi-specialty-filter.active{

    background:#12697a;

    color:#ffffff;

    border-color:#12697a;
}

.ppi-main-area .ppi-diagnosis-column{
    width:220px !important;
    min-width:220px !important;
    max-width:220px !important;
}

.ppi-main-area .ppi-icd10-column{
    width:75px !important;
    min-width:75px !important;
    max-width:75px !important;
}

.ppi-main-area .ppi-dose-column{
    width:210px !important;
    min-width:210px !important;
    max-width:210px !important;
}

.ppi-main-area .ppi-duration-column{
    width:65px !important;
    min-width:65px !important;
    max-width:65px !important;
}

.ppi-main-area .ppi-clinician-eligibility-column{
    width:90px !important;
    min-width:90px !important;
    max-width:90px !important;
}

.ppi-main-area .ppi-notes-column{
    width:100px !important;
    min-width:100px !important;
    max-width:100px !important;
}


/* =========================================================
   ELIGIBILITY PORTALS
========================================================= */

.eligibility-table{
    width:100% !important;
    min-width:850px;

    table-layout:fixed;

    border-collapse:separate;
    border-spacing:0;

    font-size:12px;
}

.eligibility-table col.col-a{
    width:230px;
}

.eligibility-table col.col-b{
    width:430px;
}

.eligibility-table col.col-c{
    width:160px;
}

.eligibility-table col.col-d,
.eligibility-table col.col-e,
.eligibility-table col.col-f{
    width:190px;
}

.eligibility-table .top-header{
    height:38px;

    background:#f0f5f6;

    color:#243943;

    border-right:1px solid #d3dfe3;
    border-bottom:1px solid #cbd8dc;

    font-size:12px;
    font-weight:800;

    text-align:center;
    vertical-align:middle;
}

.eligibility-table .top-empty{
    background:#ffffff !important;
    border-right:1px solid #ffffff !important;
    border-bottom:1px solid #ffffff !important;
}

.eligibility-table .main-header{
    height:50px;

    background:#dcebed;

    color:#1f3741;

    border-right:1px solid #c3d4d9;
    border-bottom:2px solid #aebfc5;

    font-size:14px;
    font-weight:900;

    text-align:center;
    vertical-align:middle;

    line-height:17px;
}

.eligibility-table .main-header:first-child{
    border-left:1px solid #c3d4d9;
}

.eligibility-table tbody td{
    height:42px;

    padding:7px 9px;

    background:#ffffff;

    color:#34434c;

    border-right:1px solid #e1e8eb;
    border-bottom:1px solid #e1e8eb;

    text-align:center;
    vertical-align:middle;

    font-size:12px;

    line-height:17px;

    white-space:normal;
    overflow-wrap:anywhere;
    word-break:break-word;
}

.eligibility-table tbody tr:nth-child(even) td{
    background:#fbfcfd;
}

.eligibility-portal{
    font-weight:900 !important;

    color:#1e3540 !important;

    font-size:13px !important;
}

.eligibility-link{
    color:#126f82 !important;

    text-decoration:none;

    font-weight:650;

    white-space:normal;

    overflow-wrap:anywhere;

    word-break:break-word;

    display:block;
}

.eligibility-link:hover{
    text-decoration:underline;
}

.eligibility-type{
    font-weight:750 !important;

    color:#53656e !important;
}


/* =========================================================
   REFILL CALCULATOR
========================================================= */

.refill-container{

    width:100%;
    height:100%;

    overflow:auto;

    background:#ffffff;

    padding:24px 28px 40px;
}


/* Instruction area */

.refill-instructions{

    width:100%;

    margin-bottom:24px;

    display:flex;

    flex-direction:column;

    align-items:flex-start;

    gap:7px;
}

.refill-instruction-title{

    color:#111111;

    font-size:16px;

    font-weight:900;

    line-height:22px;
}

.refill-instruction-green{

    color:#168447;

    font-size:13px;

    font-weight:900;

    line-height:19px;
}

.refill-instruction-blue{

    color:#2874b5;

    font-size:13px;

    font-weight:900;

    line-height:19px;
}

.refill-instruction-orange{

    color:#d28b3f;

    font-size:13px;

    font-weight:900;

    line-height:19px;
}


/*
   The actual calculator table.
   Column A is intentionally only empty space.
*/

.refill-table-wrap{

    width:100%;

    overflow-x:auto;

    background:#ffffff;
}

.refill-table{

    border-collapse:collapse;

    border-spacing:0;

    table-layout:fixed;

    width:900px;

    min-width:900px;

    background:#ffffff;
}


/*
   Column A:
   completely empty visual space.
*/

.refill-table .refill-col-a{
    width:70px;
}

.refill-table .refill-col-b{
    width:230px;
}

.refill-table .refill-col-c{
    width:180px;
}

.refill-table .refill-col-d{

/* =========================================================
   VALUE STRING
========================================================= */

function valueString(value){

    if(
        value === null ||
        value === undefined
    ){
        return "";
    }

    if(
        typeof value === "object"
    ){

        try{
            return JSON.stringify(value);
        }
        catch{
            return String(value);
        }

    }

    return String(value);

}


/* =========================================================
   ROBUST HEADER NORMALIZATION
========================================================= */

function normalizeColumnName(column){

    return String(column ?? "")
        .replace(/\uFEFF/g,"")
        .replace(/\u200B/g,"")
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9]+/g,"");

}


/* =========================================================
   GENERIC NAME
========================================================= */

function isGenericNameColumn(column){

    return normalizeColumnName(column) ===
        "genericname";

}


/* =========================================================
   DENIAL DESCRIPTION
========================================================= */

function isDenialDescriptionColumn(column){

    const name =
        normalizeColumnName(column);

    return (
        name === "examplesdescription" ||
        name === "exampledescription" ||
        (
            name.includes("example") &&
            name.includes("description")
        )
    );

}


/* =========================================================
   FIND PPI SPECIALTY COLUMN
========================================================= */

function findPpiSpecialtyColumn(rows){

    if(
        !rows ||
        !rows.length
    ){
        return null;
    }


    const columns = [];

    const seen = new Set();


    for(const row of rows){

        if(
            !row ||
            typeof row !== "object" ||
            Array.isArray(row)
        ){
            continue;
        }


        for(const key of Object.keys(row)){

            if(
                !seen.has(key)
            ){

                seen.add(key);

                columns.push(key);

            }

        }

    }


    const headerColumn =
        columns.find(
            column =>
                rows.some(
                    row =>
                        valueString(
                            row[column]
                        ).trim() ===
                        "Eligible Clinician Specialty"
                )
        );


    if(headerColumn){

        return headerColumn;

    }


    const exactNames = [

        "eligibleclinicianspecialty",

        "eligibleclinicianspecialties",

        "eligibleclinicalspecialty",

        "eligibleclinicianspeciality",

        "eligibleclinicianspecialities",

        "eligibleclinicalspeciality",

        "eligibleclinicalspecialist",

        "eligibleclinicalspecialists",

        "clinicianspecialty",

        "clinicalspecialty",

        "specialty"

    ];


    for(
        const wanted of exactNames
    ){

        const found =
            columns.find(
                column =>
                    normalizeColumnName(column) ===
                    wanted
            );


        if(found){

            return found;

        }

    }


    const broad =
        columns.find(
            column => {

                const name =
                    normalizeColumnName(column);

                return (
                    name.includes("eligible") &&
                    name.includes("special") &&
                    (
                        name.includes("clinician") ||
                        name.includes("clinical")
                    )
                );

            }
        );


    if(broad){

        return broad;

    }


    if(columns.length >= 8){

        return columns[7];

    }


    return null;

}


/* =========================================================
   FIND PPI SPECIALIST MARKER COLUMN
========================================================= */

function findPpiSpecialistMarkerColumn(rows){

    if(
        !rows ||
        !rows.length
    ){
        return null;
    }


    const columns = [];

    const seen = new Set();


    for(const row of rows){

        if(
            !row ||
            typeof row !== "object" ||
            Array.isArray(row)
        ){
            continue;
        }


        for(const key of Object.keys(row)){

            if(!seen.has(key)){

                seen.add(key);

                columns.push(key);

            }

        }

    }


    return (
        columns.find(
            column =>
                rows.some(
                    row =>
                        valueString(
                            row[column]
                        ).trim() ===
                        "Specialist"
                )
        ) || null
    );

}

}

/* =========================================================
   FILE URL
========================================================= */

function jsonURL(file){

    return "./" +
        encodeURIComponent(file);

}


/* =========================================================
   LOAD JSON
========================================================= */

async function loadFile(file){

    if(
        dataCache.has(file)
    ){
        return dataCache.get(file);
    }

    const response =
        await fetch(
            jsonURL(file),
            {
                cache:"force-cache"
            }
        );

    if(!response.ok){

        throw new Error(
            file +
            " — HTTP " +
            response.status
        );

    }

    const data =
        await response.json();

    let rows = data;

    if(!Array.isArray(rows)){

        if(Array.isArray(data.data)){
            rows = data.data;
        }
        else if(Array.isArray(data.rows)){
            rows = data.rows;
        }
        else if(Array.isArray(data.records)){
            rows = data.records;
        }
        else if(Array.isArray(data.items)){
            rows = data.items;
        }
        else{
            rows = [data];
        }

    }

    dataCache.set(file,rows);

    return rows;
}


/* =========================================================
   LOAD TAB
========================================================= */

async function loadTab(tab){

    const cacheKey =
        "__TAB__" + tab.id;

    if(
        dataCache.has(cacheKey)
    ){
        return dataCache.get(cacheKey);
    }

    const results =
        await Promise.all(
            tab.files.map(
                file => loadFile(file)
            )
        );

    const rows = [];

    for(const result of results){
        rows.push(...result);
    }

    dataCache.set(cacheKey,rows);

    return rows;
}


/* =========================================================
   GET COLUMNS
========================================================= */

function getColumns(tab,rows){

    if(
        columnsCache.has(tab.id)
    ){
        return columnsCache.get(tab.id);
    }

    const columns = [];
    const seen = new Set();

    for(const row of rows){

        if(
            !row ||
            typeof row !== "object"
        ){
            continue;
        }

        if(Array.isArray(row)){
            continue;
        }

        for(const key of Object.keys(row)){

            if(!seen.has(key)){

                seen.add(key);
                columns.push(key);

            }

        }

    }


    if(tab.id === "apg"){

        const thiqa =
            columns.find(
                c =>
                    normalizeColumnName(c) ===
                    "thiqa"
            );

        const basic =
            columns.find(
                c =>
                    normalizeColumnName(c) ===
                    "basic"
            );

        if(thiqa && basic){

            const normal =
                columns.filter(
                    c =>
                        c !== thiqa &&
                        c !== basic
                );

            columns.length = 0;

            columns.push(
                ...normal,
                thiqa,
                basic
            );

        }

    }


    columnsCache.set(
        tab.id,
        columns
    );

    return columns;
}

function closeTabSearch(){

    tabSearchElement.classList.remove("open");
    tabSearchToggle.setAttribute("aria-expanded", "false");
    tabSearchInput.setAttribute("aria-expanded", "false");
    tabSearchInput.value = "";
    tabSearchResults.innerHTML = "";
    tabSearchResults.hidden = true;

}


function renderTabSearchResults(){

    const query =
        tabSearchInput.value.trim().toLowerCase();

    tabSearchResults.innerHTML = "";

    if(!query){
        tabSearchResults.hidden = true;
        return;
    }

    const matches =
        tabsConfig.filter(tab =>
            tab.name.toLowerCase().includes(query)
        );

    if(matches.length === 0){
        const empty = document.createElement("div");
        empty.className = "tab-search-empty";
        empty.textContent = "No tabs found";
        tabSearchResults.appendChild(empty);
        tabSearchResults.hidden = false;
        return;
    }

    const fragment = document.createDocumentFragment();

    matches.forEach(tab => {
        const option = document.createElement("button");
        option.type = "button";
        option.className = "tab-search-result";
        option.setAttribute("role", "option");
        option.textContent = tab.name;
        option.addEventListener("click", () => {
            closeTabSearch();
            openTab(tab.id);
        });
        fragment.appendChild(option);
    });

    tabSearchResults.appendChild(fragment);
    tabSearchResults.hidden = false;

}


tabSearchToggle.addEventListener("click", () => {

    if(tabSearchElement.classList.contains("open")){
        closeTabSearch();
        return;
    }

    tabSearchElement.classList.add("open");
    tabSearchToggle.setAttribute("aria-expanded", "true");
    tabSearchInput.setAttribute("aria-expanded", "true");
    tabSearchInput.focus();

});

tabSearchInput.addEventListener("input", renderTabSearchResults);

document.addEventListener("mousedown", event => {
    if(
        tabSearchElement.classList.contains("open") &&
        !tabSearchElement.contains(event.target)
    ){
        closeTabSearch();
    }
});

tabSearchInput.addEventListener("keydown", event => {
    if(event.key === "Escape"){

        tabSearchToggle.focus();
    }
});

/* =========================================================
   FILTER MATCH
========================================================= */

function matchesFilters(row){

    const state =
        filters.get(currentTab.id);

    if(
        !state ||
        state.size === 0
    ){
        return true;
    }

    for(
        const [column,selected]
        of state
    ){

        let value = "";

        if(Array.isArray(row)){

            const columns =
                getColumns(
                    currentTab,
                    currentTab.rows || []
                );

            const index =
                columns.indexOf(column);

            value =
                valueString(
                    index >= 0
                        ? row[index]
                        : ""
                );

        }
        else{

            value =
                valueString(
                    row[column]
                );

        }


        if(!selected.has(value)){
            return false;
        }

    }

    return true;
}


/* =========================================================
   GET VISIBLE ROWS
========================================================= */

function getVisibleRows(rows){

    const state =
        filters.get(currentTab.id);

    if(
        !state ||
        state.size === 0
    ){
        return rows;
    }

    const result = [];

    for(
        let i=0;
        i<rows.length;
        i++
    ){

        if(matchesFilters(rows[i])){
            result.push(rows[i]);
        }

    }

    return result;
}


/* =========================================================
   PPI SPECIALTY FILTER VALUES
========================================================= */

function getPpiSpecialtyValues(rows){

    const column =
        findPpiSpecialtyColumn(rows);

    if(column === null){
        return [];
    }


    const values =
        new Set();


    for(let i=1; i<rows.length; i++){

        const row =
            rows[i];

        const value =
            getPpiSpecialtyValue(
                row,
                column
            );


        if(
            !value ||
            value === "Eligible Clinician Specialty" ||
            value === "Specialist"
        ){
            continue;
        }


        values.add(value);

    }


    return Array.from(values).sort(
        (a,b) =>
            a.localeCompare(
                b,
                undefined,
                {
                    numeric:true,
                    sensitivity:"base"
                }
            )
    );

}

/* =========================================================
   INTELLIGENT COLUMN WIDTHS
========================================================= */

function isNoWrapCodeColumn(tab,column){

    const lower =
        normalizeColumnName(column);

    return (
        tab.id === "apg" &&
        lower.includes("haad") &&
        lower.includes("code")
    ) || (
        tab.id === "haad" &&
        lower.includes("drug") &&
        lower.includes("code")
    ) || (
        tab.id === "fmc" &&
        lower.includes("drug") &&
        lower.includes("code")
    );

}


function calculateNoWrapColumnWidth(
    column,
    rows,
    columnIndex
){

    const canvas =
        document.createElement("canvas");

    const context =
        canvas.getContext("2d");

    if(context){
        context.font =
            '11px Inter, "Segoe UI", Roboto, Arial, sans-serif';
    }

    let maxContentWidth = 0;

    for(const row of rows){

        const value =
            valueString(
                Array.isArray(row)
                    ? row[columnIndex]
                    : row[column]
            ).replace(/\s+/g," ").trim();

        const measuredWidth =
            context
                ? context.measureText(value).width
                : value.length * 7;

        maxContentWidth =
            Math.max(
                maxContentWidth,
                measuredWidth
            );

    }

    const headerWidth =
        context
            ? context.measureText(String(column)).width + 36
            : String(column).length * 7 + 36;

    return Math.ceil(
        Math.max(
            110,
            maxContentWidth + 18,
            headerWidth
        )
    );

}

function calculateWidths(
    tab,
    rows,
    columns
){

    if(
        widthCache.has(tab.id)
    ){
        return widthCache.get(tab.id);
    }

    const widths = [];


    for(const column of columns){

        const lower =
            normalizeColumnName(column);


        if(
            isNoWrapCodeColumn(tab,column)
        ){

            const columnIndex = columns.indexOf(column);
            widths.push(
                calculateNoWrapColumnWidth(
                    column,
                    rows,
                    columnIndex
                )
            );

            continue;

        }


        if(
            tab.id === "apg" &&
            isGenericNameColumn(column)
        ){

            widths.push(230);

            continue;

        }


        if(
            tab.id === "apg" &&
            lower.includes("proactive") &&
            lower.includes("name")
        ){

            widths.push(230);

            continue;

        }


        if(
            tab.id === "apg" &&
            (
                lower === "thiqa" ||
                lower === "basic"
            )
        ){

            widths.push(82);

            continue;
        }


        if(
            tab.id === "haad" &&
            isGenericNameColumn(column)
        ){

            widths.push(230);

            continue;

        }


        if(
            tab.id === "haad" &&
            lower.includes("package") &&
            lower.includes("name")
        ){

            widths.push(230);

            continue;
        }


        if(
            tab.id === "adnic" &&
            isGenericNameColumn(column)
        ){

            widths.push(125);

            continue;
        }


        if(
            tab.id === "denial" &&
            isDenialDescriptionColumn(column)
        ){

            widths.push(165);

            continue;
        }


        const isCode =
            lower.includes("code") ||
            lower.includes("status") ||
            lower === "id" ||
            lower.endsWith("id");


        const isDate =
            lower.includes("date");


        const isNumeric =
            lower.includes("price") ||
            lower.includes("amount") ||
            lower.includes("copay") ||
            lower.includes("quantity") ||
            lower.includes("qty");


        const isText =
            lower.includes("name") ||
            lower.includes("description") ||
            lower.includes("remarks") ||
            lower.includes("notes") ||
            lower.includes("comment") ||
            lower.includes("instruction") ||
            lower.includes("detail") ||
            lower.includes("reason") ||
            lower.includes("specialty") ||
            lower.includes("indication");


        let width = 140;


        if(isCode){
            width = 105;
        }
        else if(isDate){
            width = 110;
        }
        else if(isNumeric){
            width = 105;
        }
        else if(isText){
            width = 145;
        }


        width =
            Math.max(
                90,
                Math.min(
                    width,
                    150
                )
            );


        widths.push(width);

    }


    widthCache.set(
        tab.id,
        widths
    );

    return widths;
}


/* =========================================================
   YES / NO
========================================================= */

function yesNoClass(

    column,
    value
){

    if(tab.id !== "apg"){

}

/* =========================================================
   NORMAL VIRTUAL TABLE
========================================================= */

function renderVirtualTable(
    tab,
    rows,
    columns,
    widths,
    version,
    container = tableArea
){

    container.innerHTML = "";


    if(container._virtualScrollHandler){

        container.removeEventListener(
            "scroll",
            container._virtualScrollHandler
        );

        container._virtualScrollHandler =
            null;

    }


    const table =
        document.createElement("table");

    table.className =
        getTableClass(tab);


    const colgroup =
        document.createElement("colgroup");


    columns.forEach(
        (column,index) => {

            const col =
                document.createElement("col");


            if(
                (
                    tab.id === "haad" ||
                    tab.id === "adnic"
                ) &&
                isGenericNameColumn(column)
            ){

                col.className =
                    "generic-name-column";

            }

            if(isNoWrapCodeColumn(tab,column)){
                col.classList.add("nowrap-code-column");
            }


            if(
                tab.id === "denial" &&
                isDenialDescriptionColumn(column)
            ){

                col.classList.add(
                    "denial-description-column"
                );

            }


            col.style.width =
                widths[index] + "px";

            col.style.minWidth =
                widths[index] + "px";

            col.style.maxWidth =
                widths[index] + "px";


            colgroup.appendChild(col);

        }
    );


    table.appendChild(colgroup);


    createHeader(
        table,
        tab,
        columns,
        widths
    );


    const tbody =
        document.createElement("tbody");

    table.appendChild(tbody);

    container.appendChild(table);


    const DEFAULT_HEIGHT = 34;

    const BUFFER = 12;

    const heights =
        new Array(rows.length)
            .fill(DEFAULT_HEIGHT);

    let prefix =
        new Array(rows.length + 1)
            .fill(0);


    function estimateHeight(row){

        let maxLines = 1;


        for(
            let c=0;
            c<columns.length;
            c++
        ){

            const value =
                valueString(
                    Array.isArray(row)
                        ? row[c]
                        : row[columns[c]]
                );


            if(!value){
                continue;
            }


            const availableWidth =
                Math.max(
                    25,
                    widths[c] - 12
                );


            const charsPerLine =
                Math.max(
                    6,
                    Math.floor(
                        availableWidth / 6
                    )
                );


            const lines =
                value
                    .split(/\r?\n/)
                    .reduce(
                        (
                            total,
                            part
                        ) =>
                            total +
                            Math.max(
                                1,
                                Math.ceil(
                                    part.length /
                                    charsPerLine
                                )
                            ),
                        0
                    );


            maxLines =
                Math.max(
                    maxLines,
                    lines
                );

        }


        return Math.max(
            DEFAULT_HEIGHT,
            10 + maxLines * 15
        );

    }


    for(
        let i=0;
        i<rows.length;
        i++
    ){

        heights[i] =
            estimateHeight(
                rows[i]
            );

    }


    function rebuildPrefix(){

        prefix[0] = 0;

        for(
            let i=0;
            i<rows.length;
            i++
        ){

            prefix[i+1] =
                prefix[i] +
                heights[i];

        }

    }


    rebuildPrefix();


    function findIndex(position){

        let low = 0;

        let high = rows.length;


        while(low < high){

            const mid =
                (low + high) >> 1;


            if(
                prefix[mid] <
                position
            ){

                low =
                    mid + 1;

            }
            else{

                high =
                    mid;

            }

        }


        return Math.max(
            0,
            Math.min(
                rows.length,
                low
            )
        );

    }


    let raf = 0;


    function measureRows(){

        if(
            version !== renderVersion
        ){
            return;
        }


        const rendered =
            tbody.querySelectorAll(
                "tr[data-row-index]"
            );


        let changed = false;


        rendered.forEach(tr => {

            const index =
                Number(
                    tr.dataset.rowIndex
                );


            if(
                !Number.isFinite(index) ||
                index < 0 ||
                index >= rows.length
            ){
                return;
            }


            const actual =
                Math.ceil(
                    tr.getBoundingClientRect()
                        .height
                );


            if(
                actual >= DEFAULT_HEIGHT &&
                Math.abs(
                    actual - heights[index]
                ) > 1
            ){

                heights[index] =
                    actual;

                changed = true;

            }

        });


        if(changed){

            rebuildPrefix();

            scheduleDraw();

        }

    }


    function draw(){

        raf = 0;


        if(
            version !== renderVersion
        ){
            return;
        }


        const scrollTop =
            container.scrollTop;

        const viewportHeight =
            container.clientHeight;


        const bodyTop =
            Math.max(
                0,
                scrollTop - 46
            );


        const bodyBottom =
            Math.max(
                0,
                scrollTop +
                viewportHeight -
                46
            );


        let start =
            findIndex(bodyTop);


        let end =
            findIndex(bodyBottom) + 1;


        start =
            Math.max(
                0,
                start - BUFFER
            );


        end =
            Math.min(
                rows.length,
                end + BUFFER
            );


        tbody.innerHTML = "";


        if(start > 0){

            const spacer =
                document.createElement("tr");

            spacer.className =
                "virtual-spacer";


            const cell =
                document.createElement("td");

            cell.colSpan =
                columns.length;

            cell.style.height =
                prefix[start] + "px";


            spacer.appendChild(cell);

            tbody.appendChild(spacer);

        }


        for(
            let i=start;
            i<end;
            i++
        ){

            const row =
                rows[i];


            const tr =
                document.createElement("tr");


            tr.dataset.rowIndex =
                String(i);


            for(
                let c=0;
                c<columns.length;
                c++
            ){

                const column =
                    columns[c];


                const td =
                    document.createElement("td");

                if(isNoWrapCodeColumn(tab,column)){
                    td.classList.add("nowrap-code-column");
                }


                const value =
                    valueString(
                        Array.isArray(row)
                            ? row[c]
                            : row[column]
                    );


                td.textContent =
                    value;


                if(value.length > 60){

                    td.title =
                        value;

                }


                if(
                    tab.id === "apg" &&
                    c === columns.length-2
                ){

                    td.classList.add(
                        "freeze-right-2"
                    );

                }


                if(
                    tab.id === "apg" &&
                    c === columns.length-1
                ){

                    td.classList.add(
                        "freeze-right-1"
                    );

                }


                const colorClass =
                    yesNoClass(
                        tab,
                        column,
                        value
                    );


                if(colorClass){

                    td.classList.add(
                        colorClass
                    );

                }


                tr.appendChild(td);

            }


            tbody.appendChild(tr);

        }


        if(end < rows.length){

            const spacer =
                document.createElement("tr");

            spacer.className =
                "virtual-spacer";


            const cell =
                document.createElement("td");

            cell.colSpan =
                columns.length;


            cell.style.height =
                (
                    prefix[rows.length] -
                    prefix[end]
                ) + "px";


            spacer.appendChild(cell);

            tbody.appendChild(spacer);

        }


        requestAnimationFrame(
            measureRows
        );

    }


    function scheduleDraw(){

        if(raf){
            return;
        }

        raf =
            requestAnimationFrame(
                draw
            );

    }


    container._virtualScrollHandler =
        scheduleDraw;


    container.addEventListener(
        "scroll",
        scheduleDraw,
        {
            passive:true
        }
    );


    draw();

}


/* =========================================================
   PPI WIDTHS
========================================================= */

function calculatePpiWidths(columns){

    return columns.map(
        column => {

            if(
                isPpiDiagnosisColumn(column)
            ){

                return 250;

            }


            if(
                isPpiIcd10Column(column)
            ){

                return 75;

            }


            if(
                isPpiDoseColumn(column)
            ){

                return 120;

            }


            if(
                isPpiDurationColumn(column)
            ){

                return 65;

            }


            if(
                isPpiClinicianEligibilityColumn(column)
            ){

                return 90;

            }


            if(
                isPpiNotesColumn(column)
            ){

                return 160;

            }


            const lower =
                normalizeColumnName(column);


            const isCode =
                lower.includes("code") ||
                lower === "id" ||
                lower.endsWith("id");


            const isDate =
                lower.includes("date");


            const isNumeric =
                lower.includes("price") ||
                lower.includes("amount") ||
                lower.includes("copay") ||
                lower.includes("quantity") ||
                lower.includes("qty");


            const isText =
                lower.includes("name") ||
                lower.includes("description") ||
                lower.includes("remarks") ||
                lower.includes("notes") ||
                lower.includes("comment") ||
                lower.includes("instruction") ||
                lower.includes("detail") ||
                lower.includes("reason") ||
                lower.includes("specialty") ||
                lower.includes("indication");


            let width = 140;


            if(isCode){
                width = 105;
            }
            else if(isDate){
                width = 110;
            }
            else if(isNumeric){
                width = 105;
            }
            else if(isText){
                width = 145;
            }


            return Math.max(
                90,
                Math.min(
                    width,
                    150
                )
            );

        }
    );

}

function renderPpiMainTable(
    rows,
    allColumns
){

    const specialtyColumn =
        findPpiSpecialtyColumn(rows);


    let mainColumns =
        allColumns.filter(
            column =>
                column !== specialtyColumn
        );


    const desiredOrder = [

        "diagnosis",
        "icd10",
        "ppidose",
        "duration",
        "clinicianeligibility",
        "notes"

    ];


    const orderedColumns = [];


    for(const wanted of desiredOrder){

        const found =
            mainColumns.find(
                column =>
                    normalizeColumnName(column) ===
                    wanted
            );


        if(
            found &&
            !orderedColumns.includes(found)
        ){

            orderedColumns.push(found);

        }

    }


    for(const column of mainColumns){

        if(
            orderedColumns.length >= 6
        ){
            break;
        }


        if(
            !orderedColumns.includes(column)
        ){

            orderedColumns.push(column);

        }

    }


    mainColumns =
        orderedColumns.slice(0,6);

                isPpiDurationColumn(column)

            colgroup.appendChild(col);

        }
    );


    table.appendChild(colgroup);

    mainColumns.forEach(

            filter.type =
                "button";

            filter.textContent =
                "▼";

            filter.title =

            const state =

            if(

/* =========================================================
   REFILL DATE PARSING
========================================================= */

/*
   Accepts:
   dd/mm/yyyy
   d/m/yyyy
   d-m-yyyy
   d/m/yy
   d-m-yy
   and similar manual formats.

   The displayed result is always:
   dd/mm/yyyy
*/

function parseManualDate(value){

    if(
        value === null ||
        value === undefined
    ){
        return null;
    }


    const text =
        String(value)
            .trim();


    if(!text){
        return null;
    }


    const match =
        text.match(
            /^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2}|\d{4})$/
        );


    if(!match){
        return null;
    }


    let day =
        Number(match[1]);

    let month =
        Number(match[2]);

    let year =
        Number(match[3]);


    if(year < 100){

        year +=
            year >= 50
                ? 1900
                : 2000;

    }


    const date =
        new Date(
            year,
            month - 1,
            day
        );


    if(
        date.getFullYear() !== year ||
        date.getMonth() !== month - 1 ||
        date.getDate() !== day
    ){

        return null;

    }


    return date;

}


/*
   Format a Date object as dd/mm/yyyy.
*/

function formatDateDDMMYYYY(date){

    if(
        !(date instanceof Date) ||
        Number.isNaN(
            date.getTime()
        )
    ){
        return "";
    }


    const day =
        String(
            date.getDate()
        ).padStart(2,"0");


    const month =
        String(
            date.getMonth() + 1
        ).padStart(2,"0");


    const year =
        String(
            date.getFullYear()
        );


    return (
        day +
        "/" +
        month +
        "/" +
        year
    );

}


/*
   Convert manual date into the equivalent
   spreadsheet-style date calculation.
*/

function calculateRefillFromDate(
    dispenseDate,
    duration
){

    const result =
        new Date(
            dispenseDate.getFullYear(),
            dispenseDate.getMonth(),
            dispenseDate.getDate() +
            duration -
            11
        );


    return result;

}


/*
   E9:
   =DATE(YEAR(D9),MONTH(D9),DAY(D9)+40)
*/

function calculateRefillToDate(
    fromDate
){

    const result =
        new Date(
            fromDate.getFullYear(),
            fromDate.getMonth(),
            fromDate.getDate() + 40
        );


    return result;

}

    */

    function calculateRefill(){

        const dispenseDate =
            parseManualDate(
                dateInput.value

        const durationText =
            durationInput.value.trim();


        fromResult.textContent =
            "";

        toResult.textContent =

            durationText === ""
        ){

            return;

        }


        const duration =
            Number(
                durationText
            );


        if(
            !Number.isFinite(duration)
        ){

            return;

        }


        /*
           DATE(YEAR(B9),MONTH(B9),DAY(B9)+C9)-11
        */

        const fromDate =
            calculateRefillFromDate(
                dispenseDate,
                duration
            );


        /*
           DATE(YEAR(D9),MONTH(D9),DAY(D9)+40)
        */

        const toDate =
            calculateRefillToDate(
                fromDate
            );


        fromResult.textContent =
            formatDateDDMMYYYY(

            formatDateDDMMYYYY(

function getSearchSourceValue(
    row,
    columns,
    candidates
){

    const sourceColumn =
        columns.find(column =>
            candidates.includes(
                normalizeColumnName(column)
            )
        );

    if(!sourceColumn){
        return "";
    }

    const value =
        Array.isArray(row)
            ? row[columns.indexOf(sourceColumn)]
            : row[sourceColumn];

    return valueString(value);

}

   RENDER TABLE
========================================================= */

function renderTable(
    tab,
    version
){

    if(
        version !== renderVersion
    ){
        return;
    }


    /*
       SPECIAL REFILL CALCULATOR
    */

    if(tab.id === "refill"){

        renderRefillTable();

        return;
    }


    const rows =
        tab.rows || [];


    /*
       SPECIAL ELIGIBILITY
    */

    if(tab.id === "eligibility"){

        renderEligibilityTable(
            tab,
            rows,
            version
        );

        return;
    }


    /*
       SPECIAL PPI
    */

    if(tab.id === "ppi"){

        renderPpiTable(
            tab,
            rows,
            version
        );

        return;
    }


    tableArea.style.overflow =
        "auto";


    if(rows.length === 0){

        tableArea.innerHTML = `
            <div class="empty">
                No data found.
            </div>
        `;

        recordNumber.textContent = "0";

        return;
    }


    const columns =
        getColumns(
            tab,
            rows
        );


    const visible =
        getVisibleRows(rows);


    recordNumber.textContent =
        visible.length.toLocaleString();


    const widths =
        calculateWidths(
            tab,
            rows,
            columns
        );


    renderVirtualTable(
        tab,
        visible,
        columns,
        widths,
        version
    );

}


/* =========================================================
   OPEN TAB
========================================================= */

async function openTab(id){

    const tab =
        tabsConfig.find(
            item =>
                item.id === id
        );


    if(!tab){
        return;
    }


    currentTab =
        tab;


    setActiveTab(id);


    currentList.textContent =
        tab.name;


    if(!filters.has(id)){

        filters.set(
            id,
            new Map()
        );

    }


    const version =
        ++renderVersion;


    if(id === "search"){

        const apgTab =
            tabsConfig.find(item => item.id === "apg");

        showLoading("APG Formulary lookup");
        recordNumber.textContent = "Loading";

        try{

            const apgRows = dataCache.has("__TAB__apg")
                ? dataCache.get("__TAB__apg")
                : await loadTab(apgTab);

            if(version !== renderVersion){
                return;
            }

            apgTab.rows = apgRows;
            renderSearchTab(apgRows,version);
            return;

        }
        catch(error){

            if(version !== renderVersion){
                return;
            }

            tableArea.innerHTML = `
                <div class="error">
                    <strong>Could not load APG Formulary data</strong>
                    <br><br>
                    ${error.message}
                </div>
            `;
            recordNumber.textContent = "Error";
            return;

        }

    }


    /*
       REFILL IS A CUSTOM CALCULATOR.

       We do not need to load the JSON in order
       to display the calculator.
    */

    if(id === "refill"){

        renderTable(
            tab,
            version
        );

        scheduleBackgroundPreload();

        return;

    }


    if(
        dataCache.has(
            "__TAB__" + id
        )
    ){

        tab.rows =
            dataCache.get(
                "__TAB__" + id
            );


        renderTable(
            tab,
            version
        );


        return;
    }


    showLoading(
        tab.name
    );


    recordNumber.textContent =
        "Loading";


    try{

        const rows =
            await loadTab(tab);


        if(
            version !== renderVersion
        ){
            return;
        }


        tab.rows =
            rows;


        renderTable(
            tab,
            version
        );


        scheduleBackgroundPreload();

    }
    catch(error){

        if(
            version !== renderVersion
        ){
            return;
        }


        console.error(error);


        tableArea.style.overflow =
            "auto";


        tableArea.innerHTML = `

            <div class="error">

                <strong>
                    Could not load ${tab.name}
                </strong>

                <br><br>

                ${error.message}

                <br><br>

                Check the JSON filename in GitHub.

            </div>

        `;


        recordNumber.textContent =
            "Error";

    }

}


/* =========================================================
   BACKGROUND PRELOAD
========================================================= */

let preloadStarted = false;


async function scheduleBackgroundPreload(){

    if(preloadStarted){
        return;
    }


    preloadStarted = true;


    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                1200
            )
    );


    const pending =
        tabsConfig.filter(
            tab =>
                tab.id !== "search" &&
                !dataCache.has(
                    "__TAB__" + tab.id
                )
        );


    const BATCH_SIZE = 2;


    for(
        let i=0;
        i<pending.length;
        i+=BATCH_SIZE
    ){

        const batch =
            pending.slice(
                i,
                i+BATCH_SIZE
            );


        await Promise.all(
            batch.map(
                async tab => {

                    try{

                        const rows =
                            await loadTab(tab);

                        tab.rows =
                            rows;

                    }
                    catch(error){

                        console.warn(
                            "Background preload failed:",
                            tab.name,
                            error
                        );

                    }

                }
            )
        );


        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    20
                )
        );

    }

}


/* =========================================================
   OPEN NORMAL FILTER
========================================================= */

function openFilter(
    column,
    button
){

    if(!currentTab){
        return;
    }


    filterMode =
        "normal";


    filterColumn =
        column;


    const values =
        new Set();


    if(
        currentTab.id === "eligibility" &&
        column === "Eligibility Portal"
    ){

        const rows =
            currentTab.rows || [];


        for(
            let i=2;
            i<rows.length;
            i+=2
        ){

            const portal =
                valueString(
                    rows[i][
                        "Unnamed: 0"
                    ]
                );


            if(portal){

                values.add(
                    portal
                );

            }

        }

    }
    else{

        const columns =
            getColumns(
                currentTab,
                currentTab.rows || []
            );


        const columnIndex =
            columns.indexOf(column);


        for(
            const row of currentTab.rows
        ){

            values.add(
                Array.isArray(row)
                    ? valueString(
                        columnIndex >= 0
                            ? row[columnIndex]
                            : ""
                    )
                    : valueString(
                        row[column]
                    )
            );

        }

    }


    filterAllValues =
        Array.from(values);


    filterAllValues.sort(
        (a,b)=>
            a.localeCompare(
                b,
                undefined,
                {
                    numeric:true,
                    sensitivity:"base"
                }
            )
    );


    const state =
        filters.get(
            currentTab.id
        );


    const existing =
        state &&
        state.get(column);


    if(existing){

        temporarySelection =
            new Set(existing);

    }
    else{

        temporarySelection =
            new Set(
                filterAllValues
            );

    }


    filterTitle.textContent =
        "Filter: " + column;


    filterSearch.value =
        "";


    renderFilterValues();


    filterPopup.style.display =
        "block";


    positionFilterPopup(button);

}

/* =========================================================
   POSITION FILTER POPUP
========================================================= */

function positionFilterPopup(button){

    const rect =
        button.getBoundingClientRect();


    const width =
        filterPopup.offsetWidth;


    const height =
        filterPopup.offsetHeight;


    let left =
        rect.left;


    let top =
        rect.bottom + 5;


    if(
        left + width >
        window.innerWidth - 10
    ){

        left =
            window.innerWidth -
            width -
            10;

    }


    if(
        top + height >
        window.innerHeight - 10
    ){

        top =
            rect.top -
            height -
            5;

    }


    left =
        Math.max(
            10,
            left
        );


    top =
        Math.max(
            10,
            top
        );


    filterPopup.style.left =
        left + "px";


    filterPopup.style.top =
        top + "px";


    filterSearch.focus();

}

            : temporarySelection;


    for(
        const value of filterAllValues
    ){

        const display =
            value === ""
                ? "(Blank)"
                : value;


        if(
            search &&
            !display
                .toLowerCase()
                .includes(search)
        ){

            continue;

        }


        const label =
            document.createElement("label");

        label.className =
            "filter-value";


        const checkbox =
            document.createElement("input");

        checkbox.type =
            "checkbox";


        checkbox.checked =
            selection.has(
                value
            );


        checkbox.addEventListener(
            "change",
            () => {

                if(checkbox.checked){

                    selection.add(
                        value
                    );

                }
                else{

                    selection.delete(
                        value
                    );

                }

            }
        );


        const text =
            document.createElement("span");

        text.className =
            "filter-value-text";

        text.textContent =
            display;

        text.title =
            display;


        label.appendChild(
            checkbox
        );

        label.appendChild(
            text
        );


        fragment.appendChild(
            label
        );

    }


    filterValues.appendChild(
        fragment
    );

}


/* =========================================================
   FILTER SEARCH
========================================================= */

filterSearch.addEventListener(
    "input",
    renderFilterValues
);


/* =========================================================
   SELECT ALL
========================================================= */

document
    .getElementById("selectAll")
    .addEventListener(
        "click",
        () => {

            if(
                filterMode === "ppi-specialty"
            ){

                ppiSpecialtyTemporarySelection =
                    new Set(
                        filterAllValues
                    );

            }
            else{

                temporarySelection =
                    new Set(
                        filterAllValues
                    );

            }


            renderFilterValues();

        }
    );


/* =========================================================
   UNCHECK ALL
========================================================= */

document
    .getElementById("uncheckAll")
    .addEventListener(
        "click",
        () => {

            if(
                filterMode === "ppi-specialty"
            ){

                ppiSpecialtyTemporarySelection =
                    new Set();

            }
            else{

                temporarySelection =
                    new Set();

            }


            renderFilterValues();

        }
    );


/* =========================================================
   APPLY FILTER
========================================================= */

document
    .getElementById("applyFilter")
    .addEventListener(
        "click",
        () => {

            if(
                filterMode === "ppi-specialty"
            ){

                if(
                    ppiSpecialtyTemporarySelection.size ===
                    filterAllValues.length
                ){

                    ppiSpecialtyFilters.clear();

                }
                else{

                    ppiSpecialtyFilters.clear();

                    for(
                        const value of
                        ppiSpecialtyTemporarySelection
                    ){

                        ppiSpecialtyFilters.add(
                            value
                        );

                    }

                }


                closeFilter();


                if(
                    currentTab &&
                    currentTab.id === "ppi"
                ){

                    renderTable(
                        currentTab,
                        ++renderVersion
                    );

                }

                return;

            }


            if(
                !currentTab ||
                filterColumn === null
            ){
                return;
            }


            const state =
                filters.get(
                    currentTab.id
                );


            if(
                temporarySelection.size ===
                filterAllValues.length
            ){

                state.delete(
                    filterColumn
                );

            }
            else{

                state.set(
                    filterColumn,
                    new Set(
                        temporarySelection
                    )
                );

            }


            closeFilter();


            renderTable(
                currentTab,
                ++renderVersion
            );

        }
    );


/* =========================================================
   CANCEL
========================================================= */

document
    .getElementById("cancelFilter")
    .addEventListener(
        "click",
        closeFilter
    );


/* =========================================================
   CLOSE FILTER
========================================================= */

function closeFilter(){

    filterPopup.style.display =
        "none";

    filterColumn =
        null;

    filterMode =
        "normal";

    ppiSpecialtyFilterOpen =
        false;

}


/* =========================================================
   CLEAR FILTERS
========================================================= */

document
    .getElementById("clearButton")
    .addEventListener(
        "click",
        () => {

            if(!currentTab){
                return;
            }


            filters.set(
                currentTab.id,
                new Map()
            );


            if(
                currentTab.id === "ppi"
            ){

                ppiSpecialtyFilters.clear();

            }


            /*
               For Refill, Clear Filters simply
               rebuilds the calculator fields.
            */

            closeFilter();


            renderTable(
                currentTab,
                ++renderVersion
            );

        }
    );


/* =========================================================
   OUTSIDE CLICK
========================================================= */

document.addEventListener(
    "mousedown",
    event => {

        if(
            filterPopup.style.display === "block" &&

            !filterPopup.contains(
                event.target
            ) &&

            !event.target.closest(
                ".filter-button"
            ) &&

            !event.target.closest(
                ".ppi-specialty-filter"
            )
        ){

            closeFilter();

        }

    }
);


/* =========================================================
   ESCAPE
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(event.key === "Escape"){

            closeFilter();

        }

    }
);


/* =========================================================
   START
========================================================= */

createTabs();

openTab("apg");

</script>
