<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Insurance All List</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
}

body{
    font-family:
        Inter,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background:#f3f6f8;
    color:#17232d;

    overflow:hidden;
}

button,
input{
    font-family:inherit;
}


/* =========================================================
   APP
========================================================= */

.app{
    width:100%;
    height:100vh;

    display:flex;
    flex-direction:column;

    overflow:hidden;
}


/* =========================================================
   TOP BRAND
========================================================= */

.brand-bar{
    flex:0 0 50px;

    display:flex;
    align-items:center;

    padding:0 18px;

    background:#ffffff;

    border-bottom:1px solid #e5eaee;
}

.logo{
    width:31px;
    height:31px;

    border-radius:8px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            145deg,
            #0f6878,
            #238da0
        );

    color:#ffffff;

    font-size:18px;
    font-weight:800;

    box-shadow:
        0 4px 10px rgba(15,104,120,.20);
}

.logo::before{
    content:"+";
    line-height:1;
}

.brand-name{
    margin-left:10px;

    font-size:16px;
    font-weight:750;

    letter-spacing:-.3px;

    color:#20313b;
}


/* =========================================================
   TABS
========================================================= */

.tabs-section{
    flex:0 0 auto;

    padding:8px 12px 9px;

    background:#f3f6f8;

    border-bottom:1px solid #dfe5e9;
}

.tabs-grid{
    width:100%;

    display:grid;

    grid-template-columns:
        repeat(15,minmax(0,1fr));

    gap:4px;
}

.tab{
    width:100%;
    min-width:0;

    height:30px;

    padding:0 6px;

    border:1px solid #d8e0e5;

    border-radius:6px;

    background:#ffffff;

    color:#53636e;

    font-size:10.5px;
    font-weight:650;

    letter-spacing:-.05px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;

    cursor:pointer;

    transition:
        background .12s ease,
        color .12s ease,
        border-color .12s ease,
        box-shadow .12s ease,
        transform .08s ease;
}

.tab:hover{
    background:#edf7f9;
    border-color:#9fc3cb;
    color:#12697a;
}

.tab:active{
    transform:scale(.985);
}

.tab.active{
    background:
        linear-gradient(
            135deg,
            #125f70,
            #19869a
        );

    color:#ffffff;

    border-color:#125f70;

    box-shadow:
        0 3px 8px rgba(18,95,112,.22);
}


/* =========================================================
   TABLE BAR
========================================================= */

.table-bar{
    flex:0 0 43px;

    display:flex;
    align-items:center;

    padding:0 14px;

    background:#ffffff;

    border-bottom:1px solid #dfe5e9;
}

.list-name{
    display:flex;
    align-items:center;

    color:#263943;

    font-size:11.5px;
    font-weight:750;
}

.list-dot{
    width:6px;
    height:6px;

    margin-right:7px;

    border-radius:50%;

    background:#1b9a85;
}

.record-pill{
    margin-left:9px;

    padding:3px 9px;

    border-radius:20px;

    background:#eef5f6;

    color:#337483;

    font-size:9.5px;
    font-weight:700;
}

.bar-space{
    flex:1;
}

.clear-button{
    height:28px;

    padding:0 11px;

    border:1px solid #d8e0e4;

    border-radius:6px;

    background:#ffffff;

    color:#667680;

    font-size:9.5px;
    font-weight:700;

    cursor:pointer;
}

.clear-button:hover{
    background:#edf7f8;
    color:#12697a;
    border-color:#9fc3cb;
}


/* =========================================================
   TABLE VIEW
========================================================= */

.table-view{
    position:relative;

    flex:1 1 auto;

    min-height:0;

    overflow:auto;

    background:#ffffff;
}


/* =========================================================
   NORMAL TABLE
========================================================= */

.data-table{
    border-collapse:separate;
    border-spacing:0;

    width:max-content;
    min-width:100%;

    table-layout:fixed;

    font-size:11px;
}

.data-table thead{
    position:sticky;
    top:0;
    z-index:100;
}

.data-table th{
    height:46px;

    padding:0;

    background:#eaf1f3;

    color:#263a44;

    border-right:1px solid #d5dfe3;
    border-bottom:2px solid #c3d1d6;

    font-size:11.5px;
    font-weight:800;

    text-align:center;
    vertical-align:middle;
}

.data-table th:first-child{
    border-left:1px solid #d5dfe3;
}

.header-content{
    width:100%;
    min-height:46px;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:4px;

    padding:4px 4px;
}

.header-label{
    min-width:0;

    line-height:14px;

    text-align:center;

    overflow-wrap:anywhere;
    word-break:break-word;

    white-space:normal;
}

.filter-button{
    flex:0 0 19px;

    width:19px;
    height:19px;

    padding:0;

    border:1px solid #c6d1d6;

    border-radius:4px;

    background:#ffffff;

    color:#65757e;

    font-size:8px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;
}

.filter-button:hover{
    background:#dff0f3;
    color:#12697a;
    border-color:#75aeb9;
}

.filter-button.active{
    background:#12697a;
    color:#ffffff;
    border-color:#12697a;
}


/* =========================================================
   BODY CELLS
========================================================= */

.data-table td{

    height:auto;

    min-height:34px;

    padding:6px 6px;

    background:#ffffff;

    color:#34434c;

    border-right:1px solid #e8edef;
    border-bottom:1px solid #e7ecef;

    text-align:center;
    vertical-align:middle;

    line-height:15px;

    white-space:normal;

    overflow:visible;

    overflow-wrap:anywhere;

    word-break:break-word;

    hyphens:auto;
}

.data-table tbody tr:nth-child(even) td{
    background:#fbfcfd;
}

.data-table tbody tr:hover td{
    background:#eef7f8;
}


/* =========================================================
   NORMAL TABLE COLUMNS
========================================================= */

.data-table col{
    width:150px;
    min-width:150px;
    max-width:150px;
}


/* =========================================================
   HAAD
========================================================= */

.data-table.haad-table td,
.data-table.haad-table th{
    font-size:11px;
}

.data-table.haad-table col.generic-name-column{
    width:125px !important;
    min-width:125px !important;
    max-width:125px !important;
}


/* =========================================================
   ADNIC
========================================================= */

.data-table.adnic-table td,
.data-table.adnic-table th{
    font-size:11px;
}

.data-table.adnic-table col.generic-name-column{
    width:125px !important;
    min-width:125px !important;
    max-width:125px !important;
}


/* =========================================================
   DENIAL CODE
========================================================= */

.data-table.denial-table td,
.data-table.denial-table th{
    font-size:11px;
}

.data-table.denial-table col.denial-description-column{
    width:165px !important;
    min-width:165px !important;
    max-width:165px !important;
}


/* =========================================================
   APG YES / NO
========================================================= */

.apg-yes{
    background:#dff3e7 !important;
    color:#17683b !important;
    font-weight:750 !important;
}

.apg-no{
    background:#fde5e5 !important;
    color:#a43d3d !important;
    font-weight:750 !important;
}


/* =========================================================
   APG FROZEN
========================================================= */

.freeze-right-1{
    position:sticky !important;

    right:0;

    z-index:80;

    box-shadow:
        -4px 0 7px rgba(30,50,60,.07);
}

.freeze-right-2{
    position:sticky !important;

    right:82px;

    z-index:80;
}

thead .freeze-right-1,
thead .freeze-right-2{
    z-index:150;
}

.apg-frozen{
    font-weight:800 !important;
}


/* =========================================================
   PPI SPECIAL LAYOUT
========================================================= */

.ppi-layout{

    width:100%;
    min-width:100%;

    height:100%;

    display:grid;

    /*
       A-F main table
       small gap
       H specialty table
    */

    grid-template-columns:
        minmax(0,1fr)
        8px
        270px;

    align-items:stretch;

    column-gap:0;

    padding:0;

    background:#ffffff;

    overflow:hidden;
}


/* =========================================================
   PPI MAIN A-F AREA
========================================================= */

.ppi-main-area{

    min-width:0;

    width:100%;

    height:100%;

    overflow:auto;

    background:#ffffff;

    border-right:0;
}


.ppi-main-area .data-table{

    width:100%;

    min-width:760px;

    table-layout:fixed;
}


/* =========================================================
   PPI GAP
========================================================= */

.ppi-gap{

    width:8px;

    min-width:8px;

    height:100%;

    background:#ffffff;
}


/* =========================================================
   PPI SPECIALTY AREA
========================================================= */

.ppi-specialty-area{

    width:270px;

    min-width:270px;

    max-width:270px;

    height:100%;

    overflow:auto;

    background:#ffffff;

    border-left:0;
}


/* =========================================================
   PPI SPECIALTY TABLE
========================================================= */

.ppi-specialty-table{

    width:100%;

    min-width:270px;

    table-layout:fixed;

    border-collapse:separate;

    border-spacing:0;

    font-size:11px;
}


.ppi-specialty-table thead{

    position:sticky;

    top:0;

    z-index:120;
}


.ppi-specialty-table th{

    height:46px;

    padding:0;

    background:#eaf1f3;

    color:#263a44;

    border-left:1px solid #d5dfe3;

    border-right:1px solid #d5dfe3;

    border-bottom:2px solid #c3d1d6;

    font-size:11.5px;

    font-weight:800;

    text-align:center;

    vertical-align:middle;
}


/*
   Specialist is attached directly to
   Eligible Clinician Specialty.
*/

.ppi-specialty-header{

    width:100%;

    min-height:46px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    padding:3px 5px;
}


.ppi-specialist-title{

    color:#9a5b16;

    font-size:11px;

    font-weight:900;

    line-height:14px;

    text-align:center;

    white-space:nowrap;
}


.ppi-specialty-title-row{

    width:100%;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:5px;

    margin-top:1px;
}


.ppi-specialty-header-label{

    min-width:0;

    line-height:13px;

    text-align:center;

    overflow-wrap:anywhere;

    word-break:break-word;
}


/* =========================================================
   PPI SPECIALTY BODY
========================================================= */

.ppi-specialty-table td{

    min-height:34px;

    height:auto;

    padding:6px 8px;

    background:#ffffff;

    color:#34434c;

    border-left:1px solid #e8edef;

    border-right:1px solid #e8edef;

    border-bottom:1px solid #e7ecef;

    text-align:center;

    vertical-align:middle;

    line-height:15px;

    white-space:normal;

    overflow-wrap:anywhere;

    word-break:break-word;
}

.ppi-specialty-table tbody tr:nth-child(even) td{
    background:#fbfcfd;
}

.ppi-specialty-table tbody tr:hover td{
    background:#eef7f8;
}


/* =========================================================
   PPI SPECIALTY FILTER
========================================================= */

.ppi-specialty-filter{

    flex:0 0 19px;

    width:19px;

    height:19px;

    padding:0;

    border:1px solid #c6d1d6;

    border-radius:4px;

    background:#ffffff;

    color:#65757e;

    font-size:8px;

    display:flex;

    align-items:center;

    justify-content:center;

    cursor:pointer;
}

.ppi-specialty-filter:hover{

    background:#dff0f3;

    color:#12697a;

    border-color:#75aeb9;
}

.ppi-specialty-filter.active{

    background:#12697a;

    color:#ffffff;

    border-color:#12697a;
}


/* =========================================================
   PPI SPECIAL WIDTHS
========================================================= */

/*
   ICD-10 is intentionally reduced.
*/

.ppi-main-area .ppi-icd10-column{
    width:95px !important;
    min-width:95px !important;
    max-width:95px !important;
}


/*
   PPI Dose is intentionally increased.
*/

.ppi-main-area .ppi-dose-column{
    width:220px !important;
    min-width:220px !important;
    max-width:220px !important;
}


/*
   Diagnosis column, when it is actually a
   separate Diagnosis field, keeps a useful width.
*/

.ppi-main-area .ppi-diagnosis-column{
    width:145px !important;
    min-width:145px !important;
    max-width:145px !important;
}


/* =========================================================
   ELIGIBILITY PORTALS
========================================================= */

.eligibility-table{
    width:100% !important;
    min-width:850px;

    table-layout:fixed;

    border-collapse:separate;
    border-spacing:0;

    font-size:12px;
}

.eligibility-table col.col-a{
    width:230px;
}

.eligibility-table col.col-b{
    width:430px;
}

.eligibility-table col.col-c{
    width:160px;
}

.eligibility-table col.col-d,
.eligibility-table col.col-e,
.eligibility-table col.col-f{
    width:190px;
}

.eligibility-table .top-header{
    height:38px;

    background:#f0f5f6;

    color:#243943;

    border-right:1px solid #d3dfe3;
    border-bottom:1px solid #cbd8dc;

    font-size:12px;
    font-weight:800;

    text-align:center;
    vertical-align:middle;
}

.eligibility-table .top-empty{
    background:#ffffff !important;
    border-right:1px solid #ffffff !important;
    border-bottom:1px solid #ffffff !important;
}

.eligibility-table .main-header{
    height:50px;

    background:#dcebed;

    color:#1f3741;

    border-right:1px solid #c3d4d9;
    border-bottom:2px solid #aebfc5;

    font-size:14px;
    font-weight:900;

    text-align:center;
    vertical-align:middle;

    line-height:17px;
}

.eligibility-table .main-header:first-child{
    border-left:1px solid #c3d4d9;
}

.eligibility-table tbody td{
    height:42px;

    padding:7px 9px;

    background:#ffffff;

    color:#34434c;

    border-right:1px solid #e1e8eb;
    border-bottom:1px solid #e1e8eb;

    text-align:center;
    vertical-align:middle;

    font-size:12px;

    line-height:17px;

    white-space:normal;
    overflow-wrap:anywhere;
    word-break:break-word;
}

.eligibility-table tbody tr:nth-child(even) td{
    background:#fbfcfd;
}

.eligibility-portal{
    font-weight:900 !important;

    color:#1e3540 !important;

    font-size:13px !important;
}

.eligibility-link{
    color:#126f82 !important;

    text-decoration:none;

    font-weight:650;

    white-space:normal;

    overflow-wrap:anywhere;

    word-break:break-word;

    display:block;
}

.eligibility-link:hover{
    text-decoration:underline;
}

.eligibility-type{
    font-weight:750 !important;

    color:#53656e !important;
}


/* =========================================================
   VIRTUAL SPACER
========================================================= */

.virtual-spacer td{
    padding:0 !important;

    border:0 !important;

    background:transparent !important;
}


/* =========================================================
   LOADING
========================================================= */

.loading{
    position:absolute;

    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#ffffff;
}

.loading-box{
    display:flex;

    flex-direction:column;

    align-items:center;

    gap:10px;
}

.spinner{
    width:26px;
    height:26px;

    border:2px solid #dce7ea;

    border-top-color:#14778a;

    border-radius:50%;

    animation:spin .6s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.loading-text{
    color:#7c8b94;

    font-size:10.5px;
    font-weight:650;
}


/* =========================================================
   EMPTY
========================================================= */

.empty{
    position:absolute;

    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#89969e;

    font-size:11px;
}


/* =========================================================
   ERROR
========================================================= */

.error{
    margin:20px;

    padding:16px 18px;

    border-radius:8px;

    background:#fff7f7;

    border:1px solid #edd0d0;

    color:#a04444;

    font-size:11px;

    line-height:1.6;
}


/* =========================================================
   FILTER POPUP
========================================================= */

.filter-popup{
    display:none;

    position:fixed;

    z-index:9999;

    width:300px;

    background:#ffffff;

    border:1px solid #d5dfe3;

    border-radius:9px;

    overflow:hidden;

    box-shadow:
        0 18px 45px rgba(25,45,55,.17),
        0 3px 9px rgba(25,45,55,.08);
}

.filter-header{
    padding:11px 12px 9px;

    background:#f5f9fa;

    border-bottom:1px solid #e3e9ec;
}

.filter-title{
    color:#263a44;

    font-size:11px;
    font-weight:800;
}

.filter-subtitle{
    margin-top:2px;

    color:#87949c;

    font-size:8.5px;
}

.filter-search-wrap{
    padding:8px 9px 4px;
}

.filter-search{
    width:100%;
    height:31px;

    padding:0 9px;

    border:1px solid #d6dfe3;

    border-radius:5px;

    outline:none;

    font-size:10px;

    color:#33434c;
}

.filter-search:focus{
    border-color:#78acb6;

    box-shadow:
        0 0 0 3px rgba(20,119,138,.07);
}

.filter-actions{
    display:flex;

    gap:5px;

    padding:4px 9px 7px;
}

.filter-action{
    flex:1;

    height:27px;

    border:1px solid #dce2e5;

    border-radius:5px;

    background:#ffffff;

    color:#64747d;

    font-size:9px;
    font-weight:700;

    cursor:pointer;
}

.filter-action:hover{
    background:#f2f7f8;
}

.filter-values{
    max-height:245px;

    overflow-y:auto;

    border-top:1px solid #e4e9ec;
    border-bottom:1px solid #e4e9ec;
}

.filter-value{
    min-height:29px;

    display:flex;
    align-items:center;

    gap:7px;

    padding:4px 10px;

    color:#44525b;

    font-size:9.5px;

    cursor:pointer;
}

.filter-value:hover{
    background:#eef7f8;
}

.filter-value input{
    width:13px;
    height:13px;

    margin:0;

    accent-color:#14778a;
}

.filter-value-text{
    min-width:0;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}

.filter-footer{
    display:flex;

    gap:5px;

    padding:8px 9px;
}

.filter-footer button{
    flex:1;

    height:31px;

    border-radius:5px;

    font-size:9.5px;
    font-weight:750;

    cursor:pointer;
}

.cancel{
    background:#ffffff;

    border:1px solid #d8e0e4;

    color:#697780;
}

.apply{
    background:#14778a;

    border:1px solid #14778a;

    color:#ffffff;
}

.apply:hover{
    background:#0f6575;
}


/* =========================================================
   SCROLLBAR
========================================================= */

::-webkit-scrollbar{
    width:8px;
    height:8px;
}

::-webkit-scrollbar-track{
    background:#f1f4f5;
}

::-webkit-scrollbar-thumb{
    background:#c6d1d5;

    border-radius:20px;
}

::-webkit-scrollbar-thumb:hover{
    background:#aebdc2;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1500px){

    .tabs-grid{
        grid-template-columns:
            repeat(12,minmax(0,1fr));
    }

}

@media(max-width:1200px){

    .tabs-grid{
        grid-template-columns:
            repeat(10,minmax(0,1fr));
    }

}

@media(max-width:1000px){

    .tabs-grid{
        grid-template-columns:
            repeat(8,minmax(0,1fr));
    }

    .ppi-layout{
        grid-template-columns:
            minmax(0,1fr)
            8px
            240px;
    }

    .ppi-specialty-area{
        width:240px;
        min-width:240px;
    }

    .ppi-specialty-table{
        min-width:240px;
    }

}

@media(max-width:800px){

    .tabs-grid{
        grid-template-columns:
            repeat(6,minmax(0,1fr));
    }

    .tab{
        font-size:9px;
    }

    .ppi-layout{
        grid-template-columns:
            minmax(0,1fr)
            8px
            220px;
    }

    .ppi-specialty-area{
        width:220px;
        min-width:220px;
    }

    .ppi-specialty-table{
        min-width:220px;
    }

}

@media(max-width:600px){

    body{
        overflow:auto;
    }

    .app{
        height:auto;
        min-height:100vh;
    }

    .tabs-grid{
        grid-template-columns:
            repeat(3,minmax(0,1fr));
    }

    .table-view{
        height:calc(100vh - 250px);
        min-height:400px;
    }

    .ppi-layout{
        grid-template-columns:
            minmax(0,1fr)
            8px
            210px;
    }

    .ppi-specialty-area{
        width:210px;
        min-width:210px;
    }

    .ppi-specialty-table{
        width:210px;
        min-width:210px;
    }

}

</style>

function shuffle(array){

    const result = [...array];

    for(
        let i=result.length-1;
        i>0;
        i--
    ){

        const j =
            Math.floor(
                Math.random()*(i+1)
            );

        [
            result[i],
            result[j]
        ] =
        [
            result[j],
            result[i]
        ];

    }

    return result;
}

/* =========================================================

========================================================= */

function valueString(value){

    if(
        value === null ||
        value === undefined
    ){
        return "";
    }

    if(
        typeof value === "object"
    ){

        try{
            return JSON.stringify(value);
        }
        catch{
            return String(value);
        }

    }

    return String(value);
}


/* =========================================================
   ROBUST HEADER NORMALIZATION
========================================================= */

function normalizeColumnName(column){

    return String(column ?? "")
        .replace(/\uFEFF/g,"")
        .replace(/\u200B/g,"")
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9]+/g,"");

}


/* =========================================================

function isGenericNameColumn(column){

/* =========================================================

function isDenialDescriptionColumn(column){

/* =========================================================
   FIND PPI SPECIALTY COLUMN
========================================================= */

/*
   IMPORTANT:

   This function finds the REAL specialty column
   directly from PPI.json.

   It handles:
   - Eligible Clinician Specialty
   - Eligible Clinical Specialty
   - Eligible Clinician Speciality
   - Eligible Clinical Specialist
   - Clinician Specialty
   - Clinical Specialty
   - Specialty

   It also removes hidden BOM / spaces /
   punctuation differences.
*/

function findPpiSpecialtyColumn(rows){

    if(
        !rows ||
        !rows.length
    ){
        return null;
    }


    const columns = [];

    const seen = new Set();


    for(const row of rows){

        if(
            !row ||
            typeof row !== "object" ||
            Array.isArray(row)
        ){
            continue;
        }


        for(const key of Object.keys(row)){

            if(
                !seen.has(key)
            ){

                seen.add(key);

                columns.push(key);

            }

        }

    }


    /*
       Exact normalized names.
    */

    const exactNames = [

        "eligibleclinicianspecialty",

        "eligibleclinicianspecialties",

        "eligibleclinicalspecialty",

        "eligibleclinicianspeciality",

        "eligibleclinicianspecialities",

        "eligibleclinicalspeciality",

        "eligibleclinicalspecialist",

        "eligibleclinicalspecialists",

        "clinicianspecialty",

        "clinicalspecialty",

        "specialty"

    ];


    for(
        const wanted of exactNames
    ){

        const found =
            columns.find(
                column =>
                    normalizeColumnName(column) ===
                    wanted
            );


        if(found){

            return found;

        }

    }


    /*
       Broader detection.

       This catches unexpected column names
       such as:

       Eligible Clinician Specialty:
       Eligible Clinical Specialist
       Eligible Clinician Speciality Name
    */

    const broad =
        columns.find(
            column => {

                const name =
                    normalizeColumnName(column);


                const hasEligible =
                    name.includes("eligible");


                const hasSpecial =
                    name.includes("special");


                const hasClinicianOrClinical =
                    name.includes("clinician") ||
                    name.includes("clinical");


                return (
                    hasEligible &&
                    hasSpecial &&
                    hasClinicianOrClinical
                );

            }
        );


    if(broad){

        return broad;

    }


    /*
       Last fallback:
       any column containing both
       specialty/speciality and clinician/clinical.
    */

    const fallback =
        columns.find(
            column => {

                const name =
                    normalizeColumnName(column);

                return (
                    (
                        name.includes("specialty") ||
                        name.includes("speciality") ||
                        name.includes("specialist")
                    ) &&
                    (
                        name.includes("clinician") ||
                        name.includes("clinical")
                    )
                );

            }
        );


    if(fallback){

        return fallback;

    }


    return null;
}

/* =========================================================
   FILE URL
========================================================= */

function jsonURL(file){

    return "./" +
        encodeURIComponent(file);

}


/* =========================================================
   LOAD JSON
========================================================= */

async function loadFile(file){

    if(
        dataCache.has(file)
    ){
        return dataCache.get(file);
    }

    const response =
        await fetch(
            jsonURL(file),
            {
                cache:"force-cache"
            }
        );

    if(!response.ok){

        throw new Error(
            file +
            " — HTTP " +
            response.status
        );

    }

    const data =
        await response.json();

    let rows = data;

    if(!Array.isArray(rows)){

        if(Array.isArray(data.data)){
            rows = data.data;
        }
        else if(Array.isArray(data.rows)){
            rows = data.rows;
        }
        else if(Array.isArray(data.records)){
            rows = data.records;
        }
        else if(Array.isArray(data.items)){
            rows = data.items;
        }
        else{
            rows = [data];
        }

    }

    dataCache.set(file,rows);

    return rows;
}


/* =========================================================
   LOAD TAB
========================================================= */

async function loadTab(tab){

    const cacheKey =
        "__TAB__" + tab.id;

    if(
        dataCache.has(cacheKey)
    ){
        return dataCache.get(cacheKey);
    }

    const results =
        await Promise.all(
            tab.files.map(
                file => loadFile(file)
            )
        );

    const rows = [];

    for(const result of results){
        rows.push(...result);
    }

    dataCache.set(cacheKey,rows);

    return rows;
}


/* =========================================================

function getColumns(tab,rows){

    if(
        columnsCache.has(tab.id)
    ){
        return columnsCache.get(tab.id);
    }

    const columns = [];
    const seen = new Set();

    for(const row of rows){

        if(
            !row ||
            typeof row !== "object"
        ){
            continue;
        }

        for(const key of Object.keys(row)){

            if(!seen.has(key)){

                seen.add(key);
                columns.push(key);

            }

        }

    }


    if(tab.id === "apg"){

        const thiqa =
            columns.find(
                c =>
                    normalizeColumnName(c) ===
                    "thiqa"
            );

        const basic =
            columns.find(
                c =>
                    normalizeColumnName(c) ===
                    "basic"
            );

        if(thiqa && basic){

            const normal =
                columns.filter(
                    c =>
                        c !== thiqa &&
                        c !== basic
                );

            columns.length = 0;

            columns.push(
                ...normal,
                thiqa,
                basic
            );

        }

    }


    columnsCache.set(
        tab.id,
        columns
    );

    return columns;
}

/* =========================================================
   FILTER MATCH
========================================================= */

function matchesFilters(row){

    const state =
        filters.get(currentTab.id);

    if(
        !state ||
        state.size === 0
    ){
        return true;
    }

    for(
        const [column,selected]
        of state
    ){

        const value =
            valueString(row[column]);

        if(!selected.has(value)){
            return false;
        }

    }

    return true;
}


/* =========================================================
   GET VISIBLE ROWS
========================================================= */

function getVisibleRows(rows){

    const state =
        filters.get(currentTab.id);

    if(
        !state ||
        state.size === 0
    ){
        return rows;
    }

    const result = [];

    for(
        let i=0;
        i<rows.length;
        i++
    ){

        if(matchesFilters(rows[i])){
            result.push(rows[i]);
        }

    }

    return result;
}


/* =========================================================
   PPI SPECIALTY FILTER VALUES
========================================================= */

function getPpiSpecialtyValues(rows){

    const column =
        findPpiSpecialtyColumn(rows);

    if(!column){
        return [];
    }


    const values =
        new Set();


    for(const row of rows){

        const value =
            valueString(
                row[column]
            ).trim();


        if(value){
            values.add(value);
        }

    }


    return Array.from(values).sort(
        (a,b) =>
            a.localeCompare(
                b,
                undefined,
                {
                    numeric:true,
                    sensitivity:"base"
                }
            )
    );

}


/* =========================================================
   PPI SPECIALTY FILTER MATCH
========================================================= */

function ppiSpecialtyMatches(value){

    if(
        ppiSpecialtyFilters.size === 0
    ){
        return true;
    }

    return ppiSpecialtyFilters.has(value);

}


/* =========================================================
   INTELLIGENT COLUMN WIDTHS
========================================================= */

function calculateWidths(
    tab,
    rows,
    columns
){

    if(
        widthCache.has(tab.id)
    ){
        return widthCache.get(tab.id);
    }

    const widths = [];


    for(const column of columns){

        const lower =
            normalizeColumnName(column);


        if(
            tab.id === "apg" &&
            (
                lower === "thiqa" ||
                lower === "basic"
            )
        ){

            widths.push(82);

            continue;
        }


        if(
            tab.id === "haad" &&
            isGenericNameColumn(column)
        ){

            widths.push(125);

            continue;
        }


        if(
            tab.id === "adnic" &&
            isGenericNameColumn(column)
        ){

            widths.push(125);

            continue;
        }


        if(
            tab.id === "denial" &&
            isDenialDescriptionColumn(column)
        ){

            widths.push(165);

            continue;
        }


        const isCode =
            lower.includes("code") ||
            lower.includes("status") ||
            lower === "id" ||
            lower.endsWith("id");


        const isDate =
            lower.includes("date");


        const isNumeric =
            lower.includes("price") ||
            lower.includes("amount") ||
            lower.includes("copay") ||
            lower.includes("quantity") ||
            lower.includes("qty");


        const isText =
            lower.includes("name") ||
            lower.includes("description") ||
            lower.includes("remarks") ||
            lower.includes("notes") ||
            lower.includes("comment") ||
            lower.includes("instruction") ||
            lower.includes("detail") ||
            lower.includes("reason") ||
            lower.includes("specialty") ||
            lower.includes("indication");


        let width = 140;


        if(isCode){
            width = 105;
        }
        else if(isDate){
            width = 110;
        }
        else if(isNumeric){
            width = 105;
        }
        else if(isText){
            width = 145;
        }


        width =
            Math.max(
                90,
                Math.min(
                    width,
                    150
                )
            );


        widths.push(width);

    }


    widthCache.set(
        tab.id,
        widths
    );

    return widths;
}


/* =========================================================
   YES / NO
========================================================= */

function yesNoClass(
    tab,
    column,
    value
){

    if(tab.id !== "apg"){
        return "";
    }

    const lower =
        normalizeColumnName(column);

    if(
        lower !== "thiqa" &&
        lower !== "basic"
    ){
        return "";
    }

    const normalized =
        value.trim().toLowerCase();

    if(normalized === "yes"){
        return "apg-yes";
    }

    if(normalized === "no"){
        return "apg-no";
    }

    return "apg-frozen";
}

            const content =

            const label =

            label.textContent =
                column;

            label.title =
                column;


            const filter =
                document.createElement("button");

            filter.type =
                "button";

            filter.textContent =
                "▼";

                filters.get(tab.id);

            if(
                state &&
                state.has(column)
            ){
                filter.classList.add(
                    "active"
                );
            }


            filter.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    openFilter(
                        column,
                        filter
                    );

                }
            );


            content.appendChild(label);
            content.appendChild(filter);

            th.appendChild(content);
            tr.appendChild(th);

        }
    );


    thead.appendChild(tr);

    table.appendChild(thead);
}


/* =========================================================
   NORMAL VIRTUAL TABLE
========================================================= */

function renderVirtualTable(
    tab,
    rows,
    columns,
    widths,
    version,
    container = tableArea
){

    container.innerHTML = "";


    if(container._virtualScrollHandler){

        container.removeEventListener(
            "scroll",
            container._virtualScrollHandler
        );

        container._virtualScrollHandler =
            null;

    }


    const table =
        document.createElement("table");

    table.className =
        getTableClass(tab);


    const colgroup =
        document.createElement("colgroup");


    columns.forEach(
        (column,index) => {

            const col =
                document.createElement("col");


            if(
                (
                    tab.id === "haad" ||
                    tab.id === "adnic"
                ) &&
                isGenericNameColumn(column)
            ){

                col.className =
                    "generic-name-column";

            }


            if(
                tab.id === "denial" &&
                isDenialDescriptionColumn(column)
            ){

                col.classList.add(
                    "denial-description-column"
                );

            }


            col.style.width =
                widths[index] + "px";

            col.style.minWidth =
                widths[index] + "px";

            col.style.maxWidth =
                widths[index] + "px";


            colgroup.appendChild(col);

        }
    );


    table.appendChild(colgroup);


    createHeader(
        table,
        tab,
        columns,
        widths
    );


    const tbody =
        document.createElement("tbody");

    table.appendChild(tbody);

    container.appendChild(table);


    const DEFAULT_HEIGHT = 34;

    const BUFFER = 12;

    const heights =
        new Array(rows.length)
            .fill(DEFAULT_HEIGHT);

    let prefix =
        new Array(rows.length + 1)
            .fill(0);


    function estimateHeight(row){

        let maxLines = 1;


        for(
            let c=0;
            c<columns.length;
            c++
        ){

            const value =
                valueString(
                    row[columns[c]]
                );


            if(!value){
                continue;
            }


            const availableWidth =
                Math.max(
                    25,
                    widths[c] - 12
                );


            const charsPerLine =
                Math.max(
                    6,
                    Math.floor(
                        availableWidth / 6
                    )
                );


            const lines =
                value
                    .split(/\r?\n/)
                    .reduce(
                        (
                            total,
                            part
                        ) =>
                            total +
                            Math.max(
                                1,
                                Math.ceil(
                                    part.length /
                                    charsPerLine
                                )
                            ),
                        0
                    );


            maxLines =
                Math.max(
                    maxLines,
                    lines
                );

        }


        return Math.max(
            DEFAULT_HEIGHT,
            10 + maxLines * 15
        );

    }


    for(
        let i=0;
        i<rows.length;
        i++
    ){

        heights[i] =
            estimateHeight(
                rows[i]
            );

    }


    function rebuildPrefix(){

        prefix[0] = 0;

        for(
            let i=0;
            i<rows.length;
            i++
        ){

            prefix[i+1] =
                prefix[i] +
                heights[i];

        }

    }


    rebuildPrefix();


    function findIndex(position){

        let low = 0;

        let high = rows.length;


        while(low < high){

            const mid =
                (low + high) >> 1;


            if(
                prefix[mid] <
                position
            ){

                low =
                    mid + 1;

            }
            else{

                high =
                    mid;

            }

        }


        return Math.max(
            0,
            Math.min(
                rows.length,
                low
            )
        );

    }


    let raf = 0;


    function measureRows(){

        if(
            version !== renderVersion
        ){
            return;
        }


        const rendered =
            tbody.querySelectorAll(
                "tr[data-row-index]"
            );


        let changed = false;


        rendered.forEach(tr => {

            const index =
                Number(
                    tr.dataset.rowIndex
                );


            if(
                !Number.isFinite(index) ||
                index < 0 ||
                index >= rows.length
            ){
                return;
            }


            const actual =
                Math.ceil(
                    tr.getBoundingClientRect()
                        .height
                );


            if(
                actual >= DEFAULT_HEIGHT &&
                Math.abs(
                    actual - heights[index]
                ) > 1
            ){

                heights[index] =
                    actual;

                changed = true;

            }

        });


        if(changed){

            rebuildPrefix();

            scheduleDraw();

        }

    }


    function draw(){

        raf = 0;


        if(
            version !== renderVersion
        ){
            return;
        }


        const scrollTop =
            container.scrollTop;

        const viewportHeight =
            container.clientHeight;


        const bodyTop =
            Math.max(
                0,
                scrollTop - 46
            );


        const bodyBottom =
            Math.max(
                0,
                scrollTop +
                viewportHeight -
                46
            );


        let start =
            findIndex(bodyTop);


        let end =
            findIndex(bodyBottom) + 1;


        start =
            Math.max(
                0,
                start - BUFFER
            );


        end =
            Math.min(
                rows.length,
                end + BUFFER
            );


        tbody.innerHTML = "";


        if(start > 0){

            const spacer =
                document.createElement("tr");

            spacer.className =
                "virtual-spacer";


            const cell =
                document.createElement("td");

            cell.colSpan =
                columns.length;

            cell.style.height =
                prefix[start] + "px";


            spacer.appendChild(cell);

            tbody.appendChild(spacer);

        }


        for(
            let i=start;
            i<end;
            i++
        ){

            const row =
                rows[i];


            const tr =
                document.createElement("tr");


            tr.dataset.rowIndex =
                String(i);


            for(
                let c=0;
                c<columns.length;
                c++
            ){

                const column =
                    columns[c];


                const td =
                    document.createElement("td");


                const value =
                    valueString(
                        row[column]
                    );


                td.textContent =
                    value;


                if(value.length > 60){

                    td.title =
                        value;

                }


                if(
                    tab.id === "apg" &&
                    c === columns.length-2
                ){

                    td.classList.add(
                        "freeze-right-2"
                    );

                }


                if(
                    tab.id === "apg" &&
                    c === columns.length-1
                ){

                    td.classList.add(
                        "freeze-right-1"
                    );

                }


                const colorClass =
                    yesNoClass(
                        tab,
                        column,
                        value
                    );


                if(colorClass){

                    td.classList.add(
                        colorClass
                    );

                }


                tr.appendChild(td);

            }


            tbody.appendChild(tr);

        }


        if(end < rows.length){

            const spacer =
                document.createElement("tr");

            spacer.className =
                "virtual-spacer";


            const cell =
                document.createElement("td");

            cell.colSpan =
                columns.length;


            cell.style.height =
                (
                    prefix[rows.length] -
                    prefix[end]
                ) + "px";


            spacer.appendChild(cell);

            tbody.appendChild(spacer);

        }


        requestAnimationFrame(
            measureRows
        );

    }


    function scheduleDraw(){

        if(raf){
            return;
        }

        raf =
            requestAnimationFrame(
                draw
            );

    }


    container._virtualScrollHandler =
        scheduleDraw;


    container.addEventListener(
        "scroll",
        scheduleDraw,
        {
            passive:true
        }
    );


    draw();

}


/* =========================================================
   PPI WIDTHS
========================================================= */

function calculatePpiWidths(columns){

    return columns.map(
        column => {

            /*
               ICD-10 reduced.
            */

            if(
                isPpiIcd10Column(column)
            ){

                return 95;

            }


            /*
               PPI Dose increased.
            */

            if(
                isPpiDoseColumn(column)
            ){

                return 220;

            }


            /*
               Separate Diagnosis field.
            */

            if(
                isPpiDiagnosisColumn(column)
            ){

                return 145;

            }


            const lower =
                normalizeColumnName(column);


            const isCode =
                lower.includes("code") ||
                lower === "id" ||
                lower.endsWith("id");


            const isDate =
                lower.includes("date");


            const isNumeric =
                lower.includes("price") ||
                lower.includes("amount") ||
                lower.includes("copay") ||
                lower.includes("quantity") ||
                lower.includes("qty");


            const isText =
                lower.includes("name") ||
                lower.includes("description") ||
                lower.includes("remarks") ||
                lower.includes("notes") ||
                lower.includes("comment") ||
                lower.includes("instruction") ||
                lower.includes("detail") ||
                lower.includes("reason") ||
                lower.includes("specialty") ||
                lower.includes("indication");


            let width = 140;


            if(isCode){
                width = 105;
            }
            else if(isDate){
                width = 110;
            }
            else if(isNumeric){
                width = 105;
            }
            else if(isText){
                width = 145;
            }


            return Math.max(
                90,
                Math.min(
                    width,
                    150
                )
            );

        }
    );

}

            content.appendChild(label);

            th.appendChild(content);

            headerRow.appendChild(th);

        }

    thead.appendChild(headerRow);

    /* =====================================================

function renderPpiTable(
    tab,

    version
){

    if(
        version !== renderVersion
    ){
        return;
    }


    if(
        !rows ||
        rows.length === 0
    ){

        tableArea.style.overflow =
            "auto";

        tableArea.innerHTML = `
            <div class="empty">
                No PPI data found.
            </div>
        `;

        recordNumber.textContent =
            "0";

        return;
    }


    tableArea.style.overflow =
        "hidden";


    const allColumns =
        getColumns(
            tab,
            rows
        );


    /*
       Get specialty filter values
       directly from the JSON column.
    */

    ppiSpecialtyAllValues =
        getPpiSpecialtyValues(
            rows
        );


    const layout =
        document.createElement("div");

    layout.className =
        "ppi-layout";


    /*
       A-F MAIN TABLE
    */

    layout.appendChild(
        renderPpiMainTable(
            rows,
            allColumns
        )
    );


    /*
       SMALL SPACE BETWEEN F AND H
    */

    const gap =
        document.createElement("div");

    gap.className =
        "ppi-gap";

    layout.appendChild(gap);


    /*
       H SPECIALTY TABLE
    */

    layout.appendChild(
        renderPpiSpecialtyTable(
            rows
        )
    );


    tableArea.innerHTML = "";

    tableArea.appendChild(
        layout
    );


    /*
       Record number represents
       A-F filtered rows.
    */

    const visibleRows =
        getVisibleRows(rows);


    recordNumber.textContent =
        visibleRows.length.toLocaleString();

}

        }
        else{

            linkCell.textContent =
                group.link;

        }


        usernameRow.appendChild(
            linkCell
        );


        const typeUser =
            document.createElement("td");

        typeUser.className =
            "eligibility-type";

        typeUser.textContent =
            "Username";

        usernameRow.appendChild(
            typeUser
        );


        usernameRow.appendChild(
            createEligibilityCell(
                group.username
            )
        );

        usernameRow.appendChild(
            createEligibilityCell(
                group.usernameNoud
            )
        );

        usernameRow.appendChild(
            createEligibilityCell(
                group.usernameFalaj
            )
        );


        tbody.appendChild(
            usernameRow
        );


        const passwordRow =
            document.createElement("tr");


        const typePassword =
            document.createElement("td");

        typePassword.className =
            "eligibility-type";

        typePassword.textContent =
            "Password";

        passwordRow.appendChild(
            typePassword
        );


        passwordRow.appendChild(
            createEligibilityCell(
                group.password
            )
        );

        passwordRow.appendChild(
            createEligibilityCell(
                group.passwordNoud
            )
        );

        passwordRow.appendChild(
            createEligibilityCell(
                group.passwordFalaj
            )
        );


        tbody.appendChild(
            passwordRow
        );

    });


    table.appendChild(tbody);

    tableArea.appendChild(table);

}


/* =========================================================
   ELIGIBILITY CELL
========================================================= */

function createEligibilityCell(value){

    const td =
        document.createElement("td");

    td.textContent =
        value;


    if(value.length > 60){
        td.title = value;
    }


    return td;
}


/* =========================================================
   RENDER TABLE
========================================================= */

function renderTable(
    tab,
    version
){

    if(
        version !== renderVersion
    ){
        return;
    }


    const rows =
        tab.rows || [];


    /* SPECIAL ELIGIBILITY */

    if(tab.id === "eligibility"){

        renderEligibilityTable(
            tab,
            rows,
            version
        );

        return;
    }


    /* SPECIAL PPI */

    if(tab.id === "ppi"){

        renderPpiTable(
            tab,
            rows,
            version
        );

        return;
    }


    tableArea.style.overflow =
        "auto";


    if(rows.length === 0){

        tableArea.innerHTML = `
            <div class="empty">
                No data found.
            </div>
        `;

        recordNumber.textContent = "0";

        return;
    }


    const columns =
        getColumns(
            tab,
            rows
        );


    const visible =
        getVisibleRows(rows);


    recordNumber.textContent =
        visible.length.toLocaleString();


    const widths =
        calculateWidths(
            tab,
            rows,
            columns
        );


    renderVirtualTable(
        tab,
        visible,
        columns,
        widths,
        version
    );

}


/* =========================================================
   OPEN TAB
========================================================= */

async function openTab(id){

    const tab =
        tabsConfig.find(
            item =>
                item.id === id
        );


    if(!tab){
        return;
    }


    currentTab =
        tab;


    setActiveTab(id);


    currentList.textContent =
        tab.name;


    if(!filters.has(id)){

        filters.set(
            id,
            new Map()
        );

    }


    const version =
        ++renderVersion;


    if(
        dataCache.has(
            "__TAB__" + id
        )
    ){

        tab.rows =
            dataCache.get(
                "__TAB__" + id
            );


        renderTable(
            tab,
            version
        );


        return;
    }


    showLoading(
        tab.name
    );


    recordNumber.textContent =
        "Loading";


    try{

        const rows =
            await loadTab(tab);


        if(
            version !== renderVersion
        ){
            return;
        }


        tab.rows =
            rows;


        renderTable(
            tab,
            version
        );


        scheduleBackgroundPreload();

    }
    catch(error){

        if(
            version !== renderVersion
        ){
            return;
        }


        console.error(error);


        tableArea.style.overflow =
            "auto";


        tableArea.innerHTML = `

            <div class="error">

                <strong>
                    Could not load ${tab.name}
                </strong>

                <br><br>

                ${error.message}

                <br><br>

                Check the JSON filename in GitHub.

            </div>

        `;


        recordNumber.textContent =
            "Error";

    }

}


/* =========================================================
   BACKGROUND PRELOAD
========================================================= */

let preloadStarted = false;


async function scheduleBackgroundPreload(){

    if(preloadStarted){
        return;
    }


    preloadStarted = true;


    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                1200
            )
    );


    const pending =
        tabsConfig.filter(
            tab =>
                !dataCache.has(
                    "__TAB__" +
                    tab.id
                )
        );


    const BATCH_SIZE = 2;


    for(
        let i=0;
        i<pending.length;
        i+=BATCH_SIZE
    ){

        const batch =
            pending.slice(
                i,
                i+BATCH_SIZE
            );


        await Promise.all(
            batch.map(
                async tab => {

                    try{

                        const rows =
                            await loadTab(tab);

                        tab.rows =
                            rows;

                    }
                    catch(error){

                        console.warn(
                            "Background preload failed:",
                            tab.name,
                            error
                        );

                    }

                }
            )
        );


        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    20
                )
        );

    }

}


/* =========================================================
   OPEN NORMAL FILTER
========================================================= */

function openFilter(
    column,
    button
){

    if(!currentTab){
        return;
    }


    filterMode =
        "normal";


    filterColumn =
        column;


    const values =
        new Set();


    if(
        currentTab.id === "eligibility" &&
        column === "Eligibility Portal"
    ){

        const rows =
            currentTab.rows || [];


        for(
            let i=2;
            i<rows.length;
            i+=2
        ){

            const portal =
                valueString(
                    rows[i][
                        "Unnamed: 0"
                    ]
                );


            if(portal){

                values.add(
                    portal
                );

            }

        }

    }
    else{

        for(
            const row of currentTab.rows
        ){

            values.add(
                valueString(
                    row[column]
                )
            );

        }

    }


    filterAllValues =
        Array.from(values);


    filterAllValues.sort(
        (a,b)=>
            a.localeCompare(
                b,
                undefined,
                {
                    numeric:true,
                    sensitivity:"base"
                }
            )
    );


    const state =
        filters.get(
            currentTab.id
        );


    const existing =
        state &&
        state.get(column);


    if(existing){

        temporarySelection =
            new Set(existing);

    }
    else{

        temporarySelection =
            new Set(
                filterAllValues
            );

    }


    filterTitle.textContent =
        "Filter: " + column;


    filterSearch.value =
        "";


    renderFilterValues();


    filterPopup.style.display =
        "block";


    positionFilterPopup(button);

}


/* =========================================================
   OPEN PPI SPECIALTY FILTER
========================================================= */

function openPpiSpecialtyFilter(button){

    filterMode =
        "ppi-specialty";


    filterColumn =
        "Eligible Clinician Specialty";


    filterAllValues =
        [...ppiSpecialtyAllValues];


    ppiSpecialtyTemporarySelection =
        new Set(
            ppiSpecialtyFilters.size > 0
                ? ppiSpecialtyFilters
                : filterAllValues
        );


    filterTitle.textContent =
        "Filter: Eligible Clinician Specialty";


    filterSearch.value =
        "";


    renderFilterValues();


    filterPopup.style.display =
        "block";


    ppiSpecialtyFilterOpen =
        true;


    positionFilterPopup(button);

}


/* =========================================================
   POSITION FILTER POPUP
========================================================= */

function positionFilterPopup(button){

    const rect =
        button.getBoundingClientRect();


    const width =
        filterPopup.offsetWidth;


    const height =
        filterPopup.offsetHeight;


    let left =
        rect.left;


    let top =
        rect.bottom + 5;


    if(
        left + width >
        window.innerWidth - 10
    ){

        left =
            window.innerWidth -
            width -
            10;

    }


    if(
        top + height >
        window.innerHeight - 10
    ){

        top =
            rect.top -
            height -
            5;

    }


    left =
        Math.max(
            10,
            left
        );


    top =
        Math.max(
            10,
            top
        );


    filterPopup.style.left =
        left + "px";


    filterPopup.style.top =
        top + "px";


    filterSearch.focus();

}


/* =========================================================
   FILTER VALUES
========================================================= */

function renderFilterValues(){

    const search =
        filterSearch.value
            .trim()
            .toLowerCase();


    filterValues.innerHTML = "";


    const fragment =
        document.createDocumentFragment();


    const selection =
        filterMode === "ppi-specialty"
            ? ppiSpecialtyTemporarySelection
            : temporarySelection;


    for(
        const value of filterAllValues
    ){

        const display =
            value === ""
                ? "(Blank)"
                : value;


        if(
            search &&
            !display
                .toLowerCase()
                .includes(search)
        ){

            continue;

        }


        const label =
            document.createElement("label");

        label.className =
            "filter-value";


        const checkbox =
            document.createElement("input");

        checkbox.type =
            "checkbox";


        checkbox.checked =
            selection.has(
                value
            );


        checkbox.addEventListener(
            "change",
            () => {

                if(checkbox.checked){

                    selection.add(
                        value
                    );

                }
                else{

                    selection.delete(
                        value
                    );

                }

            }
        );


        const text =
            document.createElement("span");

        text.className =
            "filter-value-text";

        text.textContent =
            display;

        text.title =
            display;


        label.appendChild(
            checkbox
        );

        label.appendChild(
            text
        );


        fragment.appendChild(
            label
        );

    }


    filterValues.appendChild(
        fragment
    );

}


/* =========================================================
   FILTER SEARCH
========================================================= */

filterSearch.addEventListener(
    "input",
    renderFilterValues
);


/* =========================================================
   SELECT ALL
========================================================= */

document
    .getElementById("selectAll")
    .addEventListener(
        "click",
        () => {

            if(
                filterMode === "ppi-specialty"
            ){

                ppiSpecialtyTemporarySelection =
                    new Set(
                        filterAllValues
                    );

            }
            else{

                temporarySelection =
                    new Set(
                        filterAllValues
                    );

            }


            renderFilterValues();

        }
    );


/* =========================================================
   UNCHECK ALL
========================================================= */

document
    .getElementById("uncheckAll")
    .addEventListener(
        "click",
        () => {

            if(
                filterMode === "ppi-specialty"
            ){

                ppiSpecialtyTemporarySelection =
                    new Set();

            }
            else{

                temporarySelection =
                    new Set();

            }


            renderFilterValues();

        }
    );


/* =========================================================
   APPLY FILTER
========================================================= */

document
    .getElementById("applyFilter")
    .addEventListener(
        "click",
        () => {

            /*
               PPI SPECIALTY FILTER
            */

            if(
                filterMode === "ppi-specialty"
            ){

                if(
                    ppiSpecialtyTemporarySelection.size ===
                    filterAllValues.length
                ){

                    ppiSpecialtyFilters.clear();

                }
                else{

                    ppiSpecialtyFilters.clear();

                    for(
                        const value of
                        ppiSpecialtyTemporarySelection
                    ){

                        ppiSpecialtyFilters.add(
                            value
                        );

                    }

                }


                closeFilter();


                if(
                    currentTab &&
                    currentTab.id === "ppi"
                ){

                    renderTable(
                        currentTab,
                        ++renderVersion
                    );

                }

                return;

            }


            /*
               NORMAL FILTER
            */

            if(
                !currentTab ||
                filterColumn === null
            ){
                return;
            }


            const state =
                filters.get(
                    currentTab.id
                );


            if(
                temporarySelection.size ===
                filterAllValues.length
            ){

                state.delete(
                    filterColumn
                );

            }
            else{

                state.set(
                    filterColumn,
                    new Set(
                        temporarySelection
                    )
                );

            }


            closeFilter();


            renderTable(
                currentTab,
                ++renderVersion
            );

        }
    );


/* =========================================================
   CANCEL
========================================================= */

document
    .getElementById("cancelFilter")
    .addEventListener(
        "click",
        closeFilter
    );


/* =========================================================
   CLOSE FILTER
========================================================= */

function closeFilter(){

    filterPopup.style.display =
        "none";

    filterColumn =
        null;

    filterMode =
        "normal";

    ppiSpecialtyFilterOpen =
        false;

}


/* =========================================================
   CLEAR FILTERS
========================================================= */

document
    .getElementById("clearButton")
    .addEventListener(
        "click",
        () => {

            if(!currentTab){
                return;
            }


            filters.set(
                currentTab.id,
                new Map()
            );


            if(
                currentTab.id === "ppi"
            ){

                ppiSpecialtyFilters.clear();

            }


            closeFilter();


            renderTable(
                currentTab,
                ++renderVersion
            );

        }
    );


/* =========================================================
   OUTSIDE CLICK
========================================================= */

document.addEventListener(
    "mousedown",
    event => {

        if(
            filterPopup.style.display === "block" &&

            !filterPopup.contains(
                event.target
            ) &&

            !event.target.closest(
                ".filter-button"
            ) &&

            !event.target.closest(
                ".ppi-specialty-filter"
            )
        ){

            closeFilter();

        }

    }
);


/* =========================================================
   ESCAPE
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(event.key === "Escape"){

            closeFilter();

        }

    }
);


/* =========================================================
   START
========================================================= */

createTabs();

openTab("apg");

</script>
