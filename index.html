];


/* =========================================================
   STATE
========================================================= */

const cache = new Map();
const filterState = new Map();

let currentTab = null;

let activeFilterTab = null;
let activeFilterColumn = null;

let temporaryFilterValues = new Set();


/* =========================================================
   DOM
========================================================= */

const tabsEl =
    document.getElementById("tabs");

const mainArea =
    document.getElementById("mainArea");

const tableTitle =
    document.getElementById("tableTitle");

const recordCount =
    document.getElementById("recordCount");

const clearFilters =
    document.getElementById("clearFilters");

const filterPopup =
    document.getElementById("filterPopup");

const filterSearch =
    document.getElementById("filterSearch");

const filterOptions =
    document.getElementById("filterOptions");

const selectAll =
    document.getElementById("selectAll");

const unselectAll =
    document.getElementById("unselectAll");

const cancelFilter =
    document.getElementById("cancelFilter");

const applyFilter =
    document.getElementById("applyFilter");


/* =========================================================
   NORMALIZE
========================================================= */

function normalize(value){

    return String(value ?? "")
        .trim()
        .toLowerCase();
}


/* =========================================================
   FORMAT VALUE
========================================================= */

function formatValue(value){

    if(value === null || value === undefined){
        return "";
    }

    if(typeof value === "object"){

        try{
            return JSON.stringify(value);
        }catch{
            return String(value);
        }
    }

    return String(value);
}


/* =========================================================
   CREATE TABS
========================================================= */

function createTabs(){

    tabsEl.innerHTML = "";

    tabsConfig.forEach(tab => {

        const button =
            document.createElement("button");

        button.className = "tab";
        button.textContent = tab.name;
        button.dataset.id = tab.id;

        button.addEventListener(
            "click",
            () => openTab(tab.id)
        );

        tabsEl.appendChild(button);
    });
}


/* =========================================================
   LOAD JSON
========================================================= */

async function loadFile(file){

    const response =
        await fetch(
            "./" + encodeURIComponent(file),
            {
                cache:"force-cache"
            }
        );

    if(!response.ok){

        throw new Error(
            `Cannot load ${file} (${response.status})`
        );
    }

    const json =
        await response.json();

    if(Array.isArray(json)){
        return json;
    }

    if(Array.isArray(json.data)){
        return json.data;
    }

    if(Array.isArray(json.rows)){
        return json.rows;
    }

    if(Array.isArray(json.records)){
        return json.records;
    }

    if(Array.isArray(json.items)){
        return json.items;
    }

    return [];
}


/* =========================================================
   LOAD TAB
========================================================= */

async function loadTab(tab){

    if(cache.has(tab.id)){
        return cache.get(tab.id);
    }

    const parts =
        await Promise.all(
            tab.files.map(
                file => loadFile(file)
            )
        );

    let rows = [];

    parts.forEach(part => {
        rows = rows.concat(part);
    });

    cache.set(
        tab.id,
        rows
    );

    return rows;
}


/* =========================================================
   GET COLUMNS
========================================================= */

function getColumns(tab,rows){

    const set = new Set();

    rows.forEach(row => {

        if(!row || typeof row !== "object"){
            return;
        }

        Object.keys(row).forEach(key => {
            set.add(key);
        });
    });

    let columns =
        Array.from(set);

    if(tab.id === "apg"){

        const thiqa =
            columns.find(
                c =>
                    normalize(c) === "thiqa"
            );

        const basic =
            columns.find(
                c =>
                    normalize(c) === "basic"
            );

        columns =
            columns.filter(
                c =>
                    c !== thiqa &&
                    c !== basic
            );

        if(thiqa){
            columns.push(thiqa);
        }

        if(basic){
            columns.push(basic);
        }
    }

    return columns;
}


/* =========================================================
   FILTER MATCH
========================================================= */

function matchesFilters(tabId,row){

    const filters =
        filterState.get(tabId);

    if(!filters){
        return true;
    }

    for(
        const [column,selected]
        of filters
    ){

        if(
            !selected ||
            selected.size === 0
        ){
            continue;
        }

        const value =
            formatValue(
                row[column]
            );

        if(!selected.has(value)){
            return false;
        }
    }

    return true;
}


/* =========================================================
   FILTERED ROWS
========================================================= */

function filteredRows(tabId,rows){

    return rows.filter(
        row =>
            matchesFilters(
                tabId,
                row
            )
    );
}


/* =========================================================
   OPEN TAB
========================================================= */

async function openTab(id){

    const tab =
        tabsConfig.find(
            t => t.id === id
        );

    if(!tab){
        return;
    }

    currentTab = tab;

    document
        .querySelectorAll(".tab")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.id === id
            );
        });

    tableTitle.textContent =
        tab.name;

    recordCount.textContent = "";

    closeFilterPopup();

    mainArea.innerHTML = `
        <div class="loading">
            <div class="spinner"></div>
            Loading...
        </div>
    `;

    try{

        const rows =
            await loadTab(tab);

        if(
            !currentTab ||
            currentTab.id !== id
        ){
            return;
        }

        renderCurrentTab(rows);

    }catch(error){

        console.error(error);

        mainArea.innerHTML = `
            <div class="loading">
                Failed to load data.
            </div>
        `;
    }
}


/* =========================================================
   RENDER CURRENT TAB
========================================================= */

function renderCurrentTab(rows){

    if(!currentTab){
        return;
    }

    if(
        currentTab.special ===
        "eligibility"
    ){

        renderEligibility(rows);

        return;
    }

    renderNormalTable(
        currentTab,
        rows
    );
}


/* =========================================================
   NORMAL TABLE
========================================================= */

function renderNormalTable(tab,rows){

    const columns =
        getColumns(
            tab,
            rows
        );

    const visibleRows =
        filteredRows(
            tab.id,
            rows
        );

    recordCount.textContent =
        `${visibleRows.length.toLocaleString()} / ${rows.length.toLocaleString()} records`;

    mainArea.innerHTML = "";

    const table =
        document.createElement("table");

    table.className =
        "table";

    const colgroup =
        document.createElement("colgroup");

    columns.forEach(column => {

        const col =
            document.createElement("col");

        let width = 110;

        if(
            tab.id === "apg" &&
            (
                normalize(column) === "thiqa" ||
                normalize(column) === "basic"
            )
        ){

            width = 82;

        }else{

            let maxLength =
                String(column).length;

            for(
                let i=0;
                i<Math.min(rows.length,180);
                i++
            ){

                const value =
                    formatValue(
                        rows[i]?.[column]
                    );

                maxLength =
                    Math.max(
                        maxLength,
                        value.length
                    );
            }

            width =
                Math.max(
                    78,
                    Math.min(
                        190,
                        25 + maxLength * 6
                    )
                );

            if(maxLength <= 12){
                width =
                    Math.min(
                        width,
                        105
                    );
            }
        }

        col.style.width =
            width + "px";

        colgroup.appendChild(col);
    });

    table.appendChild(colgroup);


    /* HEADER */

    const thead =
        document.createElement("thead");

    const headerRow =
        document.createElement("tr");

    columns.forEach(column => {

        const th =
            document.createElement("th");

        th.textContent =
            column;

        const button =
            document.createElement("button");

        button.className =
            "filter-btn";

        button.innerHTML =
            "▼";

        const existing =
            filterState
                .get(tab.id)
                ?.get(column);

        if(existing){
            button.classList.add(
                "filtered"
            );
        }

        button.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                openFilter(
                    tab,
                    rows,
                    column,
                    button
                );
            }
        );

        th.appendChild(button);

        headerRow.appendChild(th);
    });

    thead.appendChild(headerRow);

    table.appendChild(thead);


    /* BODY */

    const tbody =
        document.createElement("tbody");

    visibleRows.forEach(row => {

        const tr =
            document.createElement("tr");

        columns.forEach(column => {

            const td =
                document.createElement("td");

            const value =
                formatValue(
                    row[column]
                );

            td.textContent =
                value;

            td.title =
                value;

            if(
                tab.id === "apg"
            ){

                const name =
                    normalize(column);

                const val =
                    normalize(value);

                if(
                    (
                        name === "thiqa" ||
                        name === "basic"
                    ) &&
                    val === "yes"
                ){

                    td.classList.add(
                        "apg-yes"
                    );
                }

                if(
                    (
                        name === "thiqa" ||
                        name === "basic"
                    ) &&
                    val === "no"
                ){

                    td.classList.add(
                        "apg-no"
                    );
                }
            }

            tr.appendChild(td);
        });

        tbody.appendChild(tr);
    });

    table.appendChild(tbody);

    mainArea.appendChild(table);
}


/* =========================================================

/* =========================================================
   URL
========================================================= */

function isURL(value){

    if(!value){
        return false;
    }

    try{

        const url =
            new URL(value);

        return (
            url.protocol === "http:" ||
            url.protocol === "https:"
        );

    }catch{

        return false;
    }
}


/* =========================================================
   ELIGIBILITY FILTER
   ONLY A3
========================================================= */

function openEligibilityFilter(
    portalPairs,
    button
){

    activeFilterTab =
        {
            id:"eligibility"
        };

    activeFilterColumn =
        "__PORTAL__";


    const values =
        portalPairs.map(
            pair =>
                pair.username[
                    "Unnamed: 0"
                ] || ""
        );


    const existing =
        filterState
            .get("eligibility")
            ?.get("__PORTAL__");


    if(existing){

        temporaryFilterValues =
            new Set(existing);

    }else{

        temporaryFilterValues =
            new Set(values);
    }


    renderFilterOptions(
        values
    );


    const rect =
        button.getBoundingClientRect();


    let left =
        rect.left;

    let top =
        rect.bottom + 5;


    if(
        left + 300 >
        window.innerWidth
    ){

        left =
            window.innerWidth - 310;
    }


    if(
        top + 410 >
        window.innerHeight
    ){

        top =
            rect.top - 415;
    }


    filterPopup.style.left =
        Math.max(5,left) + "px";

    filterPopup.style.top =
        Math.max(5,top) + "px";


    filterPopup.classList.add(
        "show"
    );


    filterSearch.value =
        "";


    setTimeout(
        () =>
            filterSearch.focus(),
        0
    );
}


/* =========================================================
   RENDER FILTER OPTIONS
========================================================= */

function renderFilterOptions(values){

    filterOptions.innerHTML = "";

    values.forEach(value => {

        const label =
            document.createElement("label");

        label.className =
            "filter-option";


        const checkbox =
            document.createElement("input");

        checkbox.type =
            "checkbox";

        checkbox.value =
            value;

        checkbox.checked =
            temporaryFilterValues.has(
                value
            );


        checkbox.addEventListener(
            "change",
            () => {

                if(
                    checkbox.checked
                ){

                    temporaryFilterValues.add(
                        value
                    );

                }else{

                    temporaryFilterValues.delete(
                        value
                    );
                }
            }
        );


        const text =
            document.createElement("span");

        text.textContent =
            value === ""
                ? "(blank)"
                : value;


        label.appendChild(
            checkbox
        );

        label.appendChild(
            text
        );

        filterOptions.appendChild(
            label
        );
    });
}


/* =========================================================
   FILTER SEARCH
========================================================= */

filterSearch.addEventListener(
    "input",
    () => {

        const search =
            normalize(
                filterSearch.value
            );


        document
            .querySelectorAll(
                ".filter-option"
            )
            .forEach(option => {

                const text =
                    normalize(
                        option
                            .querySelector(
                                "span"
                            )
                            .textContent
                    );


                option.style.display =
                    text.includes(search)
                        ? "flex"
                        : "none";
            });
    }
);


/* =========================================================
   SELECT ALL
========================================================= */

selectAll.addEventListener(
    "click",
    () => {

        document
            .querySelectorAll(
                ".filter-option"
            )
            .forEach(option => {

                if(
                    option.style.display ===
                    "none"
                ){
                    return;
                }


                const checkbox =
                    option.querySelector(
                        "input"
                    );


                checkbox.checked =
                    true;


                temporaryFilterValues.add(
                    checkbox.value
                );
            });
    }
);


/* =========================================================
   UNSELECT ALL
========================================================= */

unselectAll.addEventListener(
    "click",
    () => {

        document
            .querySelectorAll(
                ".filter-option"
            )
            .forEach(option => {

                if(
                    option.style.display ===
                    "none"
                ){
                    return;
                }


                const checkbox =
                    option.querySelector(
                        "input"
                    );


                checkbox.checked =
                    false;


                temporaryFilterValues.delete(
                    checkbox.value
                );
            });
    }
);


/* =========================================================
   APPLY FILTER
========================================================= */

applyFilter.addEventListener(
    "click",
    () => {

        if(
            !activeFilterTab ||
            !activeFilterColumn
        ){
            return;
        }


        if(
            !filterState.has(
                activeFilterTab.id
            )
        ){

            filterState.set(
                activeFilterTab.id,
                new Map()
            );
        }


        const filters =
            filterState.get(
                activeFilterTab.id
            );


        const rows =
            cache.get(
                activeFilterTab.id
            ) || [];


        /* ================================================
           SPECIAL ELIGIBILITY FILTER
        ================================================ */

        if(
            activeFilterTab.id ===
            "eligibility"
        ){

            const portals = [];


            for(
                let i=2;
                i<rows.length;
                i+=2
            ){

                if(
                    rows[i] &&
                    rows[i]["Unnamed: 0"]
                ){

                    portals.push(
                        rows[i][
                            "Unnamed: 0"
                        ]
                    );
                }
            }


            if(
                temporaryFilterValues.size ===
                portals.length
            ){

                filters.delete(
                    "__PORTAL__"
                );

            }else{

                filters.set(
                    "__PORTAL__",
                    new Set(
                        temporaryFilterValues
                    )
                );
            }


            closeFilterPopup();

            renderEligibilityFiltered();

            return;
        }


        /* ================================================
           NORMAL FILTER
        ================================================ */

        const allValues =
            new Set();


        rows.forEach(row => {

            allValues.add(
                formatValue(
                    row[
                        activeFilterColumn
                    ]
                )
            );
        });


        if(
            temporaryFilterValues.size ===
            allValues.size
        ){

            filters.delete(
                activeFilterColumn
            );

        }else{

            filters.set(
                activeFilterColumn,
                new Set(
                    temporaryFilterValues
                )
            );
        }


        closeFilterPopup();

        renderCurrentTab();
    }
);


/* =========================================================
   RENDER ELIGIBILITY AFTER FILTER
========================================================= */

function renderEligibilityFiltered(){

    const rows =
        cache.get(
            "eligibility"
        ) || [];


    const selected =
        filterState
            .get("eligibility")
            ?.get("__PORTAL__");


    if(
        !selected ||
        selected.size === 0
    ){

        renderEligibility(rows);

        return;
    }


    const filtered = [];


    for(
        let i=2;
        i<rows.length;
        i+=2
    ){

        const username =
            rows[i];

        const password =
            rows[i+1];


        if(!username){
            continue;
        }


        const portal =
            username[
                "Unnamed: 0"
            ] || "";


        if(
            selected.has(
                portal
            )
        ){

            filtered.push(
                username
            );

            if(password){
                filtered.push(
                    password
                );
            }
        }
    }


    const allRows =
        rows.slice(
            0,
            2
        );


    renderEligibility(
        allRows.concat(filtered)
    );
}


/* =========================================================
   CANCEL
========================================================= */

cancelFilter.addEventListener(
    "click",
    closeFilterPopup
);


/* =========================================================
   CLOSE FILTER
========================================================= */

function closeFilterPopup(){

    filterPopup.classList.remove(
        "show"
    );

    activeFilterTab =
        null;

    activeFilterColumn =
        null;
}


/* =========================================================
   CLEAR FILTERS
========================================================= */

clearFilters.addEventListener(
    "click",
    () => {

        if(!currentTab){
            return;
        }


        filterState.delete(
            currentTab.id
        );


        if(
            currentTab.special ===
            "eligibility"
        ){

            const rows =
                cache.get(
                    currentTab.id
                ) || [];

            renderEligibility(rows);

        }else{

            renderCurrentTab();
        }
    }
);


/* =========================================================
   CLICK OUTSIDE FILTER
========================================================= */

document.addEventListener(
    "click",
    event => {

        if(
            filterPopup.classList.contains(
                "show"
            ) &&
            !filterPopup.contains(
                event.target
            ) &&
            !event.target.classList.contains(
                "filter-btn"
            ) &&
            !event.target.classList.contains(
                "eligibility-filter-btn"
            )
        ){

            closeFilterPopup();
        }
    }
);


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Escape"
        ){

            closeFilterPopup();
        }
    }
);


/* =========================================================
   PRELOAD
========================================================= */

function preloadOtherTabs(){

    const others =
        tabsConfig.filter(
            t =>
                t.id !==
                currentTab?.id
        );


    let index = 0;


    function next(){

        if(
            index >=
            others.length
        ){
            return;
        }


        const tab =
            others[index++];


        if(
            !cache.has(
                tab.id
            )
        ){

            loadTab(tab)
                .catch(
                    error =>
                        console.warn(
                            "Preload failed:",
                            tab.name,
                            error
                        )
                );
        }


        setTimeout(
            next,
            35
        );
    }


    next();
}


/* =========================================================
   START
========================================================= */

createTabs();

openTab("apg");


if(
    "requestIdleCallback"
    in window
){

    requestIdleCallback(
        preloadOtherTabs,
        {
            timeout:1200
        }
    );

}else{

    setTimeout(
        preloadOtherTabs,
        1200
    );
}
