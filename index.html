              customTableFilters.set("apg-hcpcs-right",new Map());
          }

          const columns = getColumns(tab,rows);

        const displayRows =
            rows.filter((row,index) => index !== 0);

          const hcpcCodeColumn =
              columns[6] || null;

          const l3702Index =
              displayRows.findIndex(row =>
                  getApgCapCellValue(
                      row,
                      hcpcCodeColumn,
                      columns
                  ).trim().toUpperCase() === "L3702"
              );

          const rightTableRows =
              l3702Index >= 0
                  ? displayRows.slice(0,l3702Index + 1)
                  : displayRows.slice(0,215);

          const firstTableWidths = [
              calculateNoWrapColumnWidth(
                  columns[0],displayRows,0,"Item Code",52
              ),
              220,
              calculateNoWrapColumnWidth(
                  columns[2],displayRows,2,"Unit Price",52
              ),
              calculateNoWrapColumnWidth(
                  columns[3],displayRows,3,"HCPC Code",52
              ),
              calculateNoWrapColumnWidth(
                  columns[4],displayRows,4,"Cap Price",52
              )
          ];

        const secondTableWidths = [
            calculateNoWrapColumnWidth(
                columns[6],rightTableRows,6,"Code",52
            ),
            "auto",
            calculateNoWrapColumnWidth(
                columns[8],rightTableRows,8,"Price (AED)",58
            )
        ];

          const layout =
              document.createElement("div");

          layout.className = "hcpcs-cap-layout";

          appendApgCapPane(
              layout,
              tab,
                  displayRows,
                  columns,
              {
                  key:"apg-hcpcs-left",
                  sourceRows:rows,
                  title:"APG HCPC items with Cap price",
                  indices:[0,1,2,3,4],
                  labels:["Item Code","Item Name","Unit Price","HCPC Code","Cap Price"],
                  widths:firstTableWidths,
                  nowrapIndices:[0,2,3,4]
              }
          );

          appendApgCapPane(
              layout,
              tab,
                  rightTableRows,
                  columns,
              {
                  key:"apg-hcpcs-right",
                  sourceRows:rows,
                  title:"HCPC codes with Cap price",
                  indices:[6,7,8],
                  labels:["Code","","Price (AED)"],
                  widths:secondTableWidths,
                  nowrapIndices:[0,2]
              }
          );

          tableArea.appendChild(layout);
          recordNumber.textContent = displayRows.length.toLocaleString();

      }


      /* =========================================================
         RENDER TABLE
      ========================================================= */

      function renderTable(
          tab,
          version
      ){

          if(
              version !== renderVersion
          ){
              return;
          }


        if(tab.id === "apg-hcpcs"){

              renderApgHcpcsCap(
                  tab,
                  tab.rows || []
              );

            return;

        }


        if(tab.id === "rx"){

            renderRxValidity();

            return;

        }


          /*
             SPECIAL REFILL CALCULATOR
          */

          if(tab.id === "refill"){

              renderRefillTable();

              return;
          }


          const rows =
              getDisplayRows(tab);


          /*
             SPECIAL ELIGIBILITY
          */

          if(tab.id === "eligibility"){

              renderEligibilityTable(
                  tab,
                  rows,
                  version
              );

              return;
          }


          /*
             SPECIAL PPI
          */

          if(tab.id === "ppi"){

              renderPpiTable(
                  tab,
                  rows,
                  version
              );

              return;
          }


          tableArea.style.overflow =
              "auto";


          if(rows.length === 0){

              tableArea.innerHTML = `
                  <div class="empty">
                      No data found.
                  </div>
              `;

              recordNumber.textContent = "0";

              return;
          }


          const columns =
              getColumns(
                  tab,
                  rows
              );


          const visible =
              getVisibleRows(rows);


          recordNumber.textContent =
              visible.length.toLocaleString();


          const widths =
              calculateWidths(
                  tab,
                  rows,
                  columns
              );


          renderVirtualTable(
              tab,
              visible,
              columns,
              widths,
              version
          );

      }


      /* =========================================================
         OPEN TAB
      ========================================================= */

      async function openTab(id){

          const tab =
              tabsConfig.find(
                  item =>
                      item.id === id
              );


          if(!tab){
              return;
          }


          currentTab =
              tab;


          setActiveTab(id);


          currentList.textContent =
              tab.name;


          if(!filters.has(id)){

              filters.set(
                  id,
                  new Map()
              );

          }


        const version =
            ++renderVersion;


        if(id === "rx"){

            renderTable(
                tab,
                version
            );

            return;

        }


          if(id === "search"){

              const apgTab =
                  tabsConfig.find(item => item.id === "apg");

              const haadTab =
                  tabsConfig.find(item => item.id === "haad");

              showLoading("APG and HAAD lookups");
              recordNumber.textContent = "Loading";

              try{

                  const [apgRows,haadRows] = await Promise.all([
                      dataCache.has("__TAB__apg")
                          ? Promise.resolve(dataCache.get("__TAB__apg"))
                          : loadTab(apgTab),
                      dataCache.has("__TAB__haad")
                          ? Promise.resolve(dataCache.get("__TAB__haad"))
                          : loadTab(haadTab)
                  ]);

                  if(version !== renderVersion){
                      return;
                  }

                  apgTab.rows = apgRows;
                  haadTab.rows = haadRows;
                  renderSearchTab(apgRows,haadRows,version);
                  return;

              }
              catch(error){

                  if(version !== renderVersion){
                      return;
                  }

                  tableArea.innerHTML = `
                      <div class="error">
                          <strong>Could not load APG Formulary or HAAD List data</strong>
                          <br><br>
                          ${error.message}
                      </div>
                  `;
                  recordNumber.textContent = "Error";
                  return;

              }

          }


          /*
             REFILL IS A CUSTOM CALCULATOR.

             We do not need to load the JSON in order
             to display the calculator.
          */

          if(id === "refill"){

              renderTable(
                  tab,
                  version
              );

              scheduleBackgroundPreload();

              return;

          }


          if(
              dataCache.has(
                  "__TAB__" + id
              )
          ){

              tab.rows =
                  dataCache.get(
                      "__TAB__" + id
                  );


              renderTable(
                  tab,
                  version
              );


              return;
          }


          showLoading(
              tab.name
          );


          recordNumber.textContent =
              "Loading";


          try{

              const rows =
                  await loadTab(tab);


              if(
                  version !== renderVersion
              ){
                  return;
              }


              tab.rows =
                  rows;


              renderTable(
                  tab,
                  version
              );


              scheduleBackgroundPreload();

          }
          catch(error){

              if(
                  version !== renderVersion
              ){
                  return;
              }


              console.error(error);


              tableArea.style.overflow =
                  "auto";


              tableArea.innerHTML = `

                  <div class="error">

                      <strong>
                          Could not load ${tab.name}
                      </strong>

                      <br><br>

                      ${error.message}

                      <br><br>

                      Check the JSON filename in GitHub.

                  </div>

              `;


              recordNumber.textContent =
                  "Error";

          }

      }


      /* =========================================================
         BACKGROUND PRELOAD
      ========================================================= */

      let preloadStarted = false;


      async function scheduleBackgroundPreload(){

          if(preloadStarted){
              return;
          }


          preloadStarted = true;


          await new Promise(
              resolve =>
                  setTimeout(
                      resolve,
                      1200
                  )
          );


          const pending =
              tabsConfig.filter(
                tab =>
                    tab.id !== "search" &&
                    tab.id !== "rx" &&
                    !dataCache.has(
                          "__TAB__" + tab.id
                      )
              );


          const BATCH_SIZE = 2;


          for(
              let i=0;
              i<pending.length;
              i+=BATCH_SIZE
          ){

              const batch =
                  pending.slice(
                      i,
                      i+BATCH_SIZE
                  );


              await Promise.all(
                  batch.map(
                      async tab => {

                          try{

                              const rows =
                                  await loadTab(tab);

                              tab.rows =
                                  rows;

                          }
                          catch(error){

                              console.warn(
                                  "Background preload failed:",
                                  tab.name,
                                  error
                              );

                          }

                      }
                  )
              );


              await new Promise(
                  resolve =>
                      setTimeout(
                          resolve,
                          20
                      )
              );

          }

      }


      /* =========================================================
         OPEN NORMAL FILTER
      ========================================================= */

      function openFilter(
          column,
          button,
          context = null
      ){

          if(!currentTab){
              return;
          }


          filterMode =
              context
                  ? "custom-table"
                  : "normal";

          filterContext = context;


          filterColumn =
              column;


          const values =
              new Set();


          if(context){

              for(const row of context.rows){
                  values.add(
                      getApgCapCellValue(
                          row,
                          column,
                          context.columns
                      )
                  );
              }

          }
          else if(
              currentTab.id === "eligibility" &&
              column === "Eligibility Portal"
          ){

              const rows =
                  currentTab.rows || [];


              for(
                  let i=2;
                  i<rows.length;
                  i+=2
              ){

                  const portal =
                      valueString(
                          rows[i][
                              "Unnamed: 0"
                          ]
                      );


                  if(portal){

                      values.add(
                          portal
                      );

                  }

              }

          }
          else{

              const columns =
                  getColumns(
                      currentTab,
                      currentTab.rows || []
                  );


              const columnIndex =
                  columns.indexOf(column);


              for(
                  const row of getDisplayRows(currentTab)
              ){

                  values.add(
                      Array.isArray(row)
                          ? valueString(
                              columnIndex >= 0
                                  ? row[columnIndex]
                                  : ""
                          )
                          : valueString(
                              row[column]
                          )
                  );

              }

          }


          filterAllValues =
              Array.from(values);


          filterAllValues.sort(
              (a,b)=>
                  a.localeCompare(
                      b,
                      undefined,
                      {
                          numeric:true,
                          sensitivity:"base"
                      }
                  )
          );


          const state = context
              ? customTableFilters.get(context.key)
              : filters.get(currentTab.id);


          const existing =
              state &&
              state.get(column);


          if(existing){

              temporarySelection =
                  new Set(existing);

          }
          else{

              temporarySelection =
                  new Set(
                      filterAllValues
                  );

          }


          filterTitle.textContent =
              "Filter: " + column;


          filterSearch.value =
              "";


          renderFilterValues();


          filterPopup.style.display =
              "block";


          positionFilterPopup(button);

      }


      /* =========================================================
         OPEN PPI SPECIALTY FILTER
      ========================================================= */

      function openPpiSpecialtyFilter(button){

          filterMode =
              "ppi-specialty";


          filterColumn =
              "Eligible Clinician Specialty";


          filterAllValues =
              [...ppiSpecialtyAllValues];


          ppiSpecialtyTemporarySelection =
              new Set(
                  ppiSpecialtyFilters.size > 0
                      ? ppiSpecialtyFilters
                      : filterAllValues
              );


          filterTitle.textContent =
              "Filter: Eligible Clinician Specialty";


          filterSearch.value =
              "";


          renderFilterValues();


          filterPopup.style.display =
              "block";


          ppiSpecialtyFilterOpen =
              true;


          positionFilterPopup(button);

      }


      /* =========================================================
         POSITION FILTER POPUP
      ========================================================= */

      function positionFilterPopup(button){

          const rect =
              button.getBoundingClientRect();


          const width =
              filterPopup.offsetWidth;


          const height =
              filterPopup.offsetHeight;


          let left =
              rect.left;


          let top =
              rect.bottom + 5;


          if(
              left + width >
              window.innerWidth - 10
          ){

              left =
                  window.innerWidth -
                  width -
                  10;

          }


          if(
              top + height >
              window.innerHeight - 10
          ){

              top =
                  rect.top -
                  height -
                  5;

          }


          left =
              Math.max(
                  10,
                  left
              );


          top =
              Math.max(
                  10,
                  top
              );


          filterPopup.style.left =
              left + "px";


          filterPopup.style.top =
              top + "px";


          filterSearch.focus();

      }


      /* =========================================================
         FILTER VALUES
      ========================================================= */

      function renderFilterValues(){

          const search =
              filterSearch.value
                  .trim()
                  .toLowerCase();


          filterValues.innerHTML = "";


          const fragment =
              document.createDocumentFragment();


          const selection =
              filterMode === "ppi-specialty"
                  ? ppiSpecialtyTemporarySelection
                  : temporarySelection;


          for(
              const value of filterAllValues
          ){

              const display =
                  value === ""
                      ? "(Blank)"
                      : value;


              if(
                  search &&
                  !display
                      .toLowerCase()
                      .includes(search)
              ){

                  continue;

              }


              const label =
                  document.createElement("label");

              label.className =
                  "filter-value";


              const checkbox =
                  document.createElement("input");

              checkbox.type =
                  "checkbox";


              checkbox.checked =
                  selection.has(
                      value
                  );


              checkbox.addEventListener(
                  "change",
                  () => {

                      if(checkbox.checked){

                          selection.add(
                              value
                          );

                      }
                      else{

                          selection.delete(
                              value
                          );

                      }

                  }
              );


              const text =
                  document.createElement("span");

              text.className =
                  "filter-value-text";

              text.textContent =
                  display;

              text.title =
                  display;


              label.appendChild(
                  checkbox
              );

              label.appendChild(
                  text
              );


              fragment.appendChild(
                  label
              );

          }


          filterValues.appendChild(
              fragment
          );

      }


      /* =========================================================
         FILTER SEARCH
      ========================================================= */

      filterSearch.addEventListener(
          "input",
          renderFilterValues
      );


      /* =========================================================
         SELECT ALL
      ========================================================= */

      document
          .getElementById("selectAll")
          .addEventListener(
              "click",
              () => {

                  if(
                      filterMode === "ppi-specialty"
                  ){

                      ppiSpecialtyTemporarySelection =
                          new Set(
                              filterAllValues
                          );

                  }
                  else{

                      temporarySelection =
                          new Set(
                              filterAllValues
                          );

                  }


                  renderFilterValues();

              }
          );


      /* =========================================================
         UNCHECK ALL
      ========================================================= */

      document
          .getElementById("uncheckAll")
          .addEventListener(
              "click",
              () => {

                  if(
                      filterMode === "ppi-specialty"
                  ){

                      ppiSpecialtyTemporarySelection =
                          new Set();

                  }
                  else{

                      temporarySelection =
                          new Set();

                  }


                  renderFilterValues();

              }
          );


      /* =========================================================
         APPLY FILTER
      ========================================================= */

      document
          .getElementById("applyFilter")
          .addEventListener(
              "click",
              () => {

                  if(
                      filterMode === "ppi-specialty"
                  ){

                      if(
                          ppiSpecialtyTemporarySelection.size ===
                          filterAllValues.length
                      ){

                          ppiSpecialtyFilters.clear();

                      }
                      else{

                          ppiSpecialtyFilters.clear();

                          for(
                              const value of
                              ppiSpecialtyTemporarySelection
                          ){

                              ppiSpecialtyFilters.add(
                                  value
                              );

                          }

                      }


                      closeFilter();


                      if(
                          currentTab &&
                          currentTab.id === "ppi"
                      ){

                          renderTable(
                              currentTab,
                              ++renderVersion
                          );

                      }

                      return;

                  }


                  if(filterMode === "custom-table"){

                      if(!filterContext || filterColumn === null){
                          return;
                      }

                      const state =
                          customTableFilters.get(filterContext.key);

                      if(
                          temporarySelection.size ===
                          filterAllValues.length
                      ){
                          state.delete(filterColumn);
                      }
                      else{
                          state.set(
                              filterColumn,
                              new Set(temporarySelection)
                          );
                      }

                      const context = filterContext;
                      closeFilter();
                      context.onApply();
                      return;

                  }


                  if(
                      !currentTab ||
                      filterColumn === null
                  ){
                      return;
                  }


                  const state =
                      filters.get(
                          currentTab.id
                      );


                  if(
                      temporarySelection.size ===
                      filterAllValues.length
                  ){

                      state.delete(
                          filterColumn
                      );

                  }
                  else{

                      state.set(
                          filterColumn,
                          new Set(
                              temporarySelection
                          )
                      );

                  }


                  closeFilter();


                  renderTable(
                      currentTab,
                      ++renderVersion
                  );

              }
          );


      /* =========================================================
         CANCEL
      ========================================================= */

      document
          .getElementById("cancelFilter")
          .addEventListener(
              "click",
              closeFilter
          );


      /* =========================================================
         CLOSE FILTER
      ========================================================= */

      function closeFilter(){

          filterPopup.style.display =
              "none";

          filterColumn =
              null;

          filterMode =
              "normal";

          filterContext =
              null;

          ppiSpecialtyFilterOpen =
              false;

      }


      /* =========================================================
         CLEAR FILTERS
      ========================================================= */

      document
          .getElementById("clearButton")
          .addEventListener(
              "click",
              () => {

                  if(!currentTab){
                      return;
                  }


                  filters.set(
                      currentTab.id,
                      new Map()
                  );

                  if(currentTab.id === "apg-hcpcs"){
                      customTableFilters.clear();
                  }


                  if(
                      currentTab.id === "ppi"
                  ){

                      ppiSpecialtyFilters.clear();

                  }


                  /*
                     For Refill, Clear Filters simply
                     rebuilds the calculator fields.
                  */

                  closeFilter();


                  renderTable(
                      currentTab,
                      ++renderVersion
                  );

              }
          );


      /* =========================================================
         OUTSIDE CLICK
      ========================================================= */

      document.addEventListener(
          "mousedown",
          event => {

              if(
                  filterPopup.style.display === "block" &&

                  !filterPopup.contains(
                      event.target
                  ) &&

                  !event.target.closest(
                      ".filter-button"
                  ) &&

                  !event.target.closest(
                      ".ppi-specialty-filter"
                  )
              ){

                  closeFilter();

              }

          }
      );


      /* =========================================================
         ESCAPE
      ========================================================= */

      document.addEventListener(
          "keydown",
          event => {

              if(event.key === "Escape"){

                  closeFilter();

              }

          }
      );


      /* =========================================================
         START
      ========================================================= */

      createTabs();

      openTab("apg");

      </script>
